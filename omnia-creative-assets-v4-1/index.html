  function openBulkCopyImportV3(brief){showModal(`<div class="modal-head"><div><h2>Import copy document</h2><p style="margin:5px 0 0;color:#776f82;font-size:9px">Paste one structured document and map every concept in a single action.</p></div><button class="modal-close" data-action="close-modal">${icon('x')}</button></div><form id="v3BulkCopyImportForm" data-brief-id="${brief.id}"><div class="modal-body"><label class="form-label">Paste document<textarea name="copyDoc" style="min-height:260px" placeholder="### C-4471\nHeadline: Train Live With Tom\nBody:\nFull body copy here...\n\n### C-4472\nHeadline: Attention Dog Owners\nBody:\nFull body copy here..."></textarea></label><div class="v3-bulk-import-example">Use a concept ID or exact concept name after ###.\nHeadline: one line\nBody:\nmultiple lines until the next ### section.</div></div><div class="modal-footer"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">${icon('upload')}Parse and fill all concepts</button></div></form>`);}

  function submitBriefV3(){const brief=briefById(ui.briefId);if(!brief)return;if(!brief.overview||!brief.concepts.length){showToast('Brief is incomplete','Add an objective and at least one concept request before submitting.','warning');return;}brief.briefSubmitted=true;brief.stageIndex=Math.max(2,brief.stageIndex);brief.status='Design in progress';brief.lastUpdated='Just now';brief.activity.unshift({time:'Just now',day:'Today',type:'brief',title:'Brief submitted to design',body:`${brief.concepts.length} concept request${brief.concepts.length===1?'':'s'} handed to ${brief.designer}.`});saveState();render();showToast('Brief submitted',`${brief.designer} now has a clear, frozen starting point.`,'success');}

  function addDesignDeliverableV3(form){const brief=briefById(form.dataset.briefId);const fd=new FormData(form);const concept=brief.concepts.find(c=>c.id===fd.get('conceptId'));if(!concept)return;const id=generateAssetId();const index=concept.assets.length;const hasFile=fd.get('hasFile')==='yes';const asset={id,variation:index+1,status:hasFile?'Ready':'Design placeholder',workflowStatus:hasFile?'Delivered':'Designing',launchStatus:'Not ready',platformAdId:'',onImageCopy:String(fd.get('onImageCopy')||''),deliveredBy:hasFile?brief.designer:'',deliveredAt:hasFile?'Just now':'',launchedAt:'',spend:0,revenue:0,cpa:0,roas:0,verdict:'Pending',lastVerdict:'',preview:hasFile?`${brief.client.toLowerCase()}-${index+1}`:'placeholder',ratio:String(fd.get('ratio')),history:[],assetRole:(!concept.parentAssetId&&index===0)?'Primary concept':'Variation',fileName:hasFile?`${id}_${brief.medium.toLowerCase()}_final.${brief.medium==='Image'?'png':'mp4'}`:''};concept.assets.push(asset);concept.status='In design';brief.stageIndex=Math.max(3,brief.stageIndex);brief.status='Design in progress';brief.lastUpdated='Just now';brief.activity.unshift({time:'Just now',day:'Today',type:'design',title:`${versionInfoV3(concept,asset).label} deliverable added`,body:hasFile?`${id} delivered by ${brief.designer}.`:`${id} created as a placeholder; final file still pending.`});saveState();closeModal();render();showToast('Designer deliverable added',`${versionInfoV3(concept,asset).label} · ${id} is now tracked under ${concept.id}.`,'success');}

  function deliverAssetV3(assetId){const result=assetById(assetId);if(!result?.asset)return;const {asset,brief}=result;asset.preview=`${brief.client.toLowerCase()}-${asset.variation}`;asset.status='Ready';asset.workflowStatus='Delivered';asset.deliveredAt='Just now';asset.deliveredBy=brief.designer;asset.fileName=`${asset.id}_${brief.medium.toLowerCase()}_final.${brief.medium==='Image'?'png':'mp4'}`;brief.stageIndex=Math.max(4,brief.stageIndex);brief.status='Copy in progress';brief.activity.unshift({time:'Just now',day:'Today',type:'deliver',title:'Final creative uploaded',body:`${asset.id} is available to copywriters and media buyers.`});saveState();render();showToast('Final creative uploaded',`${asset.id} is now downloadable from Omnia.`,'success');}

  function saveAllCopyV3(){const brief=briefById(ui.briefId);if(!brief)return;let changes=0,rebuilds=0;document.querySelectorAll('[data-v3-copy-field]').forEach(el=>{const concept=brief.concepts.find(c=>c.id===el.dataset.conceptId);if(!concept)return;const key=el.dataset.v3CopyField;if(concept.copy[key]!==el.value){concept.copy[key]=el.value;changes++;}});document.querySelectorAll('[data-v3-on-image-copy]').forEach(el=>{const result=assetById(el.dataset.v3OnImageCopy);if(result?.asset&&result.asset.onImageCopy!==el.value){result.asset.onImageCopy=el.value;changes++;}});if(changes){brief.concepts.forEach(concept=>concept.assets.forEach(asset=>{if(asset.deliveredAt&&asset.launchStatus!=='Matched'&&asset.workflowStatus==='Delivered'){asset.workflowStatus='Rebuild Required';asset.launchStatus='Blocked';asset.status='Rebuild Required';rebuilds++;}}));brief.stageIndex=Math.max(5,brief.stageIndex);brief.status='Copy complete';brief.lastUpdated='Just now';brief.activity.unshift({time:'Just now',day:'Today',type:'copy',title:'Batch copy saved',body:`${changes} field${changes===1?'':'s'} updated.${rebuilds?` ${rebuilds} delivered creative${rebuilds===1?'':'s'} require rebuild.`:''}`});saveState();render();showToast('All copy saved',rebuilds?`${rebuilds} delivered creative${rebuilds===1?'':'s'} flagged for rebuild.`:'The batch is ready for final delivery and launch.','success');}else showToast('No copy changes','The form already matches the Omnia record.');}

  function importBulkCopyV3(form){const brief=briefById(form.dataset.briefId);const raw=String(new FormData(form).get('copyDoc')||'');const sections=raw.split(/^###\s+/m).map(s=>s.trim()).filter(Boolean);let filled=0;sections.forEach(section=>{const lines=section.split('\n');const key=lines.shift().trim();const concept=brief.concepts.find(c=>c.id.toLowerCase()===key.toLowerCase()||c.name.toLowerCase()===key.toLowerCase());if(!concept)return;const headlineLine=lines.find(l=>/^headline\s*:/i.test(l));const bodyIndex=lines.findIndex(l=>/^body\s*:/i.test(l));if(headlineLine)concept.copy.headline=headlineLine.replace(/^headline\s*:/i,'').trim();if(bodyIndex>=0)concept.copy.primary=lines.slice(bodyIndex+1).join('\n').trim();filled++;});if(!filled){showToast('No concepts matched','Use a concept ID or exact concept name after each ### heading.','warning');return;}brief.stageIndex=Math.max(5,brief.stageIndex);brief.status='Copy in progress';brief.activity.unshift({time:'Just now',day:'Today',type:'copy',title:'Copy document imported',body:`${filled} concept${filled===1?'':'s'} populated from one document.`});saveState();closeModal();render();showToast('Copy imported',`${filled} concept${filled===1?'':'s'} populated in one action.`,'success');}

  function markGlobalLaunchedV3(){const ids=[...ui.selectedLaunchAssets];if(!ids.length){showToast('Select creatives first','Choose one or more launch-ready assets.','warning');return;}let count=0;ids.forEach(id=>{const result=assetById(id);if(!result?.asset)return;const {asset,brief}=result;if(asset.launchStatus==='Matched')return;asset.status='Launched';asset.launchStatus='Matched';asset.launchedAt='Just now';asset.platformAdId=asset.platformAdId||`1202${Math.floor(100000000+Math.random()*899999999)}`;brief.stageIndex=Math.max(7,brief.stageIndex);brief.status='Launch in progress';brief.activity.unshift({time:'Just now',day:'Today',type:'launch',title:'Creative launched',body:`${asset.id} matched to Meta from the Media Buyer Queue.`});count++;});ui.selectedLaunchAssets.clear();saveState();render();showToast('Launch queue updated',`${count} creative${count===1?'':'s'} marked launched and matched.`,'success');}

  function runAllVerdictsV3(){let changes=0;state.briefs.forEach(brief=>{const target=clientMeta(brief.client).targetCPA;brief.concepts.forEach(concept=>concept.assets.forEach(asset=>{if(asset.launchStatus!=='Matched'||!asset.spend)return;let next='Pending';if(asset.spend<500)next='Pending';else if(asset.cpa<=target*.7&&asset.spend>=5000)next='Scale';else if(asset.cpa<=target*1.15)next='Keep';else next='Kill';if(asset.verdict!==next){asset.verdict=next;asset.lastVerdict='Just now';changes++;}}));});saveState();render();showToast('Performance database synced',changes?`${changes} verdict${changes===1?'':'s'} changed.`:'No verdicts changed.','success');}

  function xmlEscV3(value){return String(value||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));}
  function downloadCreativeV3(assetId){const result=assetById(assetId);if(!result?.asset){showToast('Creative not found','The permanent ID no longer exists.','warning');return;}const {asset,concept,brief}=result;const vi=versionInfoV3(concept,asset);const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100c1d"/><stop offset="1" stop-color="#2b1744"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><rect x="64" y="64" width="952" height="952" rx="38" fill="#171125" stroke="#8b5cf6" stroke-opacity=".35"/><text x="108" y="145" fill="#b66cff" font-family="Arial" font-size="30" font-weight="700" letter-spacing="7">OMNIA FINAL CREATIVE</text><text x="108" y="268" fill="#ffffff" font-family="Arial" font-size="62" font-weight="800">${xmlEscV3(concept.name)}</text><text x="108" y="355" fill="#d7cce4" font-family="Arial" font-size="34">${xmlEscV3(asset.onImageCopy||concept.copy.headline||'Final creative')}</text><rect x="108" y="430" width="864" height="2" fill="#ffffff" opacity=".12"/><text x="108" y="535" fill="#ffffff" font-family="Arial" font-size="42" font-weight="700">${xmlEscV3(vi.label)} · ${xmlEscV3(asset.id)}</text><text x="108" y="600" fill="#9c8eaa" font-family="Arial" font-size="25">${xmlEscV3(clientMeta(brief.client).name)} · ${xmlEscV3(brief.funnel)} · ${xmlEscV3(brief.medium)}</text><foreignObject x="108" y="675" width="864" height="180"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#b7a9c5;font-size:24px;line-height:1.45;word-break:break-all">${xmlEscV3(adName(brief,concept,asset))}</div></foreignObject><text x="108" y="958" fill="#6f607e" font-family="Arial" font-size="20">Prototype export · permanent ID preserved</text></svg>`;const blob=new Blob([svg],{type:'image/svg+xml'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`${adName(brief,concept,asset)}.svg`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Final creative downloaded',`${asset.id} exported with its permanent ad name.`,'success');}

esign','Copy','Launch Ready','Backlog','Partial','Live','Cancelled','Blocked'].map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${s}</option>`).join('')}</select><span class="badge badge-muted">${filtered.length} batches</span></div><div class="glass-card"><div class="launch-table-wrap"><table class="batch-table"><thead><tr><th>Client / batch</th><th>Pod</th><th>Overall status</th><th>Required / built</th><th>Live / backlog</th><th>Owners</th><th>Next action</th></tr></thead><tbody>${filtered.map(b=>{const a=v4BatchAssets(b),s=v4BatchStatus(b),n=v4NextAction(b);return `<tr data-open-brief="${b.id}"><td><div class="batch-name-cell">${clientLogo(b.client)}<div class="batch-copy"><strong>${esc(clientMeta(b.client).name)}</strong><span>${esc(b.slug)} · ${esc(b.funnel)} · ${esc(b.medium)}</span></div></div></td><td><span class="focus-chip">${esc(clientMeta(b.client).pod)}</span></td><td>${v4StatusPill(s,b.v4Closed)}</td><td><strong>${requestedCountV3(b)}</strong><span style="color:#716879"> / ${a.length}</span></td><td><strong>${a.filter(r=>v4Disposition(r.asset,r.concept)==='live').length}</strong><span style="color:#716879"> / ${a.filter(r=>v4Disposition(r.asset,r.concept)==='backlog').length}</span></td><td><div class="owner-stack">${briefPeopleV3(b).map(personDot).join('')}</div></td><td><div class="v4-next-action">${icon(n[0])}<span>${esc(n[1])}</span></div></td></tr>`;}).join('')||`<tr><td colspan="7">${emptyState('file','No creative assets match','Clear one or more filters.')}</td></tr>`}</tbody></table></div></div></section>`;};

  function renderBatchSidebarV42(brief,c,status){const stageOwner=ui.detailTab==='brief'?brief.briefer:ui.detailTab==='design'?brief.designer:ui.detailTab==='copy'?brief.copywriter:ui.detailTab==='launch'?brief.mediaBuyer:brief.owner;const finalCopy=brief.concepts.filter(x=>x.v4CopyFinal&&v4ConceptCopyReady(x)).length;return ui.v42SidebarOpen?`<div class="v42-drawer-backdrop" data-action="toggle-batch-sidebar-v42"></div><aside class="v42-batch-drawer"><div class="v42-drawer-top"><span>Batch details</span><button class="btn btn-ghost btn-xs" data-action="toggle-batch-sidebar-v42">${icon('x')}Close</button></div><div class="v42-drawer-identity">${clientLogo(brief.client,'batch-hero-logo')}<div><h1>${esc(brief.slug)}</h1><p>${esc(c.name)} · ${esc(c.pod)} · ${esc(brief.funnel)} · ${esc(brief.medium)}</p></div></div><div class="v42-drawer-status">${v4StatusPill(status,brief.v4Closed)}</div><div class="v42-drawer-actions"><button class="btn btn-secondary btn-sm" data-action="open-url" data-url="${esc(brief.asanaUrl)}">${icon('external')}Asana task</button><button class="btn btn-secondary btn-sm" data-action="find-performance" data-brief-id="${brief.id}">${icon('chart')}Performance</button><button class="btn btn-primary btn-sm wide" data-action="open-media-batch" data-brief-id="${brief.id}">${icon('rocket')}Launch queue</button></div><div class="v42-drawer-card"><h3>Current workspace</h3><div class="status-list"><div class="status-row"><span>View</span><strong>${esc(WORKSPACE_TABS_V3.find(x=>x[0]===ui.detailTab)?.[2]||ui.detailTab)}</strong></div><div class="status-row"><span>Owner</span><span class="person-chip">${personDot(stageOwner)}${esc(stageOwner)}</span></div><div class="status-row"><span>Brief</span><strong>${brief.briefSubmitted?'Submitted':'Draft'}</strong></div><div class="status-row"><span>Design handoff</span><strong>${brief.v42DesignSubmitted?'Submitted':'Open'}</strong></div><div class="status-row"><span>Copy finalized</span><strong>${finalCopy}/${brief.concepts.length}</strong></div></div></div></aside>`:'';}renderDetail=function(){const brief=briefById(ui.briefId)||state.briefs[0];if(!brief)return emptyState('file','Creative asset not found','Return to Creative Command.');ui.briefId=brief.id;if(!WORKSPACE_TABS_V3.some(t=>t[0]===ui.detailTab))ui.detailTab='brief';const assets=brief.concepts.flatMap(c=>c.assets),c=clientMeta(brief.client),status=v4BatchStatus(brief);return `<section class="page detail-page"><div class="breadcrumbs"><button data-navigate="dashboard">Creative Command</button>${icon('chevron')}<button data-navigate="briefs">Creative Assets</button>${icon('chevron')}<span>${esc(brief.slug)}</span></div><div class="v42-workspace-head">${detailTabsV3()}<button class="btn btn-secondary btn-sm v42-batch-details-btn" data-action="toggle-batch-sidebar-v42">${icon('sliders')}Batch details</button></div>${renderDetailContentV4(brief,assets)}${renderBatchSidebarV42(brief,c,status)}</section>`;};
  function renderDetailContentV4(brief,assets){switch(ui.detailTab){case'brief':return renderBriefStageV4(brief);case'design':return renderDesignStageV4(brief);case'copy':return renderCopyStageV4(brief);case'launch':return renderLaunchStageV4(brief,assets);case'activity':return renderActivityStageV3(brief);default:return renderBriefStageV4(brief);}}

  function renderBriefStageV4(brief){const submitted=Boolean(brief.briefSubmitted);return `<div class="v42-stage-stack"><details class="glass-card v42-collapsible" open><summary><div class="v42-section-title"><span class="icon-box">${icon('briefcase')}</span><div><h2>Creative brief</h2><p>The strategist’s source of truth for this batch.</p></div></div><div class="v42-summary-right"><span class="badge ${submitted?'badge-green':'badge-amber'}">${submitted?'Submitted to design':'Draft'}</span><span class="chev">${icon('chevron-down')}</span></div></summary><div class="v42-section-body"><div class="v42-section-toolbar"><button class="btn btn-ghost btn-sm" data-action="edit-brief">${icon('edit')}Edit brief</button></div><div class="v42-brief-grid"><div class="v42-brief-field full"><label>Objective</label><p>${esc(brief.overview||'No objective entered yet.')}</p></div><div class="v42-brief-field"><label>Client + offer</label><strong>${esc(clientMeta(brief.client).name)} · ${esc(brief.funnel)}</strong></div><div class="v42-brief-field"><label>Output requested</label><strong>${esc(brief.medium)} · ${requestedCountV3(brief)} total creative assets</strong></div><div class="v42-brief-field"><label>Target launch date</label><strong>${esc(brief.dueDate||brief.targetWeek||'Not set')}</strong></div><div class="v42-brief-field"><label>Owners</label><strong>${esc(brief.briefer)} → ${esc(brief.designer)}</strong></div><div class="v42-brief-field full"><label>Resources</label><div class="link-row"><button class="btn btn-secondary btn-xs" data-action="open-url" data-url="${esc(brief.loomUrl)}">${icon('play')}Brief Loom</button><button class="btn btn-secondary btn-xs" data-action="open-url" data-url="${esc(brief.asanaUrl)}">${icon('external')}Asana task</button></div></div><div class="v42-brief-field full"><label>Global directives</label><div class="v3-directive-list">${brief.directives.map(d=>`<div class="v3-directive">${icon('check')}<span>${esc(d)}</span></div>`).join('')||'<span style="font-size:8.5px;color:#70677a">No directives entered.</span>'}</div></div></div><div class="v42-handoff"><div class="v42-handoff-copy"><strong>${submitted?'Brief submitted to design':'Ready for the designer?'}</strong><span>${submitted?`${brief.designer} has the approved brief and can begin design.`:'This is the explicit handoff from strategy to design.'}</span></div><button class="btn btn-primary btn-handoff ${submitted?'complete':''}" data-action="submit-brief" ${submitted?'disabled':''}>${submitted?icon('check')+'Submitted to design':icon('arrow')+'Submit to design'}</button></div></div></details><details class="glass-card v42-collapsible" open><summary><div class="v42-section-title"><span class="icon-box">${icon('spark')}</span><div><h2>Concept requests</h2><p>${brief.concepts.length} requested concept${brief.concepts.length===1?'':'s'} for the designer.</p></div></div><div class="v42-summary-right"><span class="badge badge-muted">${brief.concepts.length} concepts</span><span class="chev">${icon('chevron-down')}</span></div></summary><div class="v42-section-body"><div class="v42-concept-requests-head"><p>Each request defines the idea, source, direction, and number of variations required.</p><button class="btn btn-secondary btn-sm" data-action="add-concept">${icon('plus')}Add concept request</button></div><div class="v3-concept-request-list">${brief.concepts.map((concept,index)=>`<details class="v3-concept-request"><summary><span class="v3-concept-request-index">${index+1}</span><span class="v3-concept-request-title"><strong>${esc(concept.name)}</strong><span>${esc(concept.id)} · ${concept.parentAssetId?'Winner refresh':'Net-new idea'} · ${concept.expectedVariations} variation${concept.expectedVariations===1?'':'s'} requested</span></span><span class="badge ${concept.parentAssetId?'badge-green':'badge-purple'}">${concept.parentAssetId?'Winner source':esc(concept.pitch.source)}</span><span class="v42-concept-summary-hint">Details ${icon('chevron-down')}</span></summary><div class="v3-concept-request-body"><div class="v3-request-field"><label>Idea source</label><div>${concept.parentAssetId?`Winner ${esc(concept.parentAssetId)}`:`${esc(concept.pitch.source)} · ${esc(concept.pitch.id)} ${esc(concept.pitch.author)}`}</div></div><div class="v3-request-field"><label>Requested deliverables</label><div>${concept.expectedVariations} final variation${concept.expectedVariations===1?'':'s'}</div></div><div class="v3-request-field full"><label>Direction</label><div>${esc(concept.direction||'No direction entered.')}</div></div></div></details>`).join('')||emptyState('spark','No concept requests yet','Add the first request before submitting the brief.')}</div></div></details></div>`;}
  function v4DeliverableCard(brief,concept,asset){const vi=versionInfoV3(concept,asset);return `<article class="v3-deliverable-card"><div class="v3-deliverable-preview"><span class="badge badge-purple version-chip">${vi.label} · ${vi.role}</span>${previewV3(asset,concept)}</div><div class="v3-deliverable-copy"><strong>${esc(asset.id)} · ${v4FileReady(asset)?'Final file ready':'Placeholder'}</strong><span>${esc(asset.fileName||'No final file uploaded')}</span><div class="v3-deliverable-actions"><button class="btn btn-ghost btn-xs" data-open-asset="${asset.id}">${icon('eye')}Inspect</button>${v4FileReady(asset)?`<button class="btn btn-secondary btn-xs" data-action="download-creative" data-asset-id="${asset.id}">${icon('download')}Download</button>`:`<button class="btn btn-secondary btn-xs" data-action="deliver-asset-v3" data-asset-id="${asset.id}">${icon('upload')}Upload final</button>`}</div></div></article>`;}
  function v42ConceptDesignReady(concept){const requested=Math.max(1,Number(concept.expectedVariations)||1);return concept.assets.length>=requested&&concept.assets.every(v4FileReady);}function v42VariationCard(brief,concept,asset,index){const ready=v4FileReady(asset),name=adName(brief,concept,asset);return `<article class="v42-variation-row"><div class="v42-variation-meta"><span class="badge ${ready?'badge-green':'badge-amber'}">Variation V${index+1}</span><strong>${esc(concept.name)} · V${index+1}</strong><code>${esc(name)}</code><span>${esc(asset.id)} · ${ready?'Final file ready':'File still required'}</span></div><div class="v42-variation-thumb">${previewV3(asset,concept,true)}</div><div class="v42-variation-actions"><button class="btn btn-ghost btn-xs" data-open-asset="${asset.id}">${icon('eye')}Inspect</button>${ready?`<button class="btn btn-secondary btn-xs" data-action="download-creative" data-asset-id="${asset.id}">${icon('download')}Download</button>`:`<button class="btn btn-secondary btn-xs" data-action="deliver-asset-v3" data-asset-id="${asset.id}">${icon('upload')}Upload final</button>`}</div></article>`;}function renderDesignStageV4(brief){const submitted=Boolean(brief.v42DesignSubmitted),allReady=brief.concepts.length>0&&brief.concepts.every(v42ConceptDesignReady);return `<div><div class="glass-card v42-design-intro"><div><strong>Design workspace · ${esc(brief.designer)}</strong><span>Open only the concept you are working on. Each concept contains its source, brief, and final variations.</span></div><span class="badge ${submitted?'badge-green':allReady?'badge-purple':'badge-amber'}">${submitted?'Submitted for copy':allReady?'Ready to submit':'Design in progress'}</span></div><div class="v42-design-stack">${brief.concepts.map((concept,index)=>{const sourcePreview=concept.parentAssetId?(assetById(concept.parentAssetId)?.orphan?.preview||assetById(concept.parentAssetId)?.asset?.preview||concept.referenceType):concept.referenceType;const ready=v42ConceptDesignReady(concept);return `<details class="v42-design-concept" ${index===0?'open':''}><summary><div class="v42-concept-name"><code>${esc(concept.id)}</code><div><strong>${esc(concept.name)}</strong><span>${concept.parentAssetId?'Source winner attached':'Net-new concept'} · ${concept.assets.length}/${Math.max(1,Number(concept.expectedVariations)||1)} variations delivered</span></div></div><div class="v42-concept-actions"><span class="badge ${ready?'badge-green':'badge-amber'}">${ready?'Design complete':'In progress'}</span><button class="btn btn-ghost btn-xs v42-delete-btn" data-action="delete-concept-v42" data-concept-id="${concept.id}">${icon('x')}Delete</button><span class="chev">${icon('chevron-down')}</span></div></summary><div class="v42-design-body"><div class="v42-design-layout"><section class="v42-source-card"><div class="v42-card-kicker"><span>${concept.parentAssetId?'Source winner':'Concept'}</span><span>${concept.parentAssetId?esc(concept.parentAssetId):'Net new'}</span></div>${concept.parentAssetId?`${previewHTML(sourcePreview,concept.literalCopy)}<div class="v42-source-meta"><strong>${esc(concept.parentAssetId)}</strong><span>The proven asset this refresh is based on.</span></div>`:`<div class="v42-net-new-source"><div class="eyebrow">CONCEPT NAME</div><h3>${esc(concept.name)}</h3><p>This is the creative idea. It does not require a separate V0 image slot.</p></div>`}</section><section class="v42-brief-card"><div class="v42-card-kicker"><span>Brief</span><span>${esc(concept.pitch.source)}</span></div><dl><div><dt>Direction</dt><dd>${esc(concept.direction||'No direction entered.')}</dd></div><div><dt>Requested variations</dt><dd>${Math.max(1,Number(concept.expectedVariations)||1)} final execution${Math.max(1,Number(concept.expectedVariations)||1)===1?'':'s'}</dd></div><div><dt>Idea source</dt><dd>${concept.parentAssetId?`Winner ${esc(concept.parentAssetId)}`:`${esc(concept.pitch.id)} · ${esc(concept.pitch.author)}`}</dd></div></dl></section><section class="v42-variations-card"><div class="v42-card-kicker"><span>Final variations</span><span>${concept.assets.length} delivered</span></div><div class="v42-variation-list">${concept.assets.map((asset,i)=>v42VariationCard(brief,concept,asset,i)).join('')||'<div class="empty-state" style="padding:24px"><div class="empty-state-icon">'+icon('image')+'</div><h3>No variations yet</h3><p>Add the first planned variation, then upload the final file when it is ready.</p></div>'}</div><button class="btn btn-ghost btn-sm v42-add-variation" data-action="add-variation-v42" data-concept-id="${concept.id}">${icon('plus')}Add variation</button></section></div></div></details>`;}).join('')||emptyState('image','No concepts to design','Submit the brief first.')}</div>${brief.concepts.length?`<div class="v42-handoff v42-design-handoff"><div class="v42-handoff-copy"><strong>${submitted?'Design submitted for copy':'Hand design to the copywriter'}</strong><span>${submitted?`${brief.copywriter} has the final design handoff and Figma board.`:'A Figma board link is required before this batch can move to Copy.'}</span></div>${submitted?`<div class="v42-figma-attached">${icon('check')} Figma board attached · ${esc(brief.figmaUrl)}</div><button class="btn btn-primary btn-handoff complete" disabled>${icon('check')}Submitted for copy</button>`:`<div class="v42-figma-field"><div><label for="v42FigmaUrl">Required Figma board link</label><input class="input" id="v42FigmaUrl" value="${esc(brief.figmaUrl||'')}" placeholder="https://www.figma.com/file/..."></div><button class="btn btn-primary btn-handoff" data-action="submit-design-v42" ${allReady?'':'disabled'}>${icon('arrow')}Submit for copy</button></div>`}</div>`:''}</div>`;}
  function renderCopyStageV4(brief){if(!brief.concepts.length)return emptyState('copy','No concepts available','Submit a brief first.');const allFinal=brief.concepts.every(c=>c.v4CopyFinal&&v4ConceptCopyReady(c));return `<div><div class="glass-card v42-copy-head"><div><strong>Copy workspace · ${esc(brief.copywriter)}</strong><span>Write one headline and body per concept, then add variation-level on-image copy where needed.</span></div><button class="btn btn-secondary btn-sm" data-action="open-bulk-copy-import">${icon('upload')}Import copy document</button></div>${brief.concepts.map((concept,index)=>`<details class="glass-card v42-copy-concept" ${index===0?'open':''}><summary><div class="v42-concept-name"><code>${esc(concept.id)}</code><div><strong>${esc(concept.name)}</strong><span>${concept.assets.length} variation${concept.assets.length===1?'':'s'} · concept-level copy</span></div></div><div class="v42-concept-actions"><span class="badge ${concept.v4CopyFinal?'badge-green':v4ConceptCopyReady(concept)?'badge-purple':'badge-amber'}">${concept.v4CopyFinal?'Final':v4ConceptCopyReady(concept)?'Ready to finalize':'Needs copy'}</span><span class="chev">${icon('chevron-down')}</span></div></summary><div class="v4-copy-body"><div class="v3-copy-fields"><label class="form-group"><span>Headline</span><textarea data-v3-copy-field="headline" data-concept-id="${concept.id}" placeholder="Ad headline…">${esc(concept.copy.headline||'')}</textarea></label><label class="form-group body"><span>Body copy</span><textarea data-v3-copy-field="primary" data-concept-id="${concept.id}" placeholder="Full ad body copy…">${esc(concept.copy.primary||'')}</textarea></label></div><div class="v42-copy-variations-title"><strong>Variations</strong><span>On-image copy is optional and belongs to the individual ad.</span></div><div class="v4-copy-variations">${concept.assets.map((asset,i)=>`<div class="v4-copy-variation"><div class="mini-preview">${previewV3(asset,concept,true)}</div><div><strong>V${i+1} · ${esc(asset.id)}</strong><span>${esc(concept.name)}</span></div><input class="input" data-v3-on-image-copy="${asset.id}" value="${esc(asset.onImageCopy||'')}" placeholder="On-image copy"><button class="btn btn-ghost btn-xs" data-open-asset="${asset.id}">${icon('eye')}Preview</button></div>`).join('')||'<div style="font-size:8px;color:#746a80">Designer variations have not been uploaded.</div>'}</div></div></details>`).join('')}<div class="v4-copy-final-bar"><p><strong>${allFinal?'Copy is final.':'Finalization is the handoff.'}</strong><br>${allFinal?'Every launch-ready variation can now appear in the Media Buyer Queue.':'Save a draft at any time. Mark final only after every concept has a headline and body copy.'}</p><div class="toolbar"><button class="btn btn-secondary btn-sm" data-action="save-copy-draft-v4">${icon('save')}Save draft</button><button class="btn btn-primary btn-sm" data-action="mark-copy-final-v4" ${allFinal?'disabled':''}>${allFinal?icon('check')+'Copy final':icon('arrow')+'Mark copy final + hand to launch'}</button></div></div></div>`;}
  function v4LaunchRow(brief,concept,asset){const vi=versionInfoV3(concept,asset),d=v4Disposition(asset,concept);return `<tr><td><div class="manifest-asset"><div class="manifest-thumb" data-open-asset="${asset.id}">${previewV3(asset,concept,true)}</div><div class="manifest-id"><strong>${vi.label} · ${asset.id}</strong><span>${esc(vi.role)}</span></div></div></td><td><strong>${esc(concept.name)}</strong><div style="font-size:7px;color:#746a80;margin-top:3px">${esc(concept.id)}</div></td><td class="ad-name-cell"><div class="ad-name-wrap"><code>${esc(adName(brief,concept,asset))}</code><button class="copy-inline" data-copy-text="${esc(adName(brief,concept,asset))}">${icon('copy')}</button></div></td><td><div class="v3-file-actions"><button class="btn btn-secondary btn-xs" data-action="download-creative" data-asset-id="${asset.id}">${icon('download')}Download</button><button class="btn btn-ghost btn-xs" data-action="open-url" data-url="${esc(brief.driveUrl)}">${icon('external')}Drive</button></div></td><td>${v4StatusPill(d==='ready'?'Launch Ready':d[0].toUpperCase()+d.slice(1))}</td><td><div class="v4-decision-group"><button class="v4-decision-btn live ${d==='live'?'active':''}" data-action="set-disposition-v4" data-asset-id="${asset.id}" data-disposition="live">Live</button><button class="v4-decision-btn backlog ${d==='backlog'?'active':''}" data-action="set-disposition-v4" data-asset-id="${asset.id}" data-disposition="backlog">Backlog</button><button class="v4-decision-btn cancelled ${d==='cancelled'?'active':''}" data-action="set-disposition-v4" data-asset-id="${asset.id}" data-disposition="cancelled">Cancel</button></div></td></tr>`;}
  function renderLaunchStageV4(brief,assets){const rows=v4BatchAssets(brief),counts={ready:0,live:0,backlog:0,cancelled:0,blocked:0};rows.forEach(({asset,concept})=>{const d=v4Disposition(asset,concept);if(counts[d]!==undefined)counts[d]++;});const status=v4BatchStatus(brief);return `<div><div class="v4-role-callout"><div class="icon">${icon('rocket')}</div><div><strong>Media Buyer handoff · ${esc(brief.mediaBuyer)}</strong><p>Download the final creative, copy its frozen ad name, publish it, then explicitly mark every variation Live, Backlog, or Cancelled.</p></div><div class="toolbar"><button class="btn btn-secondary btn-sm" data-action="copy-stage-link-v4" data-brief-id="${brief.id}" data-stage="launch">${icon('copy')}Copy Launch URL</button><button class="btn btn-primary btn-sm" data-action="open-media-batch" data-brief-id="${brief.id}">${icon('rocket')}Open global queue</button></div></div><div class="v4-launch-summary"><div class="v4-launch-stat"><span>Batch status</span><strong style="font-size:13px">${esc(status)}</strong></div><div class="v4-launch-stat"><span>Ready</span><strong>${counts.ready}</strong></div><div class="v4-launch-stat"><span>Live</span><strong>${counts.live}</strong></div><div class="v4-launch-stat"><span>Backlog</span><strong>${counts.backlog}</strong></div><div class="v4-launch-stat"><span>Cancelled</span><strong>${counts.cancelled}</strong></div></div><section class="glass-card"><div class="launch-table-wrap"><table class="launch-table"><thead><tr><th>Variation / ad</th><th>Finalized concept</th><th>Frozen ad name</th><th>Final creative</th><th>Current state</th><th>Launch decision</th></tr></thead><tbody>${rows.map(({asset,concept})=>v4LaunchRow(brief,concept,asset)).join('')||`<tr><td colspan="6">${emptyState('rocket','Nothing ready','Complete design and copy first.')}</td></tr>`}</tbody></table></div></section><div class="v4-batch-close"><p><strong>Close the full batch.</strong><br>Omnia closes automatically when every creative is Live or every creative is Cancelled. A mixed Live/Backlog/Cancelled batch requires a deliberate manual close.</p><div class="toolbar">${brief.v4Closed?`<span class="badge badge-green">${icon('check')}Closed ${esc(brief.v4ClosedAt||'')}</span><button class="btn btn-ghost btn-sm" data-action="reopen-batch-v4" data-brief-id="${brief.id}">Reopen</button>`:`<button class="btn btn-secondary btn-sm" data-action="close-batch-v4" data-brief-id="${brief.id}" ${!['Partial','Backlog'].includes(status)?'disabled':''}>${icon('lock')}Close mixed batch</button>`}</div></div></div>`;}

  function v4MediaRecords(){const f=ui.mediaFilters,q=f.query.toLowerCase().trim();return state.briefs.flatMap(v4BatchAssets).filter(({asset,concept,brief})=>{const c=clientMeta(brief.client),d=v4Disposition(asset,concept);const match=!q||[asset.id,adName(brief,concept,asset),concept.name,brief.slug,c.name].join(' ').toLowerCase().includes(q);const statusMatch=f.status==='all'||(f.status==='needs'&&d==='ready')||d===f.status;return match&&statusMatch&&(f.pod==='all'||c.pod===f.pod)&&(f.client==='all'||brief.client===f.client)&&(f.buyer==='all'||brief.mediaBuyer===f.buyer);});}

  function v4MediaVariationRow({asset,concept,brief}){const d=v4Disposition(asset,concept),vi=versionInfoV3(concept,asset);return `<tr><td><div class="batch-name-cell">${clientLogo(brief.client)}<div class="batch-copy"><strong>${esc(clientMeta(brief.client).name)}</strong><span>${esc(clientMeta(brief.client).pod)}</span></div></div></td><td><button class="btn btn-ghost btn-xs" data-action="open-stage-v4" data-brief-id="${brief.id}" data-stage="launch">${esc(brief.slug)}</button></td><td><strong>${esc(concept.name)}</strong><div style="font-size:7px;color:#746a80">${esc(concept.id)}</div></td><td><strong>${vi.label} · ${esc(asset.id)}</strong><div style="font-size:7px;color:#746a80">${esc(vi.role)}</div></td><td class="ad-name-cell"><div class="ad-name-wrap"><code>${esc(adName(brief,concept,asset))}</code><button class="copy-inline" data-copy-text="${esc(adName(brief,concept,asset))}">${icon('copy')}</button></div></td><td><button class="btn btn-secondary btn-xs" data-action="download-creative" data-asset-id="${asset.id}">${icon('download')}File</button></td><td>${v4StatusPill(d==='ready'?'Launch Ready':d[0].toUpperCase()+d.slice(1))}</td><td><div class="v4-decision-group"><button class="v4-decision-btn live ${d==='live'?'active':''}" data-action="set-disposition-v4" data-asset-id="${asset.id}" data-disposition="live">Live</button><button class="v4-decision-btn backlog ${d==='backlog'?'active':''}" data-action="set-disposition-v4" data-asset-id="${asset.id}" data-disposition="backlog">Backlog</button><button class="v4-decision-btn cancelled ${d==='cancelled'?'active':''}" data-action="set-disposition-v4" data-asset-id="${asset.id}" data-disposition="cancelled">Cancel</button></div></td></tr>`;}
  function v4MediaBatchView(records){const ids=[...new Set(records.map(r=>r.brief.id))];return `<div class="v4-media-batch-list">${ids.map(id=>{const b=briefById(id),all=v4BatchAssets(b),visible=records.filter(r=>r.brief.id===id),s=v4BatchStatus(b),counts={ready:0,live:0,backlog:0,cancelled:0};all.forEach(({asset,concept})=>{const d=v4Disposition(asset,concept);if(counts[d]!==undefined)counts[d]++;});return `<section class="v4-media-batch"><div class="v4-media-batch-head"><div class="v4-client-batch">${clientLogo(b.client)}<div><strong>${esc(clientMeta(b.client).name)}</strong><span>${esc(b.slug)} · ${esc(b.funnel)} · ${esc(b.medium)}</span></div></div><div class="v4-count-line"><strong>${b.concepts.length}</strong> concepts</div><div class="v4-count-line"><strong>${all.length}</strong> variations</div><div>${v4StatusPill(s,b.v4Closed)}</div><div class="toolbar"><button class="btn btn-secondary btn-xs" data-action="open-stage-v4" data-brief-id="${b.id}" data-stage="launch">Open batch</button></div></div><div class="v4-media-batch-body">${b.concepts.map(c=>{const ca=all.filter(r=>r.concept.id===c.id),shown=visible.filter(r=>r.concept.id===c.id);if(!shown.length)return'';return `<div class="v4-media-concept-line"><div><strong>${esc(c.name)}</strong><span>${esc(c.id)} · finalized concept</span></div><div><strong>${ca.length}</strong><span> variations</span></div><div><strong>${ca.filter(r=>v4Disposition(r.asset,r.concept)==='live').length}</strong><span> live</span></div><div><strong>${ca.filter(r=>v4Disposition(r.asset,r.concept)==='ready').length}</strong><span> ready</span></div><button class="btn btn-ghost btn-xs" data-action="open-stage-v4" data-brief-id="${b.id}" data-stage="launch">Review variations</button></div>`;}).join('')}</div></section>`;}).join('')||emptyState('rocket','No batches match','Change the queue filters.')}</div>`;}

  renderMediaBuyerV3=function(){const records=v4MediaRecords(),all=state.briefs.flatMap(v4BatchAssets),count=s=>all.filter(({asset,concept})=>v4Disposition(asset,concept)===s).length;return `<section class="page"><div class="page-heading"><div><div class="eyebrow">ROLE VIEW · MEDIA BUYING</div><h1>Media Buyer Queue</h1><p class="page-subtitle">The hierarchy is explicit: Client → Batch → Finalized Concept → Individual Variation / Ad.</p></div><div class="heading-actions"><button class="btn btn-secondary" data-action="run-sync">${icon('sync')}Reconcile Meta</button></div></div><div class="v4-page-guide">${icon('rocket')}A creative appears in Needs Action only after design is approved and the copy packet is final.</div><div class="v4-media-tabs">${[['needs','Needs action',count('ready')],['live','Live',count('live')],['backlog','Backlog',count('backlog')],['cancelled','Cancelled',count('cancelled')],['all','All',all.length]].map(([key,label,n])=>`<button class="v4-tab ${ui.mediaFilters.status===key?'active':''}" data-action="media-status-v4" data-status="${key}">${label} · ${n}</button>`).join('')}</div>${v4MediaFilters()}<div class="v4-view-tabs">${[['batch','By Batch'],['concept','By Concept'],['variation','By Variation / Ad']].map(([key,label])=>`<button class="v4-tab ${ui.mediaView===key?'active':''}" data-action="media-view-v4" data-view="${key}">${label}</button>`).join('')}</div>${ui.mediaView==='batch'?v4MediaBatchView(records):ui.mediaView==='concept'?v4MediaConceptView(records):`<div class="glass-card"><div class="v4-performance-note">${icon('info')}One row equals one launchable ad variation — never an ambiguous batch or concept.</div><div class="launch-table-wrap"><table class="launch-table"><thead><tr><th>Client</th><th>Batch</th><th>Finalized concept</th><th>Variation / ad</th><th>Frozen ad name</th><th>File</th><th>Status</th><th>Launch decision</th></tr></thead><tbody>${records.map(v4MediaVariationRow).join('')||`<tr><td colspan="8">${emptyState('rocket','No variations match','Change the queue filters.')}</td></tr>`}</tbody></table></div></div>`}</section>`;};

  function v4PerformanceRecords(){const f=ui.performanceFilters,q=f.query.toLowerCase().trim();return state.briefs.flatMap(v4BatchAssets).filter(({asset,concept,brief})=>{const c=clientMeta(brief.client),match=!q||[asset.id,adName(brief,concept,asset),concept.name,brief.slug,c.name].join(' ').toLowerCase().includes(q);return match&&v4Disposition(asset,concept)==='live'&&(f.pod==='all'||c.pod===f.pod)&&(f.client==='all'||brief.client===f.client)&&(f.verdict==='all'||asset.verdict===f.verdict)&&(f.batch==='all'||brief.id===f.batch);});}
  function v4Aggregate(records,keyFn,labelFn){const map=new Map();records.forEach(r=>{const key=keyFn(r);if(!map.has(key))map.set(key,{rows:[],...labelFn(r)});map.get(key).rows.push(r);});return [...map.values()].map(g=>{const spend=g.rows.reduce((s,r)=>s+(r.asset.spend||0),0),revenue=g.rows.reduce((s,r)=>s+(r.asset.revenue||0),0),sales=g.rows.reduce((s,r)=>s+((r.asset.spend&&r.asset.cpa)?r.asset.spend/r.asset.cpa:0),0),cpa=sales?spend/sales:0,roas=spend?revenue/spend:0;const verdict=roas>=3?'Scale':roas>=1.3?'Keep':'Kill';return {...g,spend,revenue,cpa,roas,verdict};});}
  function v4PerfFilters(){const f=ui.performanceFilters;return `<div class="glass-card filter-bar"><div class="search-field">${icon('search')}<input class="input" id="v3PerformanceQuery" value="${esc(f.query)}" placeholder="Search client, batch, concept or asset…"></div><select class="select" id="v3PerformancePod"><option value="all">All pods</option><option value="Pod 1" ${f.pod==='Pod 1'?'selected':''}>Pod 1</option><option value="Pod 2" ${f.pod==='Pod 2'?'selected':''}>Pod 2</option></select><select class="select" id="v3PerformanceClient"><option value="all">All clients</option>${Object.entries(CLIENTS).map(([code,c])=>`<option value="${code}" ${f.client===code?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select class="select" id="v3PerformanceVerdict"><option value="all">All verdicts</option>${['Scale','Keep','Kill','Pending'].map(v=>`<option value="${v}" ${f.verdict===v?'selected':''}>${v}</option>`).join('')}</select>${f.batch!=='all'?`<button class="btn btn-ghost btn-sm" data-action="clear-performance-batch">${icon('x')}Clear batch</button>`:''}</div>`;}
  renderPerformanceDatabaseV3=function(){const records=v4PerformanceRecords(),spend=records.reduce((s,r)=>s+r.asset.spend,0),revenue=records.reduce((s,r)=>s+r.asset.revenue,0),roas=spend?revenue/spend:0,winners=records.filter(r=>r.asset.verdict==='Scale').length,view=ui.performanceView;const conceptAgg=v4Aggregate(records,r=>`${r.brief.id}|${r.concept.id}`,r=>({client:r.brief.client,batch:r.brief,concept:r.concept})),batchAgg=v4Aggregate(records,r=>r.brief.id,r=>({client:r.brief.client,batch:r.brief}));let body='';if(view==='ad')body=records.map(({asset,concept,brief})=>`<tr data-open-asset="${asset.id}"><td><div class="batch-name-cell">${clientLogo(brief.client)}<div class="batch-copy"><strong>${esc(clientMeta(brief.client).name)}</strong><span>${esc(clientMeta(brief.client).pod)}</span></div></div></td><td>${esc(brief.slug)}</td><td><strong>${esc(concept.name)}</strong><div style="font-size:7px;color:#746a80">${esc(concept.id)}</div></td><td><strong>${versionInfoV3(concept,asset).label} · ${asset.id}</strong><div style="font-size:7px;color:#746a80">One live ad variation</div></td><td>${money(asset.spend)}</td><td>${money(asset.revenue)}</td><td>${money(asset.cpa)}</td><td><strong>${asset.roas.toFixed(2)}x</strong></td><td><span class="badge ${workflowBadge(asset.verdict)}">${esc(asset.verdict)}</span></td><td>${concept.parentAssetId?`<button class="btn btn-ghost btn-xs" data-open-asset="${concept.parentAssetId}">${icon('tree')}${esc(concept.parentAssetId)}</button>`:'Net new'}</td></tr>`).join('');else if(view==='concept')body=conceptAgg.map(g=>`<tr><td><div class="batch-name-cell">${clientLogo(g.client)}<strong>${esc(clientMeta(g.client).name)}</strong></div></td><td>${esc(g.batch.slug)}</td><td><div class="v4-aggregate-name"><strong>${esc(g.concept.name)}</strong><span>${esc(g.concept.id)} · finalized concept</span></div></td><td>${g.rows.length}</td><td>${money(g.spend)}</td><td>${money(g.revenue)}</td><td>${money(g.cpa)}</td><td><strong>${g.roas.toFixed(2)}x</strong></td><td><span class="badge ${workflowBadge(g.verdict)}">${g.verdict}</span></td><td><button class="btn btn-ghost btn-xs" data-action="open-stage-v4" data-brief-id="${g.batch.id}" data-stage="launch">Open batch</button></td></tr>`).join('');else body=batchAgg.map(g=>`<tr><td><div class="batch-name-cell">${clientLogo(g.client)}<strong>${esc(clientMeta(g.client).name)}</strong></div></td><td><div class="v4-aggregate-name"><strong>${esc(g.batch.slug)}</strong><span>Full creative batch</span></div></td><td>${g.batch.concepts.length}</td><td>${g.rows.length}</td><td>${money(g.spend)}</td><td>${money(g.revenue)}</td><td>${money(g.cpa)}</td><td><strong>${g.roas.toFixed(2)}x</strong></td><td><span class="badge ${workflowBadge(g.verdict)}">${g.verdict}</span></td><td><button class="btn btn-ghost btn-xs" data-action="open-stage-v4" data-brief-id="${g.batch.id}" data-stage="launch">Open batch</button></td></tr>`).join('');const headers=view==='ad'?'<tr><th>Client</th><th>Batch</th><th>Finalized concept</th><th>Variation / ad</th><th>Spend</th><th>Revenue</th><th>CPA</th><th>ROAS</th><th>Verdict</th><th>Lineage</th></tr>':view==='concept'?'<tr><th>Client</th><th>Batch</th><th>Finalized concept</th><th>Live ads</th><th>Spend</th><th>Revenue</th><th>Avg CPA</th><th>ROAS</th><th>Verdict</th><th></th></tr>':'<tr><th>Client</th><th>Batch</th><th>Concepts</th><th>Live ads</th><th>Spend</th><th>Revenue</th><th>Avg CPA</th><th>ROAS</th><th>Verdict</th><th></th></tr>';return `<section class="page"><div class="page-heading"><div><div class="eyebrow">CENTRALIZED PERFORMANCE</div><h1>Creative Performance Database</h1><p class="page-subtitle">Start with the client, then inspect one ad variation or roll the same IDs up by finalized concept and full batch.</p></div><div class="heading-actions"><button class="btn btn-primary" data-action="run-all-verdicts">${icon('bolt')}Run verdict sync</button></div></div><div class="metric-grid">${metricCardV3('Tracked spend',money(spend,true),`${records.length} live ad variations`,'Creative-level spend for the current filtered view.','chart','#4f8cff')}${metricCardV3('Attributed revenue',money(revenue,true),`${roas.toFixed(2)}x blended ROAS`,'Revenue joined through each permanent asset ID.','dollar','#20d67b')}${metricCardV3('Scale winners',winners,`${records.filter(r=>r.asset.verdict==='Keep').length} Keep · ${records.filter(r=>r.asset.verdict==='Kill').length} Kill`,'Live variations above the client-specific Scale threshold.','trophy','#d946ef')}${metricCardV3('Clients represented',new Set(records.map(r=>r.brief.client)).size,`${new Set(records.map(r=>r.brief.id)).size} batches`,'Unique clients and creative batches in this view.','users','#ffb020')}</div>${v4PerfFilters()}<div class="v4-view-tabs">${[['ad','By Ad Variation'],['concept','By Finalized Concept'],['batch','By Batch']].map(([k,l])=>`<button class="v4-tab ${view===k?'active':''}" data-action="performance-view-v4" data-view="${k}">${l}</button>`).join('')}</div><div class="glass-card"><div class="v4-performance-note">${icon('info')}${view==='ad'?'One row = one live ad variation with its own permanent asset ID.':view==='concept'?'One row = one finalized concept aggregating all launched variations beneath it.':'One row = the entire creative batch across all concepts and launched variations.'}</div><div class="launch-table-wrap"><table class="performance-table v3-performance-table"><thead>${headers}</thead><tbody>${body||`<tr><td colspan="10">${emptyState('chart','No performance records match','Change the filters or launch a variation.')}</td></tr>`}</tbody></table></div></div></section>`;};

  function v4SaveCopy(finalize=false){const brief=briefById(ui.briefId);if(!brief)return;document.querySelectorAll('[data-v3-copy-field]').forEach(el=>{const c=brief.concepts.find(x=>x.id===el.dataset.conceptId);if(c)c.copy[el.dataset.v3CopyField]=el.value;});document.querySelectorAll('[data-v3-on-image-copy]').forEach(el=>{const r=assetById(el.dataset.v3OnImageCopy);if(r?.asset)r.asset.onImageCopy=el.value;});if(finalize){const missing=brief.concepts.filter(c=>!v4ConceptCopyReady(c));if(missing.length){showToast('Copy is incomplete',`${missing.length} concept${missing.length===1?'':'s'} still need a headline and body.`, 'warning');render();return;}brief.concepts.forEach(c=>{c.v4CopyFinal=true;c.status='Copy Final';c.assets.forEach(a=>{if(v4FileReady(a)&&a.v4Disposition!=='live'&&a.v4Disposition!=='backlog'&&a.v4Disposition!=='cancelled')a.v4Disposition='ready';});});brief.stageIndex=Math.max(6,brief.stageIndex);brief.status='Launch ready';brief.activity.unshift({time:v4Now(),day:'Today',type:'copy',title:'Copy packet marked final',body:`${brief.copywriter} handed ${brief.concepts.length} finalized concept${brief.concepts.length===1?'':'s'} to ${brief.mediaBuyer}.`});showToast('Copy packet final','The launch-ready variations are now visible in Media Buyer Queue.','success');}else showToast('Copy draft saved','Omnia now holds the current headline, body and variation-level on-image copy.','success');brief.lastUpdated=v4Now();saveState();render();}
  function v4SetDisposition(assetId,disposition){const r=assetById(assetId);if(!r?.asset)return;const {asset,brief}=r;asset.v4Disposition=disposition;if(disposition==='live'){asset.launchStatus='Matched';asset.status='Launched';asset.launchedAt=asset.launchedAt||v4Now();asset.platformAdId=asset.platformAdId||`1202${Math.floor(100000000+Math.random()*899999999)}`;}else if(disposition==='backlog'){asset.launchStatus='Not launched';asset.status='Backlog';asset.platformAdId='';}else if(disposition==='cancelled'){asset.launchStatus='Cancelled';asset.status='Cancelled';asset.platformAdId='';}brief.activity.unshift({time:v4Now(),day:'Today',type:'launch',title:`${asset.id} marked ${disposition}`,body:`${brief.mediaBuyer} set the final launch disposition in Omnia.`});v4AutoClose(brief);saveState();render();showToast('Launch decision saved',`${asset.id} is now ${disposition}.`,'success');}
  function v4OpenRole(role){if(role==='media'){navigate('media');return;}const target=state.briefs.find(b=>{const s=v4BatchStatus(b);return role==='strategy'?s==='Briefing':role==='design'?s==='Design':role==='copy'?s==='Copy':false;});if(!target){showToast('No open work','There are no batches waiting in this role workspace.','success');return;}openBrief(target.id,role==='strategy'?'brief':role);}

  document.addEventListener('click',event=>{
    const t=event.target.closest('[data-action],[data-tab]');if(!t)return;const a=t.dataset.action;
    if(t.dataset.tab&&ui.view==='detail')v4SetHash(`#batch/${encodeURIComponent(ui.briefId)}/${encodeURIComponent(t.dataset.tab)}`);
    if(a==='open-role-v4')v4OpenRole(t.dataset.role);
    if(a==='open-stage-v4')openBrief(t.dataset.briefId,t.dataset.stage);
    if(a==='copy-stage-link-v4')copyText(v4StageUrl(briefById(t.dataset.briefId),t.dataset.stage));
    if(a==='approve-concept-v4'){const b=briefById(ui.briefId),c=b?.concepts.find(x=>x.id===t.dataset.conceptId);if(!c)return;if(!v4DesignReady(c)){showToast('Deliverables incomplete','Upload every requested final file before approval.','warning');return;}c.v4DesignApproved=true;c.status='Concept Approved';b.stageIndex=Math.max(4,b.stageIndex);b.status='Copy in progress';b.activity.unshift({time:v4Now(),day:'Today',type:'design',title:`${c.id} approved for copy`,body:`${b.designer} handed the finalized concept and variations to ${b.copywriter}.`});saveState();render();showToast('Concept handed to copy',`${c.name} is available in the Copy workspace.`,'success');}
    if(a==='save-copy-draft-v4')v4SaveCopy(false);
    if(a==='mark-copy-final-v4')v4SaveCopy(true);
    if(a==='set-disposition-v4')v4SetDisposition(t.dataset.assetId,t.dataset.disposition);
    if(a==='close-batch-v4'){const b=briefById(t.dataset.briefId),s=v4BatchStatus(b);if(!['Partial','Backlog'].includes(s)){showToast('Batch cannot close yet','Finish every launch decision first.','warning');return;}b.v4Closed=true;b.v4ClosedAt=v4Now();b.activity.unshift({time:v4Now(),day:'Today',type:'launch',title:`Batch closed ${s}`,body:'The media buyer deliberately closed a batch with non-live final creatives.'});saveState();render();showToast('Batch closed',`${b.slug} closed with status ${s}.`,'success');}
    if(a==='reopen-batch-v4'){const b=briefById(t.dataset.briefId);b.v4Closed=false;b.v4ClosedAt='';saveState();render();showToast('Batch reopened','Launch decisions can be changed again.','success');}
    if(a==='media-status-v4'){ui.mediaFilters.status=t.dataset.status;render();}
    if(a==='media-view-v4'){ui.mediaView=t.dataset.view;render();}
    if(a==='performance-view-v4'){ui.performanceView=t.dataset.view;render();}
    if(a==='reset-dashboard-filters-v4'){ui.dashboardFilters={pod:'all',client:'all',person:'all',status:'all'};render();}
  });
  document.addEventListener('change',event=>{if(event.target.id==='v4DashboardStatus'){ui.dashboardFilters.status=event.target.value;render();}if(event.target.id==='v4AssetStatus'){ui.assetFilters.status=event.target.value;render();}});


  document.title='Omnia — Creative Asset System V4.2 UX';if(v4Env)v4Env.innerHTML='<span></span>V4.2 UX';ui.v42SidebarOpen=false;state.briefs.forEach(brief=>{if(typeof brief.v42DesignSubmitted!=='boolean')brief.v42DesignSubmitted=brief.concepts.length>0&&brief.concepts.every(c=>c.v4DesignApproved);});saveState();
  function openVariationModalV42(brief,conceptId){const concept=brief?.concepts.find(c=>c.id===conceptId);if(!concept)return;const next=`V${concept.assets.length+1} variation`;showModal(`<div class="modal-head"><div><h2>Add variation</h2><p style="margin:5px 0 0;color:#776f82;font-size:9px">Register the variation now. Upload the final file immediately or later.</p></div><button class="modal-close" data-action="close-modal">${icon('x')}</button></div><form id="v3DesignDeliverableForm" data-brief-id="${brief.id}"><div class="modal-body"><div class="form-grid"><input type="hidden" name="conceptId" value="${esc(concept.id)}"><label class="form-label full">Concept<input class="input" value="${esc(concept.name)}" disabled></label><label class="form-label">Variation<input class="input" value="${esc(next)}" disabled></label><label class="form-label">Ratio<select class="select" name="ratio"><option>1:1</option><option>4:5</option><option>9:16</option></select></label><label class="form-label full">Working title / on-image copy<input class="input" name="onImageCopy" placeholder="Optional"></label><label class="form-label full"><span style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="hasFile" value="yes"> Final creative file is already ready</span></label></div><div class="modal-note">A permanent asset ID is minted immediately under ${esc(concept.id)}.</div></div><div class="modal-footer"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">${icon('plus')}Add variation</button></div></form>`,'modal-sm');}
  document.addEventListener('click',event=>{const t=event.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;if(a==='toggle-batch-sidebar-v42'){event.preventDefault();ui.v42SidebarOpen=!ui.v42SidebarOpen;render();}if(a==='add-variation-v42'){event.preventDefault();openVariationModalV42(briefById(ui.briefId),t.dataset.conceptId);}if(a==='delete-concept-v42'){event.preventDefault();event.stopPropagation();const brief=briefById(ui.briefId),concept=brief?.concepts.find(c=>c.id===t.dataset.conceptId);if(!brief||!concept)return;if(!window.confirm(`Delete “${concept.name}” and its ${concept.assets.length} variation${concept.assets.length===1?'':'s'}?`))return;brief.concepts=brief.concepts.filter(c=>c.id!==concept.id);brief.v42DesignSubmitted=false;brief.lastUpdated=v4Now();brief.activity.unshift({time:v4Now(),day:'Today',type:'design',title:`${concept.id} deleted`,body:`${concept.name} and its variations were removed from the batch.`});saveState();render();showToast('Concept deleted',`${concept.name} was removed from the batch.`,'success');}if(a==='submit-design-v42'){event.preventDefault();const brief=briefById(ui.briefId);if(!brief)return;const input=document.getElementById('v42FigmaUrl');const url=String(input?.value||'').trim();if(!/^https:\/\//i.test(url)){showToast('Figma link required','Paste the full https:// Figma board URL before submitting.','warning');input?.focus();return;}const missing=brief.concepts.filter(c=>!v42ConceptDesignReady(c));if(missing.length){showToast('Design is incomplete',`${missing.length} concept${missing.length===1?'':'s'} still need every requested final variation.`,'warning');return;}brief.figmaUrl=url;brief.v42DesignSubmitted=true;brief.concepts.forEach(c=>{c.v4DesignApproved=true;c.status='Concept Approved';});brief.stageIndex=Math.max(4,brief.stageIndex);brief.status='Copy in progress';brief.lastUpdated=v4Now();brief.activity.unshift({time:v4Now(),day:'Today',type:'design',title:'Design submitted for copy',body:`${brief.designer} attached the Figma board and handed ${brief.concepts.length} concept${brief.concepts.length===1?'':'s'} to ${brief.copywriter}.`});saveState();render();showToast('Submitted for copy',`${brief.copywriter} now has the final designs and Figma board.`,'success');}},true);

  render();
})();

  </script>
