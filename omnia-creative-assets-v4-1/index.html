    const ic = ex.type.includes('Rebuild') ? 'refresh' : ex.type.includes('Unbriefed') ? 'file' : 'alert';
    return `<button class="attention-item" data-open-exception="${ex.id}">
      <div class="attention-icon ${iconClass}">${icon(ic)}</div>
      <div class="attention-copy"><strong>${esc(ex.type)}</strong><span>${esc(ex.assetId || ex.adName)} · ${esc(clientMeta(ex.client).name)}</span></div>
      <div class="attention-count">${icon('chevron')}</div>
    </button>`;
  }

  function renderBriefs() {
    const f = ui.briefFilters;
    const q = f.query.toLowerCase().trim();
    const filtered = state.briefs.filter(b => {
      const matchQ = !q || [b.slug,clientMeta(b.client).name,b.funnel,b.status].join(' ').toLowerCase().includes(q);
      const matchClient = f.client==='all' || b.client===f.client;
      const matchStage = f.stage==='all' || STAGES[b.stageIndex].key===f.stage;
      return matchQ && matchClient && matchStage;
    });
    return `<section class="page">
      <div class="page-heading"><div><div class="eyebrow">CREATIVE HUB</div><h1>Briefs</h1><p class="page-subtitle">Every Asana creative task gets one matching Omnia container.</p></div><div class="heading-actions"><button class="btn btn-primary" data-action="create-brief">${icon('plus')}Create brief</button></div></div>
      <div class="glass-card filter-bar">
        <div class="search-field">${icon('search')}<input class="input" id="briefFilterQuery" value="${esc(f.query)}" placeholder="Search briefs…"></div>
        <select class="select" id="briefFilterClient"><option value="all">All clients</option>${Object.entries(CLIENTS).map(([code,c])=>`<option value="${code}" ${f.client===code?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
        <select class="select" id="briefFilterStage"><option value="all">All stages</option>${STAGES.map(s=>`<option value="${s.key}" ${f.stage===s.key?'selected':''}>${esc(s.label)}</option>`).join('')}</select>
        <span class="badge badge-muted">${filtered.length} batches</span>
      </div>
      ${filtered.length ? `<div class="brief-card-grid">${filtered.map(briefCard).join('')}</div>` : emptyState('file','No briefs match these filters','Clear the filters or create a new brief container.')}
    </section>`;
  }

  function briefCard(brief) {
    const c = clientMeta(brief.client);
    const assets = brief.concepts.flatMap(x=>x.assets);
    const launchRate = assets.length ? Math.round(assets.filter(a=>a.launchStatus==='Matched').length/assets.length*100) : 0;
    return `<article class="glass-card brief-card" data-open-brief="${brief.id}">
      <div class="brief-card-top">${clientLogo(brief.client)}<span class="badge ${brief.stageIndex===0?'badge-amber':brief.stageIndex===8?'badge-green':'badge-purple'}">${esc(brief.status)}</span></div>
      <h3>${esc(brief.slug)}</h3><div class="brief-meta">${esc(c.name)} · ${esc(brief.funnel)} · ${esc(brief.targetWeek)}</div>
      <div class="brief-card-stage"><div class="brief-card-stage-label"><span>${esc(checkpointLabel(brief))}</span><span>${stageProgress(brief)}%</span></div><div class="stage-track"><span style="width:${stageProgress(brief)}%"></span></div></div>
      <div class="brief-card-bottom"><div class="stats"><span><strong>${brief.concepts.length}</strong>Concepts</span><span><strong>${assets.length}</strong>Assets</span><span><strong>${launchRate}%</strong>Launched</span></div><div class="owner-stack">${[brief.briefer,brief.designer,brief.copywriter].filter(Boolean).map(n=>personDot(n)).join('')}</div></div>
    </article>`;
  }

  function renderDetail() {
    const brief = briefById(ui.briefId) || state.briefs[0];
    if (!brief) return emptyState('file','Brief not found','Return to the Asset Command Center.');
    ui.briefId = brief.id;
    const c = clientMeta(brief.client);
    const assets = brief.concepts.flatMap(x=>x.assets);
    return `<section class="page detail-page">
      <div class="breadcrumbs"><button data-navigate="dashboard">Creative Asset System</button>${icon('chevron')}<button data-navigate="briefs">Briefs</button>${icon('chevron')}<span>${esc(brief.slug)}</span></div>
      <div class="glass-card batch-hero">
        <div class="batch-hero-left">${clientLogo(brief.client,'batch-hero-logo')}<div class="batch-hero-copy"><h1>${esc(brief.slug)}</h1><div class="batch-hero-meta"><span>${esc(c.name)}</span><span class="meta-sep">•</span><span>${esc(brief.funnel)}</span><span class="meta-sep">•</span><span>${esc(brief.medium)}</span><span class="meta-sep">•</span><span>${esc(brief.targetWeek)}</span><span class="badge ${brief.stageIndex===0?'badge-amber':brief.stageIndex>=8?'badge-green':'badge-purple'}">${esc(brief.status)}</span></div></div></div>
        <div class="batch-hero-actions"><button class="btn btn-secondary btn-sm" data-action="open-asana" data-url="${esc(brief.asanaUrl)}">${icon('external')}Asana task</button><button class="btn btn-secondary btn-sm" data-tab="launch">${icon('rocket')}Media buyer handoff</button><button class="btn btn-primary btn-sm" data-action="open-handoff-doc">${icon('file')}Copy & creatives</button><button class="icon-btn">${icon('more')}</button></div>
      </div>
      ${renderStageRail(brief)}
      ${renderDetailTabs()}
      ${renderDetailTabContent(brief, assets)}
    </section>`;
  }

  function renderStageRail(brief) {
    const current = checkpointIndex(brief);
    const complete = brief.stageIndex >= 8;
    return `<div class="glass-card stage-rail"><div class="stage-rail-inner">${CHECKPOINTS.map((stage,i)=>`<div class="stage-step ${(complete||i<current)?'done':i===current?'active':''}"><span class="stage-number">${(complete||i<current)?icon('check'):i+1}</span><span>${esc(stage.label)}</span></div>`).join('')}</div></div>`;
  }

  function renderDetailTabs() {
    const tabs = [
      ['workspace','grid','Workspace'],['copy','copy','Copy'],['launch','rocket','Launch'],['performance','chart','Performance'],['lineage','tree','Lineage'],['activity','activity','Activity']
    ];
    return `<div class="detail-tabs">${tabs.map(([id,ic,label])=>`<button class="detail-tab ${ui.detailTab===id?'active':''}" data-tab="${id}">${icon(ic)}${label}</button>`).join('')}</div>`;
  }

  function renderDetailTabContent(brief, assets) {
    switch (ui.detailTab) {
      case 'copy': return renderCopyTab(brief);
      case 'launch': return renderLaunchTab(brief, assets);
      case 'performance': return renderPerformanceTab(brief, assets);
      case 'lineage': return renderLineageTab(brief, assets);
      case 'activity': return renderActivityTab(brief);
      case 'workspace':
      default: return renderWorkspaceTab(brief);
    }
  }

  function renderWorkspaceTab(brief) {
    const assets = brief.concepts.flatMap(c=>c.assets);
    const ready = assets.filter(a=>['Ready','Launched'].includes(a.status)).length;
    return `<div class="workspace-grid">
      <div class="workspace-main">
        <div class="glass-card brief-overview">
          <div class="brief-overview-top"><h2>Brief overview</h2><div class="toolbar"><span class="badge badge-muted">Last updated ${esc(brief.lastUpdated)}</span><button class="btn btn-ghost btn-xs" data-action="edit-brief">${icon('edit')}Edit</button></div></div>
          ${brief.overview ? `<div class="brief-summary-grid"><div class="brief-copy-block"><label>Overview</label><p>${esc(brief.overview)}</p><div class="link-row"><button class="btn btn-secondary btn-xs" data-action="open-url" data-url="${esc(brief.loomUrl)}">${icon('play')}Brief Loom</button><button class="btn btn-secondary btn-xs" data-action="open-url" data-url="${esc(brief.figmaUrl)}">${icon('external')}Figma file</button></div></div><div class="brief-copy-block"><label>Global directives</label><div class="directive-list">${brief.directives.map(d=>`<div class="directive-item">${icon('check')}<span>${esc(d)}</span></div>`).join('')}</div></div></div>` : `<div class="empty-state"><div class="empty-state-icon">${icon('file')}</div><h3>Brief container is empty</h3><p>Tyler has not added the overview, Loom, directives or concept blocks yet. This is reported separately from work in progress.</p><button class="btn btn-primary btn-sm" data-action="edit-brief">Fill brief</button></div>`}
        </div>
        <div class="section-title-row"><div><h2>Concepts</h2><p>${brief.concepts.length} net-new ideas · ${assets.length} registered assets</p></div><button class="btn btn-secondary btn-sm" data-action="add-concept">${icon('plus')}Add concept</button></div>
        <div class="concepts-wrap">${brief.concepts.length ? brief.concepts.map((concept,index)=>conceptCard(brief,concept,index)).join('') : emptyState('spark','No concepts yet','Add the first concept block. Omnia will mint a permanent concept ID.')}</div>
      </div>
      <aside class="workspace-side">
        <div class="glass-card side-card"><h3>Batch status</h3><div class="status-list">
          <div class="status-row"><span>Current stage</span><span class="badge badge-purple">${esc(checkpointLabel(brief))}</span></div>
          <div class="status-row"><span>Brief owner</span><span class="person-chip">${personDot(brief.briefer)}${esc(brief.briefer)}</span></div>
          <div class="status-row"><span>Designer</span><span class="person-chip">${personDot(brief.designer)}${esc(brief.designer)}</span></div>
          <div class="status-row"><span>Copywriter</span><span class="person-chip">${personDot(brief.copywriter)}${esc(brief.copywriter)}</span></div>
          <div class="status-row"><span>Media buyer</span><span class="person-chip">${personDot(brief.mediaBuyer)}${esc(brief.mediaBuyer)}</span></div>
          <div class="status-row"><span>Points</span><span>${brief.points || 0} advisory</span></div>
          <div class="status-row"><span>Launch-ready</span><span>${ready} / ${assets.length}</span></div>
        </div></div>
        <div class="glass-card side-card"><h3>Stage actions</h3><div class="side-action-stack">
          <button class="btn btn-primary" data-action="register-asset">${icon('plus')}Register frame</button>
          <button class="btn btn-secondary" data-action="deliver-ready">${icon('upload')}Deliver ready assets</button>
          <button class="btn btn-secondary" data-tab="launch">${icon('rocket')}Open media buyer handoff</button>
        </div></div>
        <div class="glass-card side-card"><h3>Handoff health</h3><div class="handoff-health"><div class="handoff-health-top">${icon('check')}One live link per stage</div><p>The brief, copy, creatives and launch state stay current in one Omnia record. Comments notify the next owner.</p></div><div class="status-list" style="margin-top:12px"><div class="status-row"><span>Asana template</span><span class="badge badge-green">v2.4 verified</span></div><div class="status-row"><span>Missing subtasks</span><span>0</span></div></div></div>
      </aside>
    </div>`;
  }

  function conceptCard(brief, concept, index) {
    return `<article class="glass-card concept-card" data-concept-card="${concept.id}">
      <div class="concept-header" data-action="toggle-concept"><div class="concept-index">${index+1}</div><div class="concept-title"><h3>${esc(concept.name)}</h3><div class="concept-meta"><code>${esc(concept.id)}</code><span>•</span><span>${esc(concept.pitch.source)} ${concept.pitch.id!=='—'?esc(concept.pitch.id):''}</span><span>•</span><span>${concept.assets.length}/${concept.expectedVariations} assets</span></div></div><div class="concept-header-actions"><span class="badge ${workflowBadge(concept.status)}">${esc(concept.status)}</span><button class="icon-btn concept-toggle">${icon('chevron-down')}</button></div></div>
      <div class="concept-content">
        <div class="concept-brief-grid"><div class="reference-card">${previewHTML(concept.referenceType,concept.literalCopy)}</div><div class="concept-direction">
          <div class="concept-direction-row"><label>Direction</label><div>${esc(concept.direction)}</div></div>
          <div class="concept-direction-row"><label>Pitch source</label><div><span class="badge ${concept.pitch.source==='No pitch'?'badge-muted':'badge-purple'}">${esc(concept.pitch.id)} · ${esc(concept.pitch.author)}</span></div></div>
          <div class="concept-direction-row"><label>Literal copy</label><div>${esc(concept.literalCopy || 'None specified')}</div></div>
          <div class="concept-direction-row"><label>Parent winner</label><div>${concept.parentAssetId?`<button class="btn btn-ghost btn-xs" data-open-asset="${concept.parentAssetId}">${icon('tree')}${esc(concept.parentAssetId)}</button>`:'No parent asset'}</div></div>
        </div></div>
        <div class="asset-grid">${concept.assets.map(asset=>assetCard(brief,concept,asset)).join('')}<button class="add-asset-card" data-action="add-variation" data-concept-id="${concept.id}"><div>${icon('plus')}Add variation<br><span style="font-size:8px;color:#686172">Mint a new asset ID</span></div></button></div>
      </div>
    </article>`;
  }

  function assetCard(brief, concept, asset) {
    return `<article class="asset-card ${asset.status==='Rebuild Required'?'attention':''}">
      <div class="asset-preview" data-open-asset="${asset.id}">${previewHTML(asset.preview,asset.onImageCopy)}</div>
      <div class="asset-card-copy"><div class="asset-card-topline"><strong>${esc(asset.id)} · V${asset.variation}</strong><span class="badge ${workflowBadge(asset.status)}">${esc(asset.status)}</span></div><div class="asset-name" title="${esc(adName(brief,concept,asset))}">${esc(adName(brief,concept,asset))}</div><div class="asset-card-actions"><span>${esc(asset.ratio)} · ${asset.deliveredBy?esc(asset.deliveredBy):'Not delivered'}</span><button class="asset-more" data-open-asset="${asset.id}">${icon('more')}</button></div></div>
    </article>`;
  }

  function renderCopyTab(brief) {
    if (!brief.concepts.length) return emptyState('copy','No concepts to write against','Add concepts and register frames first so copy fields cannot be mismatched.');
    const concept = brief.concepts.find(c=>c.id===ui.selectedCopyConceptId) || brief.concepts[0];
    ui.selectedCopyConceptId = concept.id;
    const asset = concept.assets.find(a=>a.id===ui.selectedCopyAssetId) || concept.assets[0] || null;
    ui.selectedCopyAssetId = asset?.id || null;
    const hasDelivered = concept.assets.some(a=>a.workflowStatus==='Delivered'||a.workflowStatus==='Rebuild Required');
    const complete = Boolean(concept.copy.primary.trim() && concept.copy.headline.trim());

    return `<div class="copy-screen">
      <div class="glass-card copy-banner"><div class="copy-banner-left"><div class="copy-banner-icon">${icon('copy')}</div><div><h2>Headline + body copy by concept</h2><p>Select a concept, complete its two copy deliverables, then inspect exactly what every variation inherits.</p></div></div><span class="badge ${hasDelivered?'badge-amber':'badge-green'}">${hasDelivered?'Saved edits may trigger rebuilds':'Safe to edit'}</span></div>
      <div class="copy-workspace-v2">
        <aside class="glass-card copy-concept-nav">
          <div class="copy-concept-nav-head"><h3>Concepts</h3><p>Choose the primary concept, then click any registered variation.</p></div>
          <div class="copy-concept-list-v2">${brief.concepts.map((item,index)=>{
            const itemComplete = Boolean(item.copy.primary.trim() && item.copy.headline.trim());
            return `<button class="copy-concept-button ${item.id===concept.id?'active':''}" data-action="select-copy-concept" data-concept-id="${item.id}"><span class="copy-concept-number">${index+1}</span><span class="copy-concept-button-copy"><strong>${esc(item.name)}</strong><span>${esc(item.id)}</span></span><span class="copy-concept-count">${item.assets.length} V${item.assets.length===1?'':'s'} · ${itemComplete?'✓':'—'}</span></button>`;
          }).join('')}</div>
        </aside>

        <section class="glass-card copy-detail-v2">
          <div class="copy-detail-head"><div><h2>Concept ${brief.concepts.indexOf(concept)+1} · ${esc(concept.name)}</h2><p>${esc(concept.id)} · ${concept.assets.length} registered variation${concept.assets.length===1?'':'s'} · one copy packet inherited by all</p></div><span class="badge ${complete?'badge-green':'badge-amber'}">${complete?'Copy complete':'Needs copy'}</span></div>
          <div class="copy-editor-v2">
            <div class="copy-editor-grid-v2">
              <div class="form-group"><label>Headline <span class="required">*</span></label><textarea data-copy-field="headline" data-concept-id="${concept.id}" placeholder="Write the ad headline…">${esc(concept.copy.headline)}</textarea><small>Required for delivery.</small></div>
              <div class="form-group body-copy-field"><label>Body copy <span class="required">*</span></label><textarea data-copy-field="primary" data-concept-id="${concept.id}" placeholder="Write the full ad body copy…">${esc(concept.copy.primary)}</textarea><small>Line breaks are preserved. This copy is inherited by every variation below.</small></div>
            </div>
            <div class="copy-editor-actions"><div class="copy-editor-note">${icon(complete?'unlock':'lock')}Headline and body copy gate delivery.</div><div class="toolbar"><button class="btn btn-secondary btn-sm" data-action="import-copy" data-concept-id="${concept.id}">${icon('upload')}Import document</button><button class="btn btn-primary btn-sm" data-action="save-copy" data-concept-id="${concept.id}">${icon('check')}Save concept copy</button></div></div>
          </div>

          <div class="variation-section-v2">
            <div class="variation-section-head"><div><h3>Variations</h3><p>Click any creative to see its frozen ad name and inherited copy packet.</p></div><span class="badge badge-purple">Primary concept ID · ${esc(concept.id)}</span></div>
            ${concept.assets.length ? `<div class="variation-grid-v2">${concept.assets.map(item=>`<button class="variation-card-v2 ${asset?.id===item.id?'active':''}" data-action="select-copy-asset" data-asset-id="${item.id}"><div class="variation-card-preview">${previewHTML(item.preview,item.onImageCopy,true)}</div><div class="variation-card-meta"><strong>V${item.variation} · ${item.id}</strong><span>${esc(item.status)}</span></div></button>`).join('')}</div>` : emptyState('image','No variations registered','Register the first creative frame under this concept.')}
            ${asset ? `<div class="variation-inspector-v2"><div class="variation-inspector-grid"><div class="variation-inspector-preview">${previewHTML(asset.preview,asset.onImageCopy)}</div><div class="variation-inspector-copy"><div class="variation-inspector-top"><h3>Variation ${asset.variation} · ${esc(asset.id)}</h3><span class="badge ${workflowBadge(asset.workflowStatus)}">${esc(asset.workflowStatus)}</span></div><div class="ad-name-full"><code>${esc(adName(brief,concept,asset))}</code><button class="copy-inline" data-copy-text="${esc(adName(brief,concept,asset))}" title="Copy ad name">${icon('copy')}</button></div><div class="copy-readonly-grid"><div class="copy-readonly-block"><label>Headline</label><strong>${esc(concept.copy.headline||'Headline not submitted')}</strong></div><div class="copy-readonly-block"><label>Body copy</label><p>${esc(concept.copy.primary||'Body copy not submitted')}</p></div></div><div class="status-list"><div class="status-row"><span>Creative status</span><span>${esc(asset.status)}</span></div><div class="status-row"><span>Launch state</span><span>${esc(asset.launchStatus)}</span></div><div class="status-row"><span>Final creative</span><span>${asset.deliveredAt?'Ready in Drive':'Not delivered'}</span></div></div></div></div></div>` : ''}
          </div>
        </section>
      </div>
    </div>`;
  }

  function renderLaunchTab(brief, assets) {
    const ready = assets.filter(a=>['Ready','Launched'].includes(a.status) && a.workflowStatus!=='Rebuild Required');
    const launched = assets.filter(a=>a.launchStatus==='Matched').length;
    const selected = ui.selectedLaunchAssets;
    return `<div class="launch-layout">
      <section class="glass-card launch-main">
        <div class="launch-toolbar"><div class="launch-toolbar-left"><button class="checkbox ${selected.size===assets.length&&assets.length?'checked':''}" data-action="toggle-all-launch">${icon('check')}</button><span style="color:#8e869a;font-size:9px">${selected.size} selected</span><span class="badge badge-purple">${assets.length} total assets</span></div><div class="launch-toolbar-right"><button class="btn btn-secondary btn-sm" data-action="copy-all-names">${icon('copy')}Copy names</button><button class="btn btn-primary btn-sm" data-action="mark-launched">${icon('rocket')}Mark selected launched</button></div></div>
        <div class="launch-table-wrap"><table class="launch-table"><thead><tr><th></th><th>Asset</th><th>Frozen ad name</th><th>Copy</th><th>Drive</th><th>Launch state</th><th>Platform ID</th></tr></thead><tbody>${assets.map(asset=>launchRow(brief,asset)).join('')}</tbody></table></div>
      </section>
      <aside class="launch-side">
        <div class="glass-card launch-summary"><h3>Launch summary</h3><div class="launch-summary-metrics"><div class="launch-summary-metric"><span>Ready</span><strong>${ready.length}</strong></div><div class="launch-summary-metric"><span>Matched</span><strong>${launched}</strong></div><div class="launch-summary-metric"><span>Backlog</span><strong>${assets.filter(a=>a.launchStatus!=='Matched').length}</strong></div><div class="launch-summary-metric"><span>Blocked</span><strong>${assets.filter(a=>a.launchStatus==='Blocked').length}</strong></div></div><div class="hard-rule">${icon('lock')}<span><strong>Hard rule:</strong> Never alter the final ID segment after launch. Everything before it is human-readable; the ID is load-bearing.</span></div></div>
        <div class="glass-card handoff-doc-card"><h3>Copy & creatives document</h3><p>A clean media-buyer handoff containing every concept, headline, body, variation, frozen ad name and final-creative status.</p><div class="handoff-doc-actions"><button class="btn btn-primary" data-action="open-handoff-doc">${icon('eye')}Preview handoff document</button><button class="btn btn-secondary" data-action="copy-handoff-doc">${icon('copy')}Copy full document</button><button class="btn btn-secondary" data-action="download-handoff-doc">${icon('download')}Download .txt</button><button class="btn btn-secondary" data-action="run-sync">${icon('sync')}Verify launches in Meta</button></div></div>
      </aside>
    </div>`;
  }

  function launchRow(brief, asset) {
    const concept = brief.concepts.find(c=>c.assets.some(a=>a.id===asset.id));
    const selected = ui.selectedLaunchAssets.has(asset.id);
    const copyReady = Boolean(concept.copy.primary && concept.copy.headline);
    return `<tr><td><button class="checkbox ${selected?'checked':''}" data-action="toggle-launch-select" data-asset-id="${asset.id}">${icon('check')}</button></td><td><div class="manifest-asset"><div class="manifest-thumb" data-open-asset="${asset.id}">${previewHTML(asset.preview,asset.onImageCopy,true)}</div><div class="manifest-id"><strong>${asset.id} · V${asset.variation}</strong><span>${esc(concept.name)}</span></div></div></td><td class="ad-name-cell"><div class="ad-name-wrap"><code title="${esc(adName(brief,concept,asset))}">${esc(adName(brief,concept,asset))}</code><button class="copy-inline" data-copy-text="${esc(adName(brief,concept,asset))}" title="Copy ad name">${icon('copy')}</button></div></td><td><span class="badge ${copyReady?'badge-green':'badge-amber'}">${copyReady?'Ready':'Missing'}</span></td><td>${asset.deliveredAt?`<button class="btn btn-ghost btn-xs" data-action="open-url" data-url="${esc(brief.driveUrl)}">${icon('external')}Final</button>`:'—'}</td><td><span class="badge ${workflowBadge(asset.launchStatus)}">${esc(asset.launchStatus)}</span></td><td><code style="font-family:var(--mono);color:#82798e">${esc(asset.platformAdId||'—')}</code></td></tr>`;
  }

  function renderPerformanceTab(brief, assets) {
    const launched = assets.filter(a=>a.launchStatus==='Matched');
    const spend = launched.reduce((s,a)=>s+a.spend,0);
    const revenue = launched.reduce((s,a)=>s+a.revenue,0);
    const roas = spend ? revenue/spend : 0;
    const avgCPA = launched.filter(a=>a.cpa).length ? launched.filter(a=>a.cpa).reduce((s,a)=>s+a.cpa,0)/launched.filter(a=>a.cpa).length : 0;
    const log = assets.flatMap(a=>(a.history||[]).map(h=>({...h,assetId:a.id}))).sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,8);
    return `<div>
      <div class="performance-overview">
        <div class="glass-card performance-card"><span>Tracked spend</span><strong>${money(spend,true)}</strong><small>${launched.length} matched assets</small></div>
        <div class="glass-card performance-card"><span>Attributed revenue</span><strong>${money(revenue,true)}</strong><small>Rolls up to concept, brief and pitch</small></div>
        <div class="glass-card performance-card"><span>Blended ROAS</span><strong>${roas.toFixed(2)}x</strong><small>From creative-level HYROS data</small></div>
        <div class="glass-card performance-card"><span>Average CPA</span><strong>${avgCPA?money(avgCPA):'—'}</strong><small>Target ${money(clientMeta(brief.client).targetCPA)}</small></div>
      </div>

  function renderLineageTab(brief, assets) {
    if (!brief.concepts.length) return emptyState('tree','No lineage to display','Add a concept and register creative variations first.');
    const concept = brief.concepts.find(c=>c.id===ui.selectedLineageConceptId) || brief.concepts[0];
    ui.selectedLineageConceptId = concept.id;
    const asset = concept.assets.find(a=>a.id===ui.selectedLineageAssetId) || concept.assets[0] || null;
    ui.selectedLineageAssetId = asset?.id || null;
    const parent = concept.parentAssetId ? state.orphanWinners.find(w=>w.id===concept.parentAssetId) : null;

    return `<div class="lineage-layout-v2">
      <section class="glass-card lineage-main-v2">
        <div class="lineage-selector-v2">${brief.concepts.map(item=>`<button class="lineage-concept-chip ${item.id===concept.id?'active':''}" data-action="select-lineage-concept" data-concept-id="${item.id}">${esc(item.id)} · ${esc(item.name)}</button>`).join('')}</div>
        <div class="lineage-canvas-v2"><div class="lineage-tree-v2">
          ${parent?`<button class="lineage-source-v2" data-open-asset="${parent.id}">${icon('trophy')} Source winner ${esc(parent.id)} · ${esc(parent.concept)}</button>`:''}
          <div class="lineage-root-v2"><div class="lineage-root-label">Primary concept ID</div><code>${esc(concept.id)}</code><h3>${esc(concept.name)}</h3><p>${concept.parentAssetId?`Refresh derived from ${esc(concept.parentAssetId)}`:'Net-new creative concept'}</p></div>
          ${concept.assets.length?`<div class="lineage-children-v2">${concept.assets.map(item=>`<button class="lineage-child-v2 ${asset?.id===item.id?'active':''}" data-action="select-lineage-asset" data-asset-id="${item.id}">${previewHTML(item.preview,item.onImageCopy,true)}<div class="lineage-child-top"><code>V${item.variation} · ${esc(item.id)}</code><span class="badge ${workflowBadge(item.verdict)}">${esc(item.verdict)}</span></div><h4>${esc(adName(brief,concept,item))}</h4><p>${esc(item.onImageCopy||'No on-image copy')}</p><div class="lineage-child-metrics"><span><strong>${item.roas?item.roas.toFixed(2)+'x':'—'}</strong> ROAS</span><span><strong>${money(item.revenue,true)}</strong> revenue</span></div></button>`).join('')}</div>`:`<div style="margin-top:58px">${emptyState('image','No variations registered','Every variation will branch from this concept ID.')}</div>`}
        </div></div>
      </section>
      <aside class="glass-card lineage-inspector"><h3>Selected variation</h3>${asset?`<div class="path-chain">${pathStep('spark','Primary concept ID',concept.id)}${pathStep('image','Variation',`V${asset.variation} · ${asset.id}`)}${pathStep('file','Frozen ad name',adName(brief,concept,asset))}${pathStep('user','Producer',asset.deliveredBy||'Not delivered')}${pathStep('rocket','Meta ad',asset.platformAdId||'Not launched')}${pathStep('chart','Revenue',money(asset.revenue||0))}${pathStep('trophy','Verdict',asset.verdict||'Pending')}</div><button class="btn btn-secondary btn-sm" style="width:100%;margin-top:12px" data-open-asset="${asset.id}">${icon('eye')}Open full asset record</button>`:'<p style="color:#776f82;font-size:9px">Select a variation to inspect it.</p>'}<div class="modal-note" style="margin-top:12px">The concept is the root. Every registered creative branches from its permanent concept ID, making variation-level performance and future refreshes traceable.</div></aside>
    </div>`;
  }

  function pathStep(ic,label,value) { return `<div class="path-step"><div class="path-step-icon">${icon(ic)}</div><div class="path-step-copy"><strong>${esc(label)}</strong><span>${esc(value)}</span></div></div>`; }

  function renderActivityTab(brief) {
    const groups = brief.activity.reduce((acc,item)=>{(acc[item.day] ||= []).push(item);return acc;},{});
    return `<div class="glass-card activity-timeline">${Object.keys(groups).length?Object.entries(groups).map(([day,items])=>`<div class="timeline-day">${esc(day)}</div>${items.map(item=>`<div class="timeline-row"><div class="timeline-icon">${icon(activityIcon(item.type))}</div><div class="timeline-copy"><strong>${esc(item.title)}</strong><p>${esc(item.body)}</p></div><div class="timeline-time">${esc(item.time)}</div></div>`).join('')}`).join(''):emptyState('activity','No activity yet','Handoffs, registrations, copy changes, launches and verdicts will appear here.')}</div>`;
  }

  function activityIcon(type) {
    return ({copy:'copy',sync:'sync',verdict:'trophy',deliver:'upload',register:'plus'})[type] || 'activity';
  }

  function renderWinners() {
    const query = ui.winnerFilters.query.toLowerCase().trim();
    const currentScale = allAssets().filter(a=>a.verdict==='Scale').map(a=>({
      id:a.id, conceptId:a.concept.id, briefId:a.brief.id, client:a.client, concept:a.concept.name, name:a.name, preview:a.preview, spend:a.spend, revenue:a.revenue, cpa:a.cpa, roas:a.roas, verdict:a.verdict, lastVerdict:a.lastVerdict, status:'Active', descendants:0, producer:a.deliveredBy, pitchAuthor:a.concept.pitch.author, onImageCopy:a.onImageCopy
    }));
    const winners = [...currentScale,...state.orphanWinners].filter(w=>{
      const matchQ = !query || [w.id,w.concept,w.name,clientMeta(w.client).name,w.producer,w.pitchAuthor].join(' ').toLowerCase().includes(query);
      const matchClient = ui.winnerFilters.client==='all' || w.client===ui.winnerFilters.client;
      const matchStatus = ui.winnerFilters.status==='all' || w.status===ui.winnerFilters.status;
      return matchQ && matchClient && matchStatus;
    });
    return `<section class="page">
      <div class="page-heading"><div><div class="eyebrow">CIRCLE CLOSES</div><h1>Winner Library</h1><p class="page-subtitle">Active and fatigued Scale assets from the last 90 days — ready to expand or refresh.</p></div><div class="heading-actions"><button class="btn btn-secondary" data-action="export-winners">${icon('download')}Export view</button></div></div>
      <div class="glass-card filter-bar"><div class="search-field">${icon('search')}<input class="input" id="winnerFilterQuery" value="${esc(ui.winnerFilters.query)}" placeholder="Search winner ID, concept or producer…"></div><select class="select" id="winnerFilterClient"><option value="all">All clients</option>${Object.entries(CLIENTS).map(([code,c])=>`<option value="${code}" ${ui.winnerFilters.client===code?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select class="select" id="winnerFilterStatus"><option value="all">Active + fatigued</option><option value="Active" ${ui.winnerFilters.status==='Active'?'selected':''}>Active</option><option value="Fatigued" ${ui.winnerFilters.status==='Fatigued'?'selected':''}>Fatigued</option></select><span class="badge badge-green">${winners.length} usable winners</span></div>
      ${winners.length?`<div class="winner-grid">${winners.map(winnerCard).join('')}</div>`:emptyState('trophy','No winners match these filters','Clear the filters or run the verdict sync.')}
    </section>`;
  }

  function winnerCard(w) {
    return `<article class="glass-card winner-card" data-open-asset="${w.id}"><div class="winner-preview">${previewHTML(w.preview,w.onImageCopy)}<div class="winner-overlay"><span class="badge ${w.status==='Fatigued'?'badge-amber':'badge-green'}">${w.status==='Fatigued'?'Scale · fatigued':'Scale · active'}</span></div></div><div class="winner-card-body"><h3>${esc(w.concept)}</h3><div class="winner-id">${esc(w.id)} · ${esc(w.name)}</div><div class="winner-metrics"><div class="winner-metric"><span>ROAS</span><strong>${w.roas.toFixed(2)}x</strong></div><div class="winner-metric"><span>Revenue</span><strong>${money(w.revenue,true)}</strong></div><div class="winner-metric"><span>Children</span><strong>${w.descendants||0}</strong></div></div><div class="winner-card-foot"><span>${esc(clientMeta(w.client).name)} · ${esc(w.producer||'Unknown')}</span><button class="btn btn-ghost btn-xs" data-action="brief-refresh" data-parent-asset="${w.id}">Brief refresh</button></div></div></article>`;
  }

  function renderReconciliation() {
    const open = state.exceptions.filter(e=>e.status==='Open');
    const resolved = state.exceptions.filter(e=>e.status==='Resolved');
    const visible = ui.reconFilter==='all' ? state.exceptions : ui.reconFilter==='resolved'?resolved:open;
    const assets = allAssets();
    const matched = assets.filter(a=>a.launchStatus==='Matched').length;
    const delivered = assets.filter(a=>['Delivered','Rebuild Required'].includes(a.workflowStatus)).length;
    const matchRate = delivered ? matched/delivered*100 : 0;
    return `<section class="page">
      <div class="page-heading"><div><div class="eyebrow">AUTOMATIC · NIGHTLY</div><h1>Reconciliation</h1><p class="page-subtitle">Meta verifies what was actually launched. Omnia owns the exception queue.</p></div><div class="heading-actions"><span class="badge badge-muted">Last sync ${esc(state.lastSync)}</span><button class="btn btn-primary" data-action="run-sync">${icon('sync')}Run sync now</button></div></div>
      <div class="metric-grid" style="grid-template-columns:repeat(4,minmax(0,1fr))">${metricCard('Match rate',percent(matchRate),`${matched} platform IDs stamped`,'check','#20d67b')}${metricCard('Produced, not launched',open.filter(e=>e.type==='Produced not launched').length,'Registered but never appeared','clock','#ffb020')}${metricCard('Live, no match',open.filter(e=>e.type==='Live, no match').length,'Typo or outside process','alert','#ff4d5e')}${metricCard('Rebuild required',open.filter(e=>e.type==='Rebuild required').length,'Post-delivery copy change','refresh','#d946ef')}</div>
      <div class="connector-grid">${state.connectors.map(c=>`<div class="glass-card connector-card"><div class="connector-logo">${esc(c.name.slice(0,2).toUpperCase())}</div><div class="connector-copy"><strong>${esc(c.name)}</strong><span>${esc(c.detail)}</span></div><span class="connector-status"></span></div>`).join('')}</div>
      <div class="recon-layout"><section class="glass-card exception-table-card"><div class="launch-toolbar"><div class="launch-toolbar-left"><h3 style="margin:0;font-size:12px">Exception queue</h3><span class="badge badge-red">${open.length} open</span></div><div class="launch-toolbar-right"><button class="btn ${ui.reconFilter==='open'?'btn-secondary':'btn-ghost'} btn-sm" data-recon-filter="open">Open</button><button class="btn ${ui.reconFilter==='resolved'?'btn-secondary':'btn-ghost'} btn-sm" data-recon-filter="resolved">Resolved</button><button class="btn ${ui.reconFilter==='all'?'btn-secondary':'btn-ghost'} btn-sm" data-recon-filter="all">All</button></div></div><div class="launch-table-wrap"><table class="exception-table"><thead><tr><th>Type</th><th>Client</th><th>Asset / name</th><th>Details</th><th>Status</th><th></th></tr></thead><tbody>${visible.map(exceptionRow).join('')||`<tr><td colspan="6">${emptyState('check','Queue is clear','No exceptions match this filter.')}</td></tr>`}</tbody></table></div></section>
      <aside class="glass-card sync-log"><h3 style="margin:0;font-size:12px">Sync log</h3><p style="color:#756d80;font-size:9px;line-height:1.45;margin:6px 0 0">Meta first. Additional platforms require their own connector.</p><div class="sync-progress"><span id="syncProgressBar"></span></div><div class="sync-log-lines" id="syncLogLines"><div class="sync-log-line"><span class="ok">✓</span><span>Fetched 412 Meta ads</span></div><div class="sync-log-line"><span class="ok">✓</span><span>Extracted 397 valid ID blocks</span></div><div class="sync-log-line"><span class="ok">✓</span><span>Stamped ${matched} platform matches</span></div><div class="sync-log-line"><span class="warn">!</span><span>${open.length} exceptions require review</span></div></div><button class="btn btn-secondary btn-sm" style="width:100%;margin-top:13px" data-action="download-recon-log">${icon('download')}Download log</button></aside></div>
    </section>`;
  }

  function exceptionRow(ex) {
    return `<tr><td><span class="badge ${ex.severity==='error'?'badge-red':ex.severity==='warning'?'badge-amber':'badge-purple'}">${esc(ex.type)}</span></td><td>${clientLogo(ex.client)}</td><td><code style="font-family:var(--mono);font-size:8px;color:#c0b7ca">${esc(ex.assetId||ex.adName)}</code></td><td style="max-width:340px;line-height:1.45">${esc(ex.detail)}</td><td><span class="badge ${ex.status==='Resolved'?'badge-green':'badge-muted'}">${esc(ex.status)}</span></td><td>${ex.status==='Open'?`<button class="btn btn-secondary btn-xs" data-action="resolve-exception" data-exception-id="${ex.id}">Resolve</button>`:''}</td></tr>`;
  }

  function emptyState(ic,title,body) {
    return `<div class="empty-state"><div class="empty-state-icon">${icon(ic)}</div><h3>${esc(title)}</h3><p>${esc(body)}</p></div>`;

  function navigate(view) {

    ui.selectedCopyConceptId = null;

  function showToast(title, message='', type='default', duration=3200) {
    const toast = document.createElement('div');
    const ic = type==='success'?'check':type==='warning'?'alert':type==='error'?'x':'spark';
    toast.className = 'toast';
    toast.innerHTML = `<div class="toast-icon ${type}">${icon(ic)}</div><div><strong>${esc(title)}</strong>${message?`<span>${esc(message)}</span>`:''}</div>`;
    toastStack.appendChild(toast);
    setTimeout(()=>{toast.style.opacity='0';toast.style.transform='translateY(6px)';setTimeout(()=>toast.remove(),220);},duration);
  }

  }

    showModal(`<div class="modal-head"><div><h2>Add concept</h2><p style="margin:5px 0 0;color:#776f82;font-size:9px">A concept is the idea. Every execution after the first is a variation.</p></div><button class="modal-close" data-action="close-modal">${icon('x')}</button></div><form id="addConceptForm" data-brief-id="${brief.id}"><div class="modal-body"><div class="form-grid"><label class="form-label full">Concept name<input class="input" name="name" placeholder="e.g. Seminar Authority" required></label><label class="form-label">Pitch source<select class="select" name="pitchSource"><option>Pod Pitch</option><option>Own direction / no pitch</option></select></label><label class="form-label">Pitch ID<input class="input" name="pitchId" placeholder="#000"></label><label class="form-label">Pitch author<input class="input" name="pitchAuthor" value="Tyler"></label><label class="form-label">Expected variations<input class="input" type="number" min="1" max="20" name="expectedVariations" value="3"></label><label class="form-label full">Direction<textarea name="direction" required></textarea></label><label class="form-label full">Literal on-image copy<input class="input" name="literalCopy" placeholder="Optional"></label><label class="form-label full">Parent asset ID<input class="input" name="parentAssetId" placeholder="Optional winner lineage"></label></div></div><div class="modal-footer"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">Mint concept ID</button></div></form>`);

    const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    showToast('Handoff downloaded',`${filename} is ready to send to the media buyer.`,'success');

  function generateAssetId() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let out = '';
    for (let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
    if (allAssets().some(a=>a.id===out) || state.orphanWinners.some(a=>a.id===out)) return generateAssetId();
    return out;
  }

  function generateConceptId() {
    const ids = allConcepts().map(c=>parseInt(c.id.replace(/\D/g,''),10)).filter(Number.isFinite);
    return `C-${Math.max(4500,...ids)+1}`;
  }

  function createBriefFromForm(form) {
    const fd = new FormData(form);
    const client = String(fd.get('client'));
    const funnel = String(fd.get('funnel')).trim();
    const dateCode = new Date().toISOString().slice(5,10).replace('-','');
    const slug = `${client}_${funnel.replace(/[^a-z0-9]+/gi,'_').toUpperCase()}_${dateCode}`;
    const id = `BR-${client}-${Date.now().toString().slice(-5)}`;
    const brief = {
      id, slug, client, funnel, platform:'FB', medium:String(fd.get('medium')), type:'C', targetWeek:String(fd.get('targetWeek')), dueDate:'TBD',
      asanaUrl:String(fd.get('asanaUrl')), driveUrl:'', figmaUrl:'', owner:'Adrian Campos', briefer:'Tyler Wrightsman', designer:String(fd.get('designer')), copywriter:'Brad Wages', mediaBuyer:client==='BK'||client==='CP'?'Austin West':'Ilias', stageIndex:0, status:'Awaiting brief', createdAt:'Today', lastUpdated:'Just now', points:0, overview:String(fd.get('overview')||''), loomUrl:'', directives:[], activity:[], concepts:[]
    };
    const parentId = String(fd.get('parentAssetId')||'').trim().toUpperCase();
    if (parentId) {
      brief.concepts.push({ id:generateConceptId(), name:'Winner refresh', status:'Draft', pitch:{id:'—',author:'Tyler',status:'Own direction',source:'No pitch'}, expectedVariations:3, direction:`Refresh winning asset ${parentId}.`, literalCopy:'', referenceType:client.toLowerCase(), parentAssetId:parentId, copy:{primary:'',headline:'',description:''}, assets:[] });
      brief.stageIndex = 1; brief.status = 'Brief in progress';
    }
    state.briefs.unshift(brief); saveState(); closeModal(); openBrief(id,'workspace'); showToast('Brief container created',`${slug} is now linked to its parent Asana task.`,'success');
  }

  function saveCopy(conceptId) {
    const brief = briefById(ui.briefId); if (!brief) return;
    const concept = brief.concepts.find(c=>c.id===conceptId); if (!concept) return;
    const fields = document.querySelectorAll(`[data-copy-field][data-concept-id="${CSS.escape(conceptId)}"]`);
    let copyChanged = false;
    fields.forEach(el=>{ const key=el.dataset.copyField; const val=el.value; if (concept.copy[key]!==val) copyChanged=true; concept.copy[key]=val; });
    concept.assets.forEach(asset=>{ const input=document.querySelector(`[data-asset-copy="${CSS.escape(asset.id)}"]`); if(input&&asset.onImageCopy!==input.value){copyChanged=true;asset.onImageCopy=input.value;} });
    if (copyChanged) {
      let rebuilds = 0;
      concept.assets.forEach(asset=>{
        if (asset.workflowStatus==='Delivered' && asset.launchStatus!=='Matched') { asset.workflowStatus='Rebuild Required'; asset.status='Rebuild Required'; asset.launchStatus='Blocked'; asset.history ||= []; asset.history.unshift({at:'Just now',from:'Delivered',to:'Rebuild Required',actor:'System',reason:'Copy changed after delivery.'}); rebuilds++; }
      });
      brief.lastUpdated='Just now';
      brief.activity.unshift({time:'Just now',day:'Today',type:'copy',title:'Copy updated',body:`${concept.name} copy saved.${rebuilds?` ${rebuilds} delivered asset${rebuilds>1?'s':''} moved to Rebuild Required.`:''}`});
      saveState(); render(); showToast('Copy saved',rebuilds?`${rebuilds} delivered asset${rebuilds>1?'s':''} now require a rebuild.`:'The Omnia version is now the version that ships.',rebuilds?'warning':'success');
    } else showToast('No changes to save','The current Omnia copy already matches the form.');
  }

  function runVerdicts() {
    const brief = briefById(ui.briefId); if (!brief) return;
    const target = clientMeta(brief.client).targetCPA;
    let changes = 0;
    brief.concepts.forEach(concept=>concept.assets.forEach(asset=>{
      if (asset.launchStatus!=='Matched' || !asset.spend) return;
      let next='Pending';
      if (asset.spend < 500) next='Pending';
      else if (asset.cpa <= target*0.7 && asset.spend >= 5000) next='Scale';
      else if (asset.cpa <= target*1.15) next='Keep';
      else next='Kill';
      if (asset.verdict!==next) {
        asset.history ||= [];
        asset.history.unshift({at:'Just now',from:asset.verdict,to:next,actor:'Computed',reason:`Applied ${clientMeta(brief.client).name} target CPA of ${money(target)}.`});
        asset.verdict=next;asset.lastVerdict='Just now';changes++;
      }
    }));
    saveState(); render(); showToast('HYROS verdict sync complete',changes?`${changes} asset verdict${changes>1?'s':''} changed.`:'No verdicts changed.','success');
  }

  function runSync() {
    const brief = ui.view==='detail'?briefById(ui.briefId):null;
    showToast('Nightly reconciliation started','Fetching Meta ads and extracting permanent ID blocks.');
    const bar = document.getElementById('syncProgressBar');
    if (bar) { bar.style.width='12%'; setTimeout(()=>bar.style.width='64%',420); setTimeout(()=>bar.style.width='100%',950); }
    setTimeout(()=>{
      state.lastSync='Just now';
      if (brief) {
        brief.concepts.forEach(c=>c.assets.forEach(a=>{
          if (a.status==='Launched' && a.launchStatus!=='Matched') { a.launchStatus='Matched'; a.platformAdId ||= `1202${Math.floor(100000000+Math.random()*899999999)}`; }
        }));
      }
      saveState(); render(); showToast('Reconciliation complete','Platform matches were stamped. The exception queue is current.','success');
    },1300);
  }

  function markSelectedLaunched() {
    const brief = briefById(ui.briefId); if (!brief) return;
    if (!ui.selectedLaunchAssets.size) { showToast('Select at least one asset','Only launch-ready assets can be marked launched.','warning'); return; }
    let count=0, blocked=0;
    brief.concepts.forEach(c=>c.assets.forEach(a=>{
      if (!ui.selectedLaunchAssets.has(a.id)) return;
      const copyReady = c.copy.primary && c.copy.headline;
      if (!copyReady || a.workflowStatus==='Rebuild Required' || !a.deliveredAt) { blocked++; return; }
      a.status='Launched'; a.launchStatus='Pending verification'; a.launchedAt='Just now'; count++;
    }));
    brief.stageIndex=Math.max(brief.stageIndex,6);brief.status='Launch in progress';brief.lastUpdated='Just now';
    ui.selectedLaunchAssets.clear(); saveState(); render();
    showToast(`${count} asset${count===1?'':'s'} marked launched`,blocked?`${blocked} selected asset${blocked===1?' was':'s were'} blocked by copy, delivery or rebuild status.`:'Nightly reconciliation will verify platform IDs.',blocked?'warning':'success');
  }

  function deliverReady() {
    const brief = briefById(ui.briefId); if (!brief) return;
    let count=0;
    brief.concepts.forEach(c=>{
      const copyReady = c.copy.primary && c.copy.headline;
      c.assets.forEach(a=>{
        if (copyReady && ['Registered','Rebuild Required'].includes(a.workflowStatus)) {
          a.workflowStatus='Delivered';a.status='Ready';a.launchStatus='Not launched';a.deliveredAt='Just now';a.deliveredBy=brief.designer;count++;
        }
      });
    });
    if (!count) { showToast('Nothing ready to deliver','Complete concept-level ad copy or register additional frames first.','warning'); return; }
    brief.stageIndex=Math.max(brief.stageIndex,5);brief.status='Delivered';brief.lastUpdated='Just now';
    brief.activity.unshift({time:'Just now',day:'Today',type:'deliver',title:'Assets delivered',body:`${count} assets exported to Ad Finals and added to the media-buyer handoff.`});
    saveState();render();showToast(`${count} asset${count===1?'':'s'} delivered`,'Files exported to Drive and the copy & creatives handoff is ready.','success');
  }

  function copyText(text) {
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(()=>showToast('Copied to clipboard',text.slice(0,70)+(text.length>70?'…':''),'success')).catch(()=>fallbackCopy(text));
    else fallbackCopy(text);
  }

  function fallbackCopy(text) {
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('Copied to clipboard',text.slice(0,70)+(text.length>70?'…':''),'success');
  }

  function handleGlobalSearch(query) {
    const q=query.trim().toLowerCase();
    if (!q) { searchResults.classList.remove('open');searchResults.innerHTML='';return; }
    const assets=allAssets().filter(a=>[a.id,a.name,a.concept.name,a.brief.slug,clientMeta(a.client).name,a.onImageCopy].join(' ').toLowerCase().includes(q)).slice(0,6);
    const concepts=allConcepts().filter(c=>[c.id,c.name,c.brief.slug,c.pitch.id,c.pitch.author].join(' ').toLowerCase().includes(q)).slice(0,4);
    const briefs=state.briefs.filter(b=>[b.id,b.slug,clientMeta(b.client).name,b.funnel,b.status].join(' ').toLowerCase().includes(q)).slice(0,4);
    const orphans=state.orphanWinners.filter(w=>[w.id,w.name,w.concept,clientMeta(w.client).name].join(' ').toLowerCase().includes(q)).slice(0,4);
    if(!assets.length&&!concepts.length&&!briefs.length&&!orphans.length){searchResults.innerHTML='<div class="search-empty">No registered creative object matches this search.</div>';searchResults.classList.add('open');return;}
    let html='';
    if(assets.length||orphans.length) html+=`<div class="search-group-title">ASSETS</div>${[...assets.map(a=>({id:a.id,title:`${a.id} · ${a.concept.name}`,sub:a.name,type:'Asset'})),...orphans.map(w=>({id:w.id,title:`${w.id} · ${w.concept}`,sub:w.name,type:'Winner'}))].map(r=>searchResult(r,'image')).join('')}`;
    if(concepts.length) html+=`<div class="search-group-title">CONCEPTS</div>${concepts.map(c=>`<button class="search-result" data-search-open-brief="${c.brief.id}"><span class="search-result-icon">${icon('spark')}</span><span class="search-result-copy"><strong>${esc(c.id)} · ${esc(c.name)}</strong><span>${esc(c.brief.slug)} · ${esc(c.pitch.id)} ${esc(c.pitch.author)}</span></span><span class="search-result-type">Concept</span></button>`).join('')}`;
    if(briefs.length) html+=`<div class="search-group-title">BRIEFS</div>${briefs.map(b=>`<button class="search-result" data-search-open-brief="${b.id}"><span class="search-result-icon">${icon('file')}</span><span class="search-result-copy"><strong>${esc(b.slug)}</strong><span>${esc(clientMeta(b.client).name)} · ${esc(b.status)}</span></span><span class="search-result-type">Brief</span></button>`).join('')}`;
    searchResults.innerHTML=html;searchResults.classList.add('open');
  }

  function searchResult(r,ic){return `<button class="search-result" data-search-open-asset="${r.id}"><span class="search-result-icon">${icon(ic)}</span><span class="search-result-copy"><strong>${esc(r.title)}</strong><span>${esc(r.sub)}</span></span><span class="search-result-type">${esc(r.type)}</span></button>`;}

  document.addEventListener('click', event => {
    const target = event.target.closest('button, [data-action], [data-open-brief], [data-open-asset], [data-navigate], [data-main-view], [data-tab], [data-search-open-asset], [data-search-open-brief], [data-recon-filter]');
    if (!target) {
      if (!event.target.closest('#globalSearchWrap')) searchResults.classList.remove('open');
      if (!event.target.closest('#userMenu') && !event.target.closest('#userMenuBtn')) document.getElementById('userMenu').classList.remove('open');
      return;
    }

    if (target.dataset.mainView) { navigate(target.dataset.mainView); return; }
    if (target.dataset.navigate) { navigate(target.dataset.navigate); return; }
    if (target.dataset.openBrief) { openBrief(target.dataset.openBrief); return; }
    if (target.dataset.openAsset) { event.stopPropagation(); openAssetDrawer(target.dataset.openAsset); return; }
    if (target.dataset.searchOpenAsset) { searchResults.classList.remove('open');globalSearch.value='';openAssetDrawer(target.dataset.searchOpenAsset);return; }
    if (target.dataset.searchOpenBrief) { searchResults.classList.remove('open');globalSearch.value='';openBrief(target.dataset.searchOpenBrief);return; }
    if (target.dataset.tab) { ui.detailTab=target.dataset.tab;render();appView.scrollTop=0;return; }
    if (target.dataset.reconFilter) { ui.reconFilter=target.dataset.reconFilter;render();return; }

    const action = target.dataset.action;
    switch (action) {
      case 'create-brief': createBriefModal(); break;
      case 'close-modal': closeModal(); break;
      case 'close-drawer': closeDrawer(); break;
      case 'edit-brief': editBriefModal(briefById(ui.briefId)); break;
      case 'add-concept': addConceptModal(briefById(ui.briefId)); break;
      case 'register-asset': registerAssetModal(briefById(ui.briefId)); break;
      case 'add-variation': registerAssetModal(briefById(ui.briefId),target.dataset.conceptId); break;
      case 'toggle-concept': target.closest('.concept-card')?.classList.toggle('collapsed'); break;
      case 'select-copy-concept': {
        const brief=briefById(ui.briefId);const concept=brief?.concepts.find(c=>c.id===target.dataset.conceptId);
        ui.selectedCopyConceptId=concept?.id||null;ui.selectedCopyAssetId=concept?.assets[0]?.id||null;render();break;
      }
      case 'select-copy-asset': ui.selectedCopyAssetId=target.dataset.assetId;render();break;
      case 'select-lineage-concept': {
        const brief=briefById(ui.briefId);const concept=brief?.concepts.find(c=>c.id===target.dataset.conceptId);
        ui.selectedLineageConceptId=concept?.id||null;ui.selectedLineageAssetId=concept?.assets[0]?.id||null;render();break;
      }
      case 'select-lineage-asset': ui.selectedLineageAssetId=target.dataset.assetId;render();break;
      case 'save-copy': saveCopy(target.dataset.conceptId); break;
      case 'import-copy': showToast('Document parsed','Prototype mapped the document headers into the concept-level and asset-level fields.','success'); break;
      case 'deliver-ready': deliverReady(); break;
      case 'toggle-launch-select': {
        const id=target.dataset.assetId; ui.selectedLaunchAssets.has(id)?ui.selectedLaunchAssets.delete(id):ui.selectedLaunchAssets.add(id); render(); break;

    </section>`;
  };

  function renderMediaBuyerV3() {
    const f = ui.mediaFilters;
    const q = f.query.toLowerCase().trim();
    const records = allAssets().map(item=>({asset:item,concept:item.concept,brief:item.brief})).filter(({asset,concept,brief})=>{
      const client=clientMeta(brief.client);const ready=isLaunchReadyV3(asset,concept);const statusMatch=f.status==='all'||(f.status==='needs'&&ready&&asset.launchStatus!=='Matched')||(f.status==='launched'&&asset.launchStatus==='Matched')||(f.status==='blocked'&&!ready&&asset.launchStatus!=='Matched');
      const queryMatch=!q||[asset.id,adName(brief,concept,asset),concept.name,brief.slug,client.name].join(' ').toLowerCase().includes(q);
      return queryMatch&&statusMatch&&(f.pod==='all'||client.pod===f.pod)&&(f.client==='all'||brief.client===f.client)&&(f.buyer==='all'||brief.mediaBuyer===f.buyer);
    });
    const allRecords=allAssets().map(item=>({asset:item,concept:item.concept,brief:item.brief}));
    const needs=allRecords.filter(({asset,concept})=>isLaunchReadyV3(asset,concept)&&asset.launchStatus!=='Matched').length;
    const live=allRecords.filter(({asset})=>asset.launchStatus==='Matched').length;
    const blocked=allRecords.filter(({asset,concept})=>!isLaunchReadyV3(asset,concept)&&asset.launchStatus!=='Matched').length;
    const selected=[...ui.selectedLaunchAssets].filter(id=>records.some(r=>r.asset.id===id));
    return `<section class="page"><div class="page-heading"><div><div class="eyebrow">ROLE VIEW · MEDIA BUYING</div><h1>Media Buyer Queue</h1><p class="page-subtitle">Scan every batch, open the full context, download final creatives and launch without leaving one role-specific database.</p></div><div class="heading-actions"><button class="btn btn-secondary" data-action="run-sync">${icon('sync')}Reconcile Meta</button></div></div>${systemActionBarV3('media')}
      <div class="v3-filter-strip"><div class="search-field" style="min-width:280px">${icon('search')}<input class="input" id="v3MediaQuery" value="${esc(f.query)}" placeholder="Search ID, ad name or batch…"></div><select class="select" id="v3MediaPod"><option value="all">All pods</option><option value="Pod 1" ${f.pod==='Pod 1'?'selected':''}>Pod 1</option><option value="Pod 2" ${f.pod==='Pod 2'?'selected':''}>Pod 2</option></select><select class="select" id="v3MediaClient"><option value="all">All clients</option>${Object.entries(CLIENTS).map(([code,c])=>`<option value="${code}" ${f.client===code?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select class="select" id="v3MediaBuyer"><option value="all">All media buyers</option>${[...new Set(state.briefs.map(b=>b.mediaBuyer))].map(p=>`<option value="${esc(p)}" ${f.buyer===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
      <div class="v3-queue-tabs"><button class="v3-queue-tab ${f.status==='needs'?'active':''}" data-action="media-status" data-status="needs">Needs launch · ${needs}</button><button class="v3-queue-tab ${f.status==='launched'?'active':''}" data-action="media-status" data-status="launched">Launched · ${live}</button><button class="v3-queue-tab ${f.status==='blocked'?'active':''}" data-action="media-status" data-status="blocked">Blocked · ${blocked}</button><button class="v3-queue-tab ${f.status==='all'?'active':''}" data-action="media-status" data-status="all">All assets</button></div>
      <div class="v3-media-layout"><section class="glass-card launch-main"><div class="launch-toolbar"><div class="launch-toolbar-left"><span class="badge badge-purple">${records.length} assets</span><span style="font-size:8px;color:#766d80">${selected.length} selected</span></div><div class="launch-toolbar-right"><button class="btn btn-secondary btn-sm" data-action="global-copy-names">${icon('copy')}Copy selected names</button><button class="btn btn-primary btn-sm" data-action="global-mark-launched">${icon('rocket')}Mark selected launched</button></div></div><div class="launch-table-wrap"><table class="launch-table v3-media-table"><thead><tr><th></th><th>Creative</th><th>Batch / context</th><th>Frozen ad name</th><th>Final file</th><th>Readiness</th><th>Launch</th></tr></thead><tbody>${records.map(({asset,concept,brief})=>{
        const selected=ui.selectedLaunchAssets.has(asset.id);const ready=isLaunchReadyV3(asset,concept);const vi=versionInfoV3(concept,asset);return `<tr><td><button class="checkbox ${selected?'checked':''}" data-action="global-toggle-launch" data-asset-id="${asset.id}">${icon('check')}</button></td><td><div class="manifest-asset"><div class="manifest-thumb" data-open-asset="${asset.id}">${previewV3(asset,concept,true)}</div><div class="manifest-id"><strong>${vi.label} · ${asset.id}</strong><span>${esc(concept.name)}</span></div></div></td><td><button class="btn btn-ghost btn-xs" data-open-brief="${brief.id}">${esc(brief.slug)}</button><div style="font-size:7.5px;color:#6e6579;margin-top:3px">${esc(brief.mediaBuyer)} · ${esc(clientMeta(brief.client).pod)}</div></td><td class="ad-name-cell"><div class="ad-name-wrap"><code>${esc(adName(brief,concept,asset))}</code><button class="copy-inline" data-copy-text="${esc(adName(brief,concept,asset))}">${icon('copy')}</button></div></td><td><div class="v3-file-actions"><button class="btn btn-secondary btn-xs" data-action="download-creative" data-asset-id="${asset.id}">${icon('download')}Download</button><button class="btn btn-ghost btn-xs" data-action="open-url" data-url="${esc(brief.driveUrl)}">${icon('external')}Drive</button></div></td><td><span class="badge ${ready?'badge-green':'badge-amber'}">${ready?'Ready':'Blocked'}</span></td><td><span class="badge ${workflowBadge(asset.launchStatus)}">${esc(asset.launchStatus)}</span></td></tr>`;
      }).join('')||`<tr><td colspan="7">${emptyState('rocket','No assets in this queue','Change the status or filters above.')}</td></tr>`}</tbody></table></div></section>
      <aside class="v3-side-summary"><div class="glass-card side-card"><h3>Queue summary</h3><div class="v3-summary-grid"><div class="v3-summary-item"><span>Needs launch</span><strong>${needs}</strong></div><div class="v3-summary-item"><span>Launched</span><strong>${live}</strong></div><div class="v3-summary-item"><span>Blocked</span><strong>${blocked}</strong></div><div class="v3-summary-item"><span>Selected</span><strong>${selected.length}</strong></div></div></div><div class="v3-callout"><strong>Media buyer workflow</strong><br>1. Scan the backlog.<br>2. Open a batch only when context is needed.<br>3. Download the final file and copy the frozen ad name.<br>4. Launch, then let reconciliation verify the match.</div><div class="glass-card side-card"><h3>What “ready” means</h3><div class="status-list"><div class="status-row"><span>Final file delivered</span><span class="badge badge-green">Required</span></div><div class="status-row"><span>Headline + body complete</span><span class="badge badge-green">Required</span></div><div class="status-row"><span>No rebuild flag</span><span class="badge badge-green">Required</span></div></div></div></aside></div>
    </section>`;
  }

  function renderPerformanceDatabaseV3() {
    const f=ui.performanceFilters;const q=f.query.toLowerCase().trim();
    const records=allAssets().map(item=>({asset:item,concept:item.concept,brief:item.brief})).filter(({asset,concept,brief})=>{
      const c=clientMeta(brief.client);const query=!q||[asset.id,adName(brief,concept,asset),concept.name,brief.slug,c.name].join(' ').toLowerCase().includes(q);return query&&(f.pod==='all'||c.pod===f.pod)&&(f.client==='all'||brief.client===f.client)&&(f.verdict==='all'||asset.verdict===f.verdict)&&(f.batch==='all'||brief.id===f.batch);
    });
    const tracked=records.filter(r=>r.asset.launchStatus==='Matched');const spend=tracked.reduce((s,r)=>s+r.asset.spend,0);const revenue=tracked.reduce((s,r)=>s+r.asset.revenue,0);const roas=spend?revenue/spend:0;const winners=tracked.filter(r=>r.asset.verdict==='Scale').length;
    return `<section class="page"><div class="page-heading"><div><div class="eyebrow">CENTRALIZED PERFORMANCE</div><h1>Creative Performance Database</h1><p class="page-subtitle">Compare performance across batches instead of opening one creative asset at a time.</p></div><div class="heading-actions"><button class="btn btn-primary" data-action="run-all-verdicts">${icon('bolt')}Run verdict sync</button></div></div>${systemActionBarV3('performance')}
      <div class="metric-grid">${metricCardV3('Tracked spend',money(spend,true),`${tracked.length} launched assets`,'Creative-level spend for the current database view.','chart','#4f8cff')}${metricCardV3('Attributed revenue',money(revenue,true),`${roas.toFixed(2)}x blended ROAS`,'Revenue attributed through the permanent asset ID.','dollar','#20d67b')}${metricCardV3('Scale winners',winners,`${tracked.filter(r=>r.asset.verdict==='Keep').length} Keep · ${tracked.filter(r=>r.asset.verdict==='Kill').length} Kill`,'Assets currently above the client-specific Scale threshold.','trophy','#d946ef')}${metricCardV3('Untracked launches',records.filter(r=>r.asset.status==='Launched'&&r.asset.launchStatus!=='Matched').length,'Requires reconciliation','Launched items that have not yet been matched to a platform ad ID.','alert','#ffb020')}</div>
      <div class="glass-card filter-bar"><div class="search-field">${icon('search')}<input class="input" id="v3PerformanceQuery" value="${esc(f.query)}" placeholder="Search creative performance…"></div><select class="select" id="v3PerformancePod"><option value="all">All pods</option><option value="Pod 1" ${f.pod==='Pod 1'?'selected':''}>Pod 1</option><option value="Pod 2" ${f.pod==='Pod 2'?'selected':''}>Pod 2</option></select><select class="select" id="v3PerformanceClient"><option value="all">All clients</option>${Object.entries(CLIENTS).map(([code,c])=>`<option value="${code}" ${f.client===code?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select class="select" id="v3PerformanceVerdict"><option value="all">All verdicts</option>${['Scale','Keep','Kill','Pending'].map(v=>`<option value="${v}" ${f.verdict===v?'selected':''}>${v}</option>`).join('')}</select>${f.batch!=='all'?`<button class="btn btn-ghost btn-sm" data-action="clear-performance-batch">${icon('x')}Clear batch filter</button>`:''}<span class="badge badge-muted">${records.length} assets</span></div>
      <div class="glass-card"><div class="launch-table-wrap"><table class="performance-table v3-performance-table"><thead><tr><th>Asset</th><th>Batch</th><th>Client</th><th>Spend</th><th>Revenue</th><th>CPA</th><th>ROAS</th><th>Verdict</th><th>Lineage</th></tr></thead><tbody>${records.map(({asset,concept,brief})=>`<tr data-open-asset="${asset.id}"><td><div class="manifest-asset"><div class="manifest-thumb">${previewV3(asset,concept,true)}</div><div class="manifest-id"><strong>${versionInfoV3(concept,asset).label} · ${asset.id}</strong><span>${esc(concept.name)}</span></div></div></td><td><button class="btn btn-ghost btn-xs" data-open-brief="${brief.id}">${esc(brief.slug)}</button></td><td>${esc(clientMeta(brief.client).name)}</td><td><strong>${asset.spend?money(asset.spend):'—'}</strong></td><td><strong>${asset.revenue?money(asset.revenue):'—'}</strong></td><td>${asset.cpa?money(asset.cpa):'—'}</td><td><div class="v3-metric-line"><strong>${asset.roas?asset.roas.toFixed(2)+'x':'—'}</strong><div class="roas-bar"><span style="width:${Math.min(100,(asset.roas||0)/4*100)}%"></span></div></div></td><td><span class="badge ${workflowBadge(asset.verdict)}">${esc(asset.verdict)}</span></td><td>${concept.parentAssetId?`<button class="btn btn-ghost btn-xs" data-open-asset="${concept.parentAssetId}">${icon('tree')}${esc(concept.parentAssetId)}</button>`:'Net new'}</td></tr>`).join('')||`<tr><td colspan="9">${emptyState('chart','No performance records match','Clear the filters or run reconciliation.')}</td></tr>`}</tbody></table></div></div>
    </section>`;
  }

  render = function() {
    setActiveNav(ui.view === 'detail' ? 'briefs' : ui.view);
    switch(ui.view){
      case 'briefs': appView.innerHTML=renderBriefs();break;
      case 'media': appView.innerHTML=renderMediaBuyerV3();break;
      case 'performance': appView.innerHTML=renderPerformanceDatabaseV3();break;
      case 'winners': appView.innerHTML=renderWinners();break;
      case 'reconciliation': appView.innerHTML=renderReconciliation();break;
      case 'detail': appView.innerHTML=renderDetail();break;
      default: appView.innerHTML=renderDashboard();
    }
  };

  openBrief = function(id,tab='brief') {
    ui.view='detail';ui.briefId=id;ui.detailTab=(tab==='workspace'?'brief':tab);ui.selectedLaunchAssets=new Set();ui.selectedCopyConceptId=null;ui.selectedCopyAssetId=null;render();appView.scrollTop=0;
  };

  function detailTabsV3() {
    return `<div class="v3-workspace-tabs">${WORKSPACE_TABS_V3.map(([id,ic,label])=>`<button class="v3-workspace-tab ${ui.detailTab===id?'active':''}" data-tab="${id}">${icon(ic)}${label}</button>`).join('')}</div>`;

  renderDetail = function() {
    const brief=briefById(ui.briefId)||state.briefs[0];if(!brief)return emptyState('file','Creative asset not found','Return to the Creative Asset System.');ui.briefId=brief.id;if(!WORKSPACE_TABS_V3.some(t=>t[0]===ui.detailTab))ui.detailTab='brief';const assets=brief.concepts.flatMap(c=>c.assets);const c=clientMeta(brief.client);
    return `<section class="page detail-page"><div class="breadcrumbs"><button data-navigate="dashboard">Creative Asset System</button>${icon('chevron')}<button data-navigate="briefs">Creative Assets</button>${icon('chevron')}<span>${esc(brief.slug)}</span></div>${systemActionBarV3('assets')}
      <div class="glass-card batch-hero v3-compact-hero"><div class="batch-hero-left">${clientLogo(brief.client,'batch-hero-logo')}<div class="batch-hero-copy"><h1>${esc(brief.slug)}</h1><div class="batch-hero-meta"><span>${esc(c.name)}</span><span class="meta-sep">•</span><span>${esc(c.pod)}</span><span class="meta-sep">•</span><span>${esc(brief.funnel)}</span><span class="meta-sep">•</span><span>${esc(brief.medium)}</span><span class="meta-sep">•</span><button class="v3-meta-link" data-action="open-asana" data-url="${esc(brief.asanaUrl)}">${icon('external')}Asana</button><span class="badge ${brief.briefSubmitted?'badge-green':'badge-amber'}">${brief.briefSubmitted?'Brief submitted':'Brief not submitted'}</span></div></div></div><div class="batch-hero-actions"><button class="btn btn-secondary btn-sm" data-action="find-performance" data-brief-id="${brief.id}">${icon('chart')}Find in performance DB</button><button class="btn btn-primary btn-sm" data-action="open-media-batch" data-brief-id="${brief.id}">${icon('rocket')}Open in launch queue</button></div></div>
      <div class="glass-card stage-rail v3-stage-rail"><div class="stage-rail-inner">${CHECKPOINTS.map((stage,i)=>{const current=checkpointIndex(brief);return `<div class="stage-step ${i<current?'done':i===current?'active':''}"><span class="stage-number">${i<current?icon('check'):i+1}</span><span>${esc(stage.label)}</span></div>`}).join('')}</div></div>

  function renderDetailContentV3(brief,assets){switch(ui.detailTab){case'brief':return renderBriefStageV3(brief);case'design':return renderDesignStageV3(brief);case'copy':return renderCopyStageV3(brief);case'launch':return renderLaunchStageV3(brief,assets);case'activity':return renderActivityStageV3(brief);default:return renderBriefStageV3(brief);}}

  function renderBriefStageV3(brief) {
    return `<div class="v3-brief-layout"><section class="glass-card"><div class="v3-brief-header"><div><h2>Creative brief</h2><p>Tyler defines the problem, source and requested outputs here. Designer deliverables live in the next stage — not inside the brief.</p></div><div class="v3-brief-status"><span class="badge ${brief.briefSubmitted?'badge-green':'badge-amber'}">${brief.briefSubmitted?'Submitted to design':'Draft'}</span><button class="btn btn-ghost btn-xs" data-action="edit-brief">${icon('edit')}Edit</button></div></div><div class="v3-brief-body">
      ${brief.overview?`<div class="v3-brief-summary"><div class="v3-info-panel"><label>Objective</label><p>${esc(brief.overview)}</p></div><div class="v3-info-panel"><label>Brief resources</label><div class="link-row"><button class="btn btn-secondary btn-xs" data-action="open-url" data-url="${esc(brief.loomUrl)}">${icon('play')}Loom</button><button class="btn btn-secondary btn-xs" data-action="open-url" data-url="${esc(brief.figmaUrl)}">${icon('external')}Figma</button><button class="btn btn-secondary btn-xs" data-action="open-asana" data-url="${esc(brief.asanaUrl)}">${icon('external')}Asana</button></div></div></div><div class="v3-info-panel"><label>Global directives</label><div class="v3-directive-list">${brief.directives.map(d=>`<div class="v3-directive">${icon('check')}<span>${esc(d)}</span></div>`).join('')||'<span style="font-size:8.5px;color:#70677a">No global directives yet.</span>'}</div></div>`:`<div class="empty-state"><div class="empty-state-icon">${icon('file')}</div><h3>Brief content is empty</h3><p>Add the objective, Loom and directives before submitting to design.</p><button class="btn btn-primary btn-sm" data-action="edit-brief">Fill brief</button></div>`}
      <div><div class="section-title-row" style="margin-bottom:9px"><div><h2>Concept requests</h2><p>${brief.concepts.length} ideas · each request is separate from what the designer eventually produces</p></div><button class="btn btn-secondary btn-sm" data-action="add-concept">${icon('plus')}Add concept request</button></div><div class="v3-concept-request-list">${brief.concepts.map((concept,index)=>`<details class="v3-concept-request"><summary><span class="v3-concept-request-index">${index+1}</span><span class="v3-concept-request-title"><strong>${esc(concept.name)}</strong><span>${esc(concept.id)} · ${concept.parentAssetId?'Winner refresh':'Net-new concept'} · ${concept.expectedVariations} requested variation${concept.expectedVariations===1?'':'s'}</span></span><span class="badge ${concept.parentAssetId?'badge-green':concept.pitch.source==='No pitch'?'badge-muted':'badge-purple'}">${concept.parentAssetId?'Winner source':esc(concept.pitch.source)}</span></summary><div class="v3-concept-request-body"><div class="v3-request-field"><label>Idea source</label><div>${concept.parentAssetId?`Winner ${esc(concept.parentAssetId)}`:`${esc(concept.pitch.source)} · ${esc(concept.pitch.id)} ${esc(concept.pitch.author)}`}</div></div><div class="v3-request-field"><label>Requested output</label><div>${concept.parentAssetId?`${concept.expectedVariations} refresh variations`:`1 primary concept (V0) + ${concept.expectedVariations} variations`}</div></div><div class="v3-request-field full"><label>Direction</label><div>${esc(concept.direction||'No direction submitted.')}</div></div></div></details>`).join('')||emptyState('spark','No concept requests yet','Add a net-new concept, pod pitch or winner refresh.')}</div></div>
    </div></section><aside class="v3-side-summary"><div class="glass-card v3-submit-panel"><h3>Brief submission</h3><p>${brief.briefSubmitted?'The designer has a frozen starting point. Revisions remain possible, but Omnia will flag downstream changes.':'The brief is still a draft. Submitting creates a clear handoff and moves the batch to Design.'}</p><button class="btn ${brief.briefSubmitted?'btn-secondary':'btn-primary'}" data-action="submit-brief" ${brief.briefSubmitted?'disabled':''}>${brief.briefSubmitted?icon('check')+ 'Brief submitted':icon('arrow')+'Submit brief to design'}</button></div><div class="glass-card side-card"><h3>Owners</h3><div class="status-list"><div class="status-row"><span>Briefer</span><span class="person-chip">${personDot(brief.briefer)}${esc(brief.briefer)}</span></div><div class="status-row"><span>Designer</span><span class="person-chip">${personDot(brief.designer)}${esc(brief.designer)}</span></div><div class="status-row"><span>Target week</span><span>${esc(brief.targetWeek)}</span></div></div></div><div class="v3-callout"><strong>Source rules</strong><br>Every concept must point to a Pod Pitch, a prior winner, or “Own direction / no pitch.” This preserves attribution without forcing a pitch where one does not exist.</div></aside></div>`;
  }

  function renderDesignStageV3(brief) {
    return `<div><div class="copy-banner"><div class="copy-banner-left"><div class="copy-banner-icon">${icon('image')}</div><div><h2>Designer deliverables</h2><p>The brief is reference only. The designer submits a V0 primary concept for net-new ideas, then V1+ variations. Winner refreshes start directly with variations.</p></div></div><button class="btn btn-secondary btn-sm" data-action="add-design-deliverable">${icon('plus')}Add designer deliverable</button></div><div class="v3-design-stack">${brief.concepts.map(concept=>{
      const sourcePreview=concept.parentAssetId?(assetById(concept.parentAssetId)?.orphan?.preview||assetById(concept.parentAssetId)?.asset?.preview||concept.referenceType):concept.referenceType;const requested=requestedCountForConceptV3(concept);return `<details class="v3-design-concept"><summary><div class="v3-design-title"><code>${esc(concept.id)}</code><div><strong>${esc(concept.name)}</strong><span>${concept.assets.length} produced / ${requested} requested</span></div></div><div class="toolbar"><span class="badge ${concept.assets.length>=requested?'badge-green':'badge-amber'}">${concept.assets.length>=requested?'Complete':'In production'}</span>${icon('chevron-down')}</div></summary><div class="v3-design-body"><div class="v3-source-vs-output"><div class="v3-source-card"><div class="v3-source-card-label">${concept.parentAssetId?'Source winner':'Brief reference — not launchable'}</div>${previewHTML(sourcePreview,concept.literalCopy)}<p>${concept.parentAssetId?`Use ${esc(concept.parentAssetId)} as the proven parent. Do not recreate a separate V0.`:'This reference communicates direction only. The designer’s actual primary concept is a separate deliverable below.'}</p></div><div><div class="v3-output-label">Designer output</div><div class="v3-deliverable-grid">${concept.assets.map(asset=>designDeliverableCardV3(brief,concept,asset)).join('')}<button class="v3-empty-deliverable" data-action="add-design-deliverable" data-concept-id="${concept.id}">${icon('plus')}<div>Add ${concept.assets.length===0&&!concept.parentAssetId?'V0 primary concept':'next variation'}<br><span style="font-size:7.5px">A placeholder can be created before a file exists.</span></div></button></div></div></div></div></details>`;

></td><td><div class="v3-file-actions"><button class="btn btn-secondary btn-xs" data-action="download-creative" data-asset-id="${asset.id}">${icon('download')}Download</button><button class="btn btn-ghost btn-xs" data-action="open-url" data-url="${esc(brief.driveUrl)}">${icon('external')}Drive</button></div></td><td><span class="badge ${copyReady?'badge-green':'badge-amber'}">${copyReady?'Complete':'Missing'}</span></td><td><span class="badge ${workflowBadge(asset.launchStatus)}">${esc(asset.launchStatus)}</span></td></tr>`}).join('')||`<tr><td colspan="6">${emptyState('rocket','Nothing ready to launch','Complete design and copy first.')}</td></tr>`}</tbody></table></div></section></div>`;

  function openDesignDeliverableModalV3(brief,conceptId=''){
    if(!brief?.concepts?.length){showToast('Add a concept request first','Designer deliverables need a parent concept.','warning');return;}const concept=brief.concepts.find(c=>c.id===conceptId)||brief.concepts[0];const next=concept.assets.length===0&&!concept.parentAssetId?'V0 primary concept':`V${concept.parentAssetId?concept.assets.length+1:concept.assets.length} variation`;
