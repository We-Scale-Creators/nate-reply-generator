<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Omnia — Creative Asset System V4.2 UX</title>
  <style>
:root {
  --bg: #080612;
  --bg-deep: #06050d;
  --sidebar: #0b0913;
  --surface: rgba(24, 19, 41, 0.78);
  --surface-2: rgba(29, 24, 49, 0.82);
  --surface-3: rgba(38, 31, 62, 0.72);
  --surface-solid: #161126;
  --line: rgba(154, 126, 196, 0.18);
  --line-strong: rgba(167, 139, 250, 0.34);
  --text: #f7f5fb;
  --text-2: #c8c1d5;
  --muted: #8f879f;
  --muted-2: #6f687c;
  --violet: #a855f7;
  --violet-2: #7c3aed;
  --magenta: #d946ef;
  --blue: #4f8cff;
  --green: #20d67b;
  --amber: #ffb020;
  --red: #ff4d5e;
  --cyan: #3ddbd9;
  --shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
  --sidebar-width: 228px;
  --topbar-height: 74px;
  --radius-xs: 8px;
  --radius-sm: 10px;
  --radius: 14px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
.hidden { display: none !important; }

html, body { min-height: 100%; }

body {
  margin: 0;
  color: var(--text);
  font-family: var(--font);
  background:
    radial-gradient(circle at 72% -10%, rgba(107, 51, 172, 0.28), transparent 34%),
    radial-gradient(circle at 42% 90%, rgba(42, 71, 150, 0.18), transparent 35%),
    var(--bg);
  overflow: hidden;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .14;
  background-image:
    linear-gradient(rgba(156, 129, 197, .12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(156, 129, 197, .12) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: linear-gradient(to bottom, black, transparent 86%);
}

button, input, textarea, select { font: inherit; }
button { color: inherit; }
a { color: inherit; text-decoration: none; }

.svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

.app-shell { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); height: 100vh; position: relative; z-index: 1; }

.sidebar {
  background: rgba(9, 7, 16, .96);
  border-right: 1px solid rgba(151, 126, 192, .14);
  height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 20;
  transition: width .24s ease, transform .24s ease;
}

.brand-row { height: 68px; padding: 0 18px; display: flex; align-items: center; gap: 12px; }
.omnia-mark { width: 32px; height: 32px; flex: none; filter: drop-shadow(0 7px 18px rgba(168, 85, 247, .25)); }
.omnia-mark svg { width: 32px; height: 32px; stroke: none; }
.brand-word { letter-spacing: .32em; font-size: 11px; font-weight: 800; color: #b77bff; }
.sidebar-collapse { margin-left: auto; color: #6f667e; width: 28px; height: 28px; }

.primary-nav { padding: 6px 10px 90px; flex: 1; overflow-y: auto; scrollbar-width: none; }
.primary-nav::-webkit-scrollbar { display: none; }
.nav-section { margin-top: 11px; }
.nav-label { padding: 7px 9px 6px; font-size: 9px; letter-spacing: .16em; font-weight: 800; color: #645d73; }
.nav-item, .subnav-item {
  width: 100%;
  border: 0;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #a8a1b6;
  min-height: 38px;
  border-radius: 9px;
  padding: 0 9px;
  text-align: left;
  transition: background .15s ease, color .15s ease, border .15s ease;
}
.nav-item:hover, .subnav-item:hover { color: #e4dff0; background: rgba(255,255,255,.035); }
.nav-item svg, .subnav-item svg { width: 17px; height: 17px; color: #7e748f; flex: none; }
.nav-item span, .subnav-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item .nav-chevron { margin-left: auto; width: 14px; height: 14px; }
.nav-parent.is-open { color: #ddd6eb; }
.subnav { position: relative; margin-left: 16px; padding-left: 12px; border-left: 1px solid rgba(161, 134, 203, .16); }
.subnav.subtle { opacity: .75; }
.subnav-item { min-height: 34px; padding-left: 5px; font-size: 12px; position: relative; }
.subnav-item svg { width: 14px; height: 14px; }
.subnav-dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; position: absolute; left: -15px; overflow: visible !important; }
.subnav-item.active { color: #c6a0ff; background: linear-gradient(90deg, rgba(135, 72, 255, .12), transparent); }
.subnav-item.active svg { color: #aa69ff; }
.subnav-item.active .subnav-dot { background: #b26aff; box-shadow: 0 0 10px rgba(178, 106, 255, .8); }

.sidebar-user {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 67px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(9,7,16,.98);
  border-top: 1px solid rgba(154,126,196,.12);
}
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 10px; flex: none; border: 1px solid rgba(255,255,255,.12); }
.avatar-nate { background: radial-gradient(circle at 35% 25%, #f3a0ff, #7c2bbf 45%, #20122e 75%); box-shadow: 0 0 18px rgba(168, 85, 247, .22); }
.sidebar-user-copy { display: flex; flex-direction: column; min-width: 0; }
.sidebar-user-copy strong { font-size: 12px; font-weight: 600; }
.sidebar-user-copy span { font-size: 10px; color: var(--muted-2); margin-top: 2px; }
.sidebar-user .icon-btn { margin-left: auto; }
.user-menu { position: absolute; bottom: 58px; left: 12px; width: 200px; padding: 7px; border: 1px solid var(--line); background: #151022; border-radius: 12px; box-shadow: var(--shadow); display: none; }
.user-menu.open { display: block; animation: fadeUp .15s ease; }
.user-menu button { width: 100%; border: 0; background: transparent; color: var(--text-2); padding: 9px; display: flex; align-items: center; gap: 9px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 12px; }
.user-menu button:hover { background: rgba(255,255,255,.05); color: var(--text); }
.user-menu svg { width: 15px; height: 15px; }

.main-area { min-width: 0; height: 100vh; display: flex; flex-direction: column; position: relative; }
.topbar {
  height: var(--topbar-height);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 18px;
  border-bottom: 1px solid rgba(154,126,196,.11);
  background: rgba(10, 7, 18, .64);
  backdrop-filter: blur(18px);
  position: sticky;
  top: 0;
  z-index: 15;
}
.global-search-wrap { width: min(660px, 55vw); position: relative; }
.global-search-wrap input {
  width: 100%;
  height: 42px;
  padding: 0 62px 0 42px;
  border-radius: 11px;
  border: 1px solid rgba(154,126,196,.17);
  color: var(--text);
  background: rgba(23,18,39,.78);
  outline: none;
  transition: border .15s ease, box-shadow .15s ease, background .15s ease;
}
.global-search-wrap input::placeholder { color: #776f86; }
.global-search-wrap input:focus { border-color: rgba(168,85,247,.55); box-shadow: 0 0 0 3px rgba(168,85,247,.10); background: rgba(28,22,47,.92); }
.search-leading { position: absolute; left: 14px; top: 12px; color: #7e748f; width: 17px; height: 17px; z-index: 2; }
kbd { position: absolute; right: 10px; top: 10px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); color: #7f768f; font-size: 10px; border-radius: 6px; padding: 4px 6px; font-family: var(--font); }
.search-results { position: absolute; top: 48px; left: 0; width: 100%; max-height: 460px; overflow-y: auto; background: rgba(18,14,31,.98); border: 1px solid rgba(168,85,247,.26); border-radius: 14px; padding: 7px; box-shadow: 0 28px 70px rgba(0,0,0,.48); display: none; z-index: 30; backdrop-filter: blur(20px); }
.search-results.open { display: block; animation: fadeUp .14s ease; }
.search-empty { padding: 22px 16px; text-align: center; color: var(--muted); }
.search-group-title { color: #776f86; font-size: 9px; letter-spacing: .14em; font-weight: 800; padding: 10px 10px 6px; }
.search-result { width: 100%; border: 0; background: transparent; color: var(--text-2); padding: 10px; border-radius: 10px; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; cursor: pointer; text-align: left; }
.search-result:hover { background: rgba(168,85,247,.08); color: var(--text); }
.search-result-icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: rgba(168,85,247,.1); color: #b47cff; }
.search-result-icon svg { width: 16px; height: 16px; }
.search-result-copy { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.search-result-copy strong { font-size: 12px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.search-result-copy span { color: var(--muted); font-size: 10px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.search-result-type { color: #776f86; font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }

.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.environment-pill { color: #9f96af; border: 1px solid rgba(154,126,196,.14); background: rgba(255,255,255,.025); border-radius: 999px; padding: 8px 10px; font-size: 10px; display: flex; align-items: center; gap: 7px; }
.environment-pill span { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 9px rgba(32,214,123,.5); }
.mobile-menu { display: none; }

.icon-btn { width: 36px; height: 36px; border: 0; border-radius: 9px; background: transparent; color: #80778f; display: grid; place-items: center; cursor: pointer; transition: background .15s ease, color .15s ease; }
.icon-btn:hover { background: rgba(255,255,255,.05); color: #ddd6e8; }
.icon-btn svg { width: 17px; height: 17px; }
.btn { height: 38px; padding: 0 14px; border-radius: 9px; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 650; font-size: 12px; cursor: pointer; transition: transform .14s ease, box-shadow .14s ease, background .14s ease, border .14s ease; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: linear-gradient(135deg, #883df4, #c33be8); border-color: rgba(222,151,255,.22); color: white; box-shadow: 0 10px 26px rgba(147,51,234,.24); }
.btn-primary:hover { box-shadow: 0 12px 34px rgba(168,85,247,.36); filter: brightness(1.06); }
.btn-secondary { background: rgba(255,255,255,.035); border-color: rgba(154,126,196,.18); color: #d7d0e2; }
.btn-secondary:hover { border-color: rgba(168,85,247,.35); background: rgba(168,85,247,.07); }
.btn-ghost { background: transparent; border-color: transparent; color: #a69ead; }
.btn-ghost:hover { background: rgba(255,255,255,.04); color: var(--text); }
.btn-danger { background: rgba(255,77,94,.1); border-color: rgba(255,77,94,.24); color: #ff8792; }
.btn-success { background: rgba(32,214,123,.1); border-color: rgba(32,214,123,.22); color: #62e7a1; }
.btn-sm { height: 32px; padding: 0 10px; font-size: 11px; border-radius: 8px; }
.btn-xs { height: 27px; padding: 0 8px; font-size: 10px; border-radius: 7px; }

.app-view { flex: 1; overflow: auto; padding: 25px 28px 42px; scrollbar-color: rgba(168,85,247,.25) transparent; }
.app-view::-webkit-scrollbar { width: 10px; height: 10px; }
.app-view::-webkit-scrollbar-thumb { background: rgba(168,85,247,.18); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }

.page { max-width: 1540px; margin: 0 auto; animation: pageIn .18s ease; }
.page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.page-heading-copy { min-width: 0; }
.eyebrow { color: #aa6cff; font-size: 10px; letter-spacing: .15em; font-weight: 800; text-transform: uppercase; margin-bottom: 7px; }
h1, h2, h3, h4, p { margin-top: 0; }
h1 { font-size: 30px; line-height: 1.12; letter-spacing: -.025em; margin-bottom: 8px; }
h2 { font-size: 19px; line-height: 1.25; letter-spacing: -.014em; }
h3 { font-size: 15px; line-height: 1.35; }
.page-subtitle { color: var(--muted); margin: 0; line-height: 1.55; }
.heading-actions { display: flex; align-items: center; gap: 9px; }

.glass-card {
  background: linear-gradient(145deg, rgba(30,24,49,.83), rgba(18,14,31,.76));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 15px 45px rgba(0,0,0,.16);
  backdrop-filter: blur(15px);
}
.card-header { padding: 17px 18px 13px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.card-header h2, .card-header h3 { margin: 0; }
.card-body { padding: 0 18px 18px; }
.section-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-title-row h2 { margin: 0; }
.section-title-row p { color: var(--muted); margin: 5px 0 0; }

.metric-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.metric-card { min-height: 116px; padding: 16px; position: relative; overflow: hidden; }
.metric-card::after { content: ""; position: absolute; width: 110px; height: 110px; border-radius: 50%; right: -48px; top: -46px; background: radial-gradient(circle, var(--metric-glow, rgba(168,85,247,.18)), transparent 70%); }
.metric-label { display: flex; align-items: center; justify-content: space-between; color: #978fa5; font-size: 11px; }
.metric-label svg { width: 16px; height: 16px; color: var(--metric-color, #a855f7); }
.metric-value { font-size: 28px; font-weight: 750; margin-top: 13px; letter-spacing: -.02em; color: var(--metric-color, var(--text)); }
.metric-foot { color: #7f778d; font-size: 10px; margin-top: 7px; display: flex; align-items: center; gap: 5px; }
.metric-foot .up { color: #54dc96; }
.metric-foot .down { color: #ff7d89; }

.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(310px, .72fr); gap: 16px; align-items: start; }
.dashboard-main, .dashboard-side { display: grid; gap: 16px; }

.toolbar { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
.input, .select, textarea {
  border: 1px solid rgba(154,126,196,.18);
  background: rgba(12,9,21,.65);
  color: var(--text);
  border-radius: 9px;
  outline: none;
}
.input, .select { height: 36px; padding: 0 11px; }
.input:focus, .select:focus, textarea:focus { border-color: rgba(168,85,247,.55); box-shadow: 0 0 0 3px rgba(168,85,247,.09); }
.select { min-width: 145px; appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, #8f879f 50%), linear-gradient(135deg, #8f879f 50%, transparent 50%); background-position: calc(100% - 14px) 15px, calc(100% - 10px) 15px; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
textarea { width: 100%; min-height: 110px; padding: 11px 12px; resize: vertical; line-height: 1.5; }

.batch-table { width: 100%; border-collapse: collapse; }
.batch-table th { text-align: left; color: #746d80; font-size: 9px; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; padding: 10px 14px; border-bottom: 1px solid rgba(154,126,196,.12); }
.batch-table td { padding: 13px 14px; border-bottom: 1px solid rgba(154,126,196,.08); color: #bdb5c8; vertical-align: middle; }
.batch-table tr:last-child td { border-bottom: 0; }
.batch-table tbody tr { cursor: pointer; transition: background .14s ease; }
.batch-table tbody tr:hover { background: rgba(168,85,247,.045); }
.batch-name-cell { display: flex; align-items: center; gap: 11px; min-width: 230px; }
.client-logo { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 10px; font-weight: 800; letter-spacing: .04em; color: white; flex: none; border: 1px solid rgba(255,255,255,.12); }
.client-logo.nbd { background: linear-gradient(145deg, #181818, #3a2d00); color: #ffc72c; }
.client-logo.bk { background: linear-gradient(145deg, #152748, #366dba); }
.client-logo.dp { background: linear-gradient(145deg, #0d2431, #177c83); }
.client-logo.cp { background: linear-gradient(145deg, #4b1635, #b53878); }
.batch-copy { min-width: 0; }
.batch-copy strong { display: block; color: #e9e5f0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.batch-copy span { display: block; color: #756e82; font-size: 10px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage-cell { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.stage-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--stage-color, #a855f7); box-shadow: 0 0 9px color-mix(in srgb, var(--stage-color, #a855f7) 55%, transparent); }
.mini-progress { width: 74px; height: 5px; border-radius: 99px; background: rgba(255,255,255,.06); overflow: hidden; }
.mini-progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #7c3aed, #d946ef); }
.owner-stack { display: flex; align-items: center; }
.owner-dot { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; font-size: 8px; font-weight: 750; color: #f8f4ff; border: 2px solid #171121; margin-left: -6px; background: linear-gradient(145deg, #54436f, #252036); }
.owner-dot:first-child { margin-left: 0; }
.owner-dot.tyler { background: linear-gradient(145deg, #8068cc, #3c2e71); }
.owner-dot.austin { background: linear-gradient(145deg, #436f8d, #1d3b50); }
.owner-dot.brad { background: linear-gradient(145deg, #8c5a4a, #4b2e29); }
.owner-dot.adrian { background: linear-gradient(145deg, #766234, #3a2e14); }
.owner-dot.ilias { background: linear-gradient(145deg, #27766f, #153c3a); }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 999px; border: 1px solid transparent; font-size: 9px; font-weight: 750; letter-spacing: .03em; white-space: nowrap; }
.badge svg { width: 12px; height: 12px; }
.badge-purple { color: #c89aff; background: rgba(168,85,247,.09); border-color: rgba(168,85,247,.18); }
.badge-blue { color: #78a8ff; background: rgba(79,140,255,.09); border-color: rgba(79,140,255,.17); }
.badge-green { color: #6ee7a8; background: rgba(32,214,123,.09); border-color: rgba(32,214,123,.18); }
.badge-amber { color: #ffc35c; background: rgba(255,176,32,.09); border-color: rgba(255,176,32,.2); }
.badge-red { color: #ff8a95; background: rgba(255,77,94,.09); border-color: rgba(255,77,94,.2); }
.badge-muted { color: #9a92a6; background: rgba(255,255,255,.035); border-color: rgba(255,255,255,.07); }
.badge-cyan { color: #67e7e2; background: rgba(61,219,217,.08); border-color: rgba(61,219,217,.18); }

.attention-list, .activity-list { display: grid; gap: 8px; }
.attention-item { border: 1px solid rgba(154,126,196,.12); background: rgba(255,255,255,.018); border-radius: 10px; padding: 11px; display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; cursor: pointer; }
.attention-item:hover { border-color: rgba(168,85,247,.28); background: rgba(168,85,247,.035); }
.attention-icon { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; }
.attention-icon svg { width: 15px; height: 15px; }
.attention-icon.red { background: rgba(255,77,94,.09); color: #ff7c88; }
.attention-icon.amber { background: rgba(255,176,32,.09); color: #ffc04d; }
.attention-icon.purple { background: rgba(168,85,247,.09); color: #c385ff; }
.attention-copy strong { display: block; font-size: 11px; color: #ddd7e7; }
.attention-copy span { display: block; color: #776f83; font-size: 9px; margin-top: 4px; line-height: 1.4; }
.attention-count { color: #aaa2b4; font-size: 11px; }

.capacity-card { padding: 16px; }
.capacity-top { display: flex; align-items: center; justify-content: space-between; }
.capacity-top strong { font-size: 12px; }
.capacity-top span { color: #8f879d; font-size: 10px; }
.capacity-ring-wrap { display: flex; align-items: center; gap: 16px; margin-top: 15px; }
.capacity-ring { --p: 63; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#a855f7 calc(var(--p) * 1%), rgba(255,255,255,.06) 0); position: relative; }
.capacity-ring::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: #161122; }
.capacity-ring span { position: relative; font-weight: 800; font-size: 14px; }
.capacity-copy { flex: 1; }
.capacity-copy strong { display: block; font-size: 24px; letter-spacing: -.03em; }
.capacity-copy span { color: var(--muted); font-size: 10px; line-height: 1.45; }
.capacity-bars { display: grid; gap: 9px; margin-top: 15px; }
.capacity-bar-row { display: grid; grid-template-columns: 70px 1fr 34px; gap: 8px; align-items: center; font-size: 9px; color: #8c8499; }
.capacity-bar { height: 5px; border-radius: 99px; background: rgba(255,255,255,.06); overflow: hidden; }
.capacity-bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #6d3ed3, #b43ed6); }

.creative-preview { position: relative; overflow: hidden; background: #151515; display: flex; align-items: stretch; justify-content: stretch; }

.preview-dp { background: linear-gradient(145deg, #07151b, #0d2427 55%, #0b3b3c); color: white; }
.preview-dp::before { content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(53,231,204,.08)); }
.preview-dp .chart-lines { position:absolute; inset:15% 5% 15% 35%; opacity:.5; background: linear-gradient(transparent 75%, rgba(54,220,191,.2) 75%); }
.preview-dp .chart-lines svg { width:100%;height:100%;stroke:#37d5bd;stroke-width:2;fill:none; }
.preview-dp .ad-title { max-width: 58%; }
.preview-cp { background: linear-gradient(140deg,#3b1031,#9f285e 55%,#ff9fbf); }

.preview-generic { background: linear-gradient(145deg,#261a45,#6e2f8b); }

.activity-item { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid rgba(154,126,196,.08); }

.activity-copy strong { color: #d9d3e3; font-size: 10px; display: block; }
.activity-copy span { color: #776f83; font-size: 9px; line-height: 1.4; margin-top: 3px; display: block; }
.activity-time { color: #6e6679; font-size: 9px; white-space: nowrap; }

/* Brief list */
.brief-card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.brief-card { padding: 16px; cursor: pointer; position: relative; overflow: hidden; min-height: 190px; transition: transform .14s ease, border .14s ease, box-shadow .14s ease; }

.brief-card .brief-meta { color: #766e82; font-size: 10px; }

.brief-card-stage-label { display: flex; justify-content: space-between; color: #948ba0; font-size: 9px; margin-bottom: 6px; }
.stage-track { height: 6px; border-radius: 99px; background: rgba(255,255,255,.055); overflow: hidden; }
.stage-track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#6f3ce6,#cf48df); }

.brief-card-bottom .stats strong { color: #d2cadc; font-size: 11px; display: block; }

/* Workspace detail */
.detail-page { max-width: 1640px; }
.breadcrumbs { display: flex; align-items: center; gap: 8px; color: #706878; font-size: 10px; margin-bottom: 15px; }

.breadcrumbs button:hover { color:#c6a0ff; }
.breadcrumbs svg { width: 12px; height: 12px; }
.batch-hero { padding: 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
.batch-hero-left { display: flex; gap: 14px; min-width: 0; }
.batch-hero-logo { width: 48px; height: 48px; border-radius: 13px; font-size: 12px; }
.batch-hero-copy { min-width: 0; }
.batch-hero-copy h1 { font-size: 23px; margin: 0 0 7px; }
.batch-hero-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; color: #8a8295; font-size: 10px; }

.batch-hero-actions { display: flex; gap: 8px; }

.stage-rail { padding: 13px 16px; margin-bottom: 14px; overflow-x: auto; }
.stage-rail-inner { display: flex; min-width: 980px; align-items: center; }
.stage-step { flex: 1; position: relative; display: flex; align-items: center; gap: 8px; color: #777080; font-size: 10px; }
.stage-step:not(:last-child)::after { content: ""; flex: 1; height: 1px; background: rgba(154,126,196,.16); margin: 0 8px; }

.stage-number { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(154,126,196,.18); background: rgba(255,255,255,.025); font-size: 9px; flex: none; }
.stage-step.done { color: #aaa0b7; }
.stage-step.done .stage-number { background: rgba(168,85,247,.10); border-color: rgba(168,85,247,.34); color: #c38cff; }
.stage-step.active { color: #e7dff2; font-weight: 650; }
.stage-step.active .stage-number { color: white; border-color: #a855f7; background: linear-gradient(145deg,#7c3aed,#c23ee0); box-shadow: 0 0 18px rgba(168,85,247,.3); }

.detail-tabs { display: flex; gap: 3px; padding: 5px; background: rgba(18,14,30,.67); border: 1px solid var(--line); border-radius: 11px; width: fit-content; margin-bottom: 14px; position: sticky; top: 4px; z-index: 6; backdrop-filter: blur(15px); }
.detail-tab { border: 0; background: transparent; color: #8e859a; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 10px; display: flex; align-items: center; gap: 7px; }
.detail-tab svg { width: 14px; height: 14px; }
.detail-tab:hover { color: #d4cce0; }
.detail-tab.active { color: white; background: linear-gradient(135deg,rgba(124,58,237,.75),rgba(192,62,221,.58)); box-shadow: 0 8px 18px rgba(97,45,175,.18); }

.workspace-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
.workspace-main { display: grid; gap: 14px; }
.workspace-side { display: grid; gap: 14px; position: sticky; top: 54px; }
.brief-overview { padding: 17px; }
.brief-overview-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.brief-overview-top h2 { margin: 0; font-size: 15px; }
.brief-summary-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; }
.brief-copy-block { background: rgba(255,255,255,.018); border: 1px solid rgba(154,126,196,.1); border-radius: 10px; padding: 12px; }
.brief-copy-block label { color: #756d81; font-size: 9px; text-transform: uppercase; letter-spacing: .09em; display: block; margin-bottom: 7px; font-weight: 800; }
.brief-copy-block p { color: #c6becf; font-size: 11px; line-height: 1.58; margin: 0; }
.directive-list { display: grid; gap: 7px; }
.directive-item { display: flex; align-items: flex-start; gap: 8px; color: #aaa2b5; font-size: 10px; line-height: 1.45; }
.directive-item svg { width: 13px; height: 13px; color: #aa6cff; margin-top: 1px; flex: none; }
.link-row { margin-top: 10px; display: flex; gap: 7px; flex-wrap: wrap; }

.concepts-wrap { display: grid; gap: 12px; }
.concept-card { overflow: hidden; }
.concept-header { padding: 15px 16px; display: flex; align-items: center; gap: 11px; cursor: pointer; background: linear-gradient(90deg, rgba(168,85,247,.035), transparent); }
.concept-header:hover { background: linear-gradient(90deg, rgba(168,85,247,.06), transparent); }
.concept-index { width: 29px; height: 29px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 10px; background: rgba(168,85,247,.09); color: #c38dff; border: 1px solid rgba(168,85,247,.16); }
.concept-title { min-width: 0; flex: 1; }
.concept-title h3 { margin: 0; font-size: 13px; }
.concept-title .concept-meta { color: #766e82; font-size: 9px; margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.concept-header-actions { display: flex; align-items: center; gap: 8px; }
.concept-toggle { transition: transform .16s ease; }
.concept-card.collapsed .concept-toggle { transform: rotate(-90deg); }
.concept-card.collapsed .concept-content { display: none; }
.concept-content { padding: 0 16px 16px; }
.concept-brief-grid { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding-top: 13px; border-top: 1px solid rgba(154,126,196,.1); }
.reference-card { aspect-ratio: 1.2; border-radius: 10px; overflow: hidden; border: 1px solid rgba(154,126,196,.12); }
.concept-direction { display: grid; gap: 9px; }
.concept-direction-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; font-size: 10px; align-items: start; }
.concept-direction-row label { color: #756d81; }
.concept-direction-row div { color: #bab1c5; line-height: 1.5; }
.asset-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-top: 14px; }
.asset-card { border: 1px solid rgba(154,126,196,.12); border-radius: 11px; background: rgba(255,255,255,.015); overflow: hidden; min-width: 0; }
.asset-card.attention { border-color: rgba(255,176,32,.32); box-shadow: inset 0 0 0 1px rgba(255,176,32,.05); }
.asset-preview { aspect-ratio: 1.38; cursor: pointer; }
.asset-card-copy { padding: 10px; }
.asset-card-topline { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.asset-card-topline strong { font-family: var(--mono); font-size: 10px; color: #e1d9e9; }
.asset-name { color: #6f677a; font-family: var(--mono); font-size: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 7px; }
.asset-card-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; }
.asset-card-actions span { color: #7e7688; font-size: 9px; }
.asset-more { border:0;background:transparent;color:#766f82;cursor:pointer;padding:2px; }
.add-asset-card { border: 1px dashed rgba(154,126,196,.22); border-radius: 11px; min-height: 190px; display: grid; place-items: center; cursor: pointer; color: #837a90; background: rgba(255,255,255,.008); }
.add-asset-card:hover { border-color: rgba(168,85,247,.42); color: #bd8cff; background: rgba(168,85,247,.025); }
.add-asset-card div { text-align: center; font-size: 10px; }
.add-asset-card svg { width: 22px; height: 22px; display: block; margin: 0 auto 8px; }

.side-card { padding: 15px; }
.side-card h3 { font-size: 12px; margin: 0 0 12px; }
.status-list { display: grid; gap: 10px; }
.status-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 10px; }
.status-row span:first-child { color: #80778d; }
.status-row span:last-child { color: #d0c8da; text-align: right; }
.person-chip { display: inline-flex; align-items: center; gap: 6px; }
.person-chip .owner-dot { width: 23px; height: 23px; margin: 0; }
.side-action-stack { display: grid; gap: 8px; }
.side-action-stack .btn { width: 100%; }
.handoff-health { border: 1px solid rgba(32,214,123,.15); background: rgba(32,214,123,.04); border-radius: 10px; padding: 10px; }
.handoff-health-top { display: flex; align-items: center; gap: 8px; color: #78e8ad; font-size: 10px; font-weight: 650; }
.handoff-health-top svg { width: 14px; height: 14px; }
.handoff-health p { color: #7d8e84; font-size: 9px; margin: 7px 0 0; line-height: 1.4; }

/* Copy screen */
.copy-screen { display: grid; gap: 14px; }
.copy-banner { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.copy-banner-left { display: flex; align-items: center; gap: 12px; }
.copy-banner-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: rgba(168,85,247,.09); color: #be82ff; }
.copy-banner-icon svg { width: 18px; height: 18px; }
.copy-banner h2 { margin: 0 0 4px; font-size: 13px; }
.copy-banner p { margin: 0; color: #81798d; font-size: 10px; }
.copy-concept { overflow: hidden; }
.copy-concept-head { padding: 15px 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(168,85,247,.025); border-bottom: 1px solid rgba(154,126,196,.1); }
.copy-concept-head h3 { margin:0;font-size:13px; }
.copy-concept-head p { margin:4px 0 0;color:#776f82;font-size:9px; }
.copy-context-strip { padding: 10px 16px; background: rgba(255,255,255,.015); border-bottom: 1px solid rgba(154,126,196,.08); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; color: #8c8397; font-size: 9px; }
.copy-context-strip span { display: inline-flex; gap: 5px; align-items: center; }
.copy-context-strip strong { color: #bab1c5; font-weight: 600; }
.copy-form { padding: 16px; }
.copy-fields-grid { display: grid; grid-template-columns: 1.35fr .65fr; gap: 12px; }
.form-group { display: grid; gap: 6px; }
.form-group label { color: #847b90; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.form-group .required { color: #c77fff; }
.form-group small { color: #6f677a; font-size: 8px; }
.copy-side-fields { display: grid; gap: 10px; }
.copy-form textarea { min-height: 178px; }
.copy-form .copy-side-fields textarea { min-height: 74px; }
.asset-copy-list { margin-top: 14px; display: grid; gap: 8px; }
.asset-copy-row { border: 1px solid rgba(154,126,196,.11); border-radius: 10px; display: grid; grid-template-columns: 74px 1fr 120px; gap: 11px; align-items: center; padding: 9px; background: rgba(255,255,255,.012); }
.asset-copy-thumb { aspect-ratio: 1.2; border-radius: 8px; overflow: hidden; }
.asset-copy-fields { display: grid; gap: 6px; }
.asset-copy-fields input { width: 100%; height: 34px; border: 1px solid rgba(154,126,196,.16); background: rgba(8,6,14,.45); color: var(--text); border-radius: 8px; padding: 0 9px; outline: none; }
.asset-copy-fields input:focus { border-color: rgba(168,85,247,.5); }
.asset-copy-meta { color: #766e80; font-size: 9px; text-align: right; }
.copy-footer-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.copy-gate { display: inline-flex; align-items: center; gap: 7px; color: #8f879b; font-size: 9px; margin-right: auto; }
.copy-gate svg { width: 13px; height: 13px; }

/* Media buyer handoff */
.launch-layout { display: grid; grid-template-columns: minmax(0,1fr) 290px; gap: 14px; align-items: start; }
.launch-main { overflow: hidden; }
.launch-toolbar { padding: 13px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(154,126,196,.1); gap: 10px; }
.launch-toolbar-left, .launch-toolbar-right { display: flex; align-items: center; gap: 8px; }
.launch-table-wrap { overflow: auto; }
.launch-table { width: 100%; min-width: 960px; border-collapse: collapse; }
.launch-table th { text-align:left;padding:10px 11px;color:#716a7c;font-size:8px;text-transform:uppercase;letter-spacing:.09em;border-bottom:1px solid rgba(154,126,196,.1); }
.launch-table td { padding: 10px 11px; border-bottom: 1px solid rgba(154,126,196,.07); color:#aaa1b5;font-size:9px;vertical-align:middle; }
.launch-table tr:last-child td { border-bottom:0; }
.launch-table tr:hover { background: rgba(168,85,247,.027); }
.checkbox { width:16px;height:16px;border-radius:5px;border:1px solid rgba(154,126,196,.3);background:rgba(255,255,255,.02);display:grid;place-items:center;cursor:pointer;color:white; }
.checkbox.checked { background:linear-gradient(145deg,#7c3aed,#c13ddf);border-color:#a855f7; }
.checkbox svg { width:11px;height:11px;display:none; }
.checkbox.checked svg { display:block; }
.manifest-asset { display:flex;align-items:center;gap:8px;min-width:160px; }
.manifest-thumb { width:42px;height:32px;border-radius:6px;overflow:hidden;flex:none; }
.manifest-id strong { display:block;color:#e1dae9;font-family:var(--mono);font-size:9px; }
.manifest-id span { color:#716978;font-size:8px; }
.ad-name-cell { max-width:300px; }
.ad-name-wrap { display:flex;align-items:center;gap:6px; }
.ad-name-wrap code { font-family:var(--mono);color:#b8afc3;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.copy-inline { width:24px;height:24px;border:0;border-radius:6px;background:rgba(255,255,255,.03);color:#756d80;display:grid;place-items:center;cursor:pointer;flex:none; }
.copy-inline:hover { color:#c8a0ff;background:rgba(168,85,247,.08); }
.copy-inline svg { width:12px;height:12px; }
.launch-status-select { height:28px;border-radius:7px;border:1px solid rgba(154,126,196,.15);background:#151020;color:#ada4b7;font-size:9px;padding:0 7px;outline:none; }
.launch-side { display:grid;gap:14px;position:sticky;top:54px; }
.launch-summary { padding:15px; }
.launch-summary h3 { margin:0 0 12px;font-size:12px; }
.launch-summary-metrics { display:grid;grid-template-columns:1fr 1fr;gap:8px; }
.launch-summary-metric { border:1px solid rgba(154,126,196,.1);border-radius:9px;padding:10px;background:rgba(255,255,255,.012); }
.launch-summary-metric span { color:#746c7f;font-size:8px;text-transform:uppercase;letter-spacing:.08em;display:block; }
.launch-summary-metric strong { font-size:19px;display:block;margin-top:6px; }
.hard-rule { margin-top:11px;border:1px solid rgba(255,176,32,.18);background:rgba(255,176,32,.045);border-radius:9px;padding:9px;color:#b99a66;font-size:9px;line-height:1.45;display:flex;gap:7px; }
.hard-rule svg { width:14px;height:14px;flex:none;color:#ffb020; }

/* Performance */
.performance-overview { display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px; }
.performance-card { padding:14px; }
.performance-card span { color:#766e81;font-size:9px;text-transform:uppercase;letter-spacing:.08em; }
.performance-card strong { display:block;font-size:24px;margin-top:8px;letter-spacing:-.02em; }
.performance-card small { display:block;color:#766f80;font-size:9px;margin-top:5px; }
.performance-table-card { overflow:hidden; }
.performance-toolbar { padding:13px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(154,126,196,.1); }
.performance-table { width:100%;border-collapse:collapse;min-width:900px; }
.performance-table th { padding:10px 12px;text-align:left;color:#726a7c;font-size:8px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(154,126,196,.09); }
.performance-table td { padding:11px 12px;color:#aca3b8;font-size:9px;border-bottom:1px solid rgba(154,126,196,.07); }
.performance-table tr:last-child td { border-bottom:0; }
.metric-cell strong { color:#e2dbe9;font-size:11px; }
.roas-bar { width:100px;height:5px;background:rgba(255,255,255,.055);border-radius:99px;overflow:hidden; }
.roas-bar span { height:100%;display:block;border-radius:inherit;background:linear-gradient(90deg,#4e73ff,#36d39d); }
.verdict-log { margin-top:14px; }
.verdict-log-item { display:grid;grid-template-columns:110px 100px 1fr 100px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(154,126,196,.07);font-size:9px;color:#827a8c; }
.verdict-log-item:last-child { border-bottom:0; }

/* Lineage */
.lineage-layout { display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start; }
.lineage-canvas { min-height:590px;padding:20px;position:relative;overflow:hidden; }

/* Modals / drawer */

.drawer-backdrop { position:fixed;inset:0;background:rgba(4,3,8,.55);z-index:90;animation:fadeIn .12s ease; }
.drawer { position:fixed;right:0;top:0;bottom:0;width:min(540px,94vw);background:linear-gradient(150deg,#191326,#0e0b18);border-left:1px solid rgba(168,85,247,.28);box-shadow:-26px 0 80px rgba(0,0,0,.45);z-index:95;overflow:auto;animation:drawerIn .2s ease; }
.drawer-head { padding:18px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid rgba(154,126,196,.12);position:sticky;top:0;background:rgba(21,16,34,.94);backdrop-filter:blur(14px);z-index:3; }

.drawer-kv { display:grid;grid-template-columns:120px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid rgba(154,126,196,.07);font-size:9px; }
.drawer-kv:last-child { border-bottom:0; }
.drawer-kv span:first-child { color:#776f82; }
.drawer-kv span:last-child { color:#c2bacb;word-break:break-word; }
.copy-preview-block { white-space:pre-wrap;color:#b8afc3;font-size:9px;line-height:1.55;background:rgba(4,3,8,.35);border:1px solid rgba(154,126,196,.08);border-radius:9px;padding:10px; }

.toast-stack { position:fixed;right:18px;bottom:18px;z-index:200;display:grid;gap:8px;pointer-events:none; }
.toast { min-width:280px;max-width:390px;padding:11px 12px;border-radius:11px;background:rgba(22,17,36,.96);border:1px solid rgba(168,85,247,.26);box-shadow:0 18px 50px rgba(0,0,0,.38);display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:center;animation:toastIn .2s ease;pointer-events:auto; }
.toast-icon { width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(168,85,247,.09);color:#c084ff; }

.toast-icon.warning { background:rgba(255,176,32,.09);color:#ffc252; }
.toast-icon.error { background:rgba(255,77,94,.09);color:#ff8792; }
.toast-icon svg { width:14px;height:14px; }
.toast strong { display:block;font-size:10px; }
.toast span { display:block;color:#7e7689;font-size:9px;margin-top:3px;line-height:1.4; }

.empty-state { padding:60px 20px;text-align:center;color:#7c7488; }
.empty-state-icon { width:48px;height:48px;border-radius:14px;background:rgba(168,85,247,.07);color:#b878ff;display:grid;place-items:center;margin:0 auto 13px; }

.empty-state p { font-size:10px;line-height:1.5;max-width:420px;margin:0 auto 14px; }

.skeleton { position:relative;overflow:hidden;background:rgba(255,255,255,.03);border-radius:7px; }
.skeleton::after { content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.045),transparent);animation:shimmer 1.4s infinite; }

@keyframes pageIn { from { opacity:0;transform:translateY(4px); } to { opacity:1;transform:none; } }
@keyframes fadeUp { from { opacity:0;transform:translateY(-5px); } to { opacity:1;transform:none; } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes drawerIn { from { transform:translateX(24px);opacity:0; } to { transform:none;opacity:1; } }
@keyframes toastIn { from { opacity:0;transform:translateY(8px) scale(.98); } to { opacity:1;transform:none; } }
@keyframes shimmer { 100% { transform:translateX(100%); } }

/* Compact / responsive */
body.sidebar-collapsed { --sidebar-width: 74px; }

body.sidebar-collapsed .sidebar-user-copy,
body.sidebar-collapsed .nav-item span,
body.sidebar-collapsed .nav-label,
body.sidebar-collapsed .subnav,
body.sidebar-collapsed .nav-chevron { display:none; }

body.sidebar-collapsed .sidebar-collapse { display:none; }
body.sidebar-collapsed .nav-item { justify-content:center;padding:0; }

body.sidebar-collapsed .sidebar-user .icon-btn { display:none; }

@media (max-width: 1280px) {
  .metric-grid { grid-template-columns:repeat(3,1fr); }
  .winner-grid { grid-template-columns:repeat(3,1fr); }
  .brief-card-grid { grid-template-columns:repeat(2,1fr); }
  .asset-grid { grid-template-columns:repeat(2,1fr); }
  .performance-overview { grid-template-columns:repeat(2,1fr); }
}

@media (max-width: 1040px) {
  :root { --sidebar-width: 74px; }
  .brand-word,.sidebar-user-copy,.nav-item span,.nav-label,.subnav,.nav-chevron,.sidebar-collapse { display:none; }
  .brand-row { padding:0 20px; }
  .nav-item { justify-content:center;padding:0; }
  .sidebar-user { justify-content:center; }
  .sidebar-user .icon-btn { display:none; }
  .dashboard-grid,.workspace-grid,.launch-layout,.lineage-layout,.recon-layout { grid-template-columns:1fr; }
  .workspace-side,.launch-side,.lineage-inspector,.sync-log { position:static; }
  .connector-grid { grid-template-columns:repeat(2,1fr); }
  .winner-grid { grid-template-columns:repeat(2,1fr); }
}

@media (max-width: 760px) {
  body { overflow:auto; }
  .app-shell { display:block;height:auto;min-height:100vh; }
  .sidebar { position:fixed;left:0;top:0;bottom:0;width:228px;transform:translateX(-100%); }
  .sidebar.mobile-open { transform:none; }
  .brand-word,.sidebar-user-copy,.nav-item span,.nav-label,.subnav,.nav-chevron { display:block; }
  .nav-item { justify-content:flex-start;padding:0 9px; }
  .main-area { min-height:100vh;height:auto; }
  .topbar { padding:0 12px;gap:8px; }
  .mobile-menu { display:grid;flex:none; }
  .global-search-wrap { width:auto;flex:1; }
  .global-search-wrap input { padding-right:10px; }
  kbd,.environment-pill,.topbar-more,.topbar-actions .btn span { display:none; }
  .topbar-actions .btn { width:38px;padding:0; }
  .app-view { padding:18px 12px 32px;overflow:visible; }
  .page-heading { flex-direction:column; }
  .metric-grid { grid-template-columns:repeat(2,1fr); }
  .dashboard-grid { display:block; }
  .dashboard-side { margin-top:14px; }
  .batch-table th:nth-child(3),.batch-table td:nth-child(3),.batch-table th:nth-child(4),.batch-table td:nth-child(4),.batch-table th:nth-child(5),.batch-table td:nth-child(5) { display:none; }
  .winner-mini-grid,.brief-card-grid,.winner-grid,.asset-grid,.performance-overview,.connector-grid { grid-template-columns:1fr; }
  .brief-summary-grid,.concept-brief-grid,.copy-fields-grid { grid-template-columns:1fr; }
  .concept-brief-grid .reference-card { max-width:250px; }
  .asset-copy-row { grid-template-columns:62px 1fr; }
  .asset-copy-meta { grid-column:1/-1;text-align:left; }
  .form-grid { grid-template-columns:1fr; }
  .form-grid .full { grid-column:auto; }
  .batch-hero { flex-direction:column; }
  .batch-hero-actions { width:100%;overflow:auto; }
  .batch-hero-actions .btn { flex:none; }
  .detail-tabs { width:100%;overflow:auto;position:static; }
  .detail-tab { flex:none; }
  .stage-rail { display:none; }
}

.handoff-doc-card { padding:15px; }
.handoff-doc-card h3 { margin:0; font-size:12px; }
.handoff-doc-card > p { margin:6px 0 12px; color:#786f84; font-size:9px; line-height:1.5; }
.handoff-doc-actions { display:grid; gap:8px; }
.modal.modal-lg { width:min(980px,96vw); }
.handoff-document { display:grid; gap:14px; }
.handoff-document-header { border:1px solid rgba(168,85,247,.18); background:linear-gradient(135deg,rgba(124,58,237,.1),rgba(217,70,239,.035)); border-radius:12px; padding:14px; display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }

.handoff-concept { border:1px solid rgba(154,126,196,.12); border-radius:12px; overflow:hidden; }
.handoff-concept-head { padding:11px 12px; background:rgba(168,85,247,.025); border-bottom:1px solid rgba(154,126,196,.1); display:flex; justify-content:space-between; align-items:center; gap:12px; }

.handoff-copy-grid { display:grid; grid-template-columns:.65fr 1.35fr; gap:10px; padding:12px; }
.handoff-copy-block { border:1px solid rgba(154,126,196,.09); border-radius:9px; padding:10px; background:rgba(255,255,255,.012); }
.handoff-copy-block label { display:block; color:#746c7f; font-size:8px; text-transform:uppercase; letter-spacing:.09em; margin-bottom:6px; }
.handoff-copy-block p { margin:0; white-space:pre-wrap; color:#bcb3c7; font-size:9px; line-height:1.55; }
.handoff-assets { display:grid; gap:7px; padding:0 12px 12px; }
.handoff-asset-row { border:1px solid rgba(154,126,196,.09); border-radius:9px; padding:9px; display:grid; grid-template-columns:56px 1fr auto; gap:10px; align-items:center; }
.handoff-asset-thumb { width:56px; aspect-ratio:1; overflow:hidden; border-radius:7px; }
.handoff-asset-row code { display:block; color:#c0b7ca; font-family:var(--mono); font-size:8px; line-height:1.45; word-break:break-all; }
.handoff-asset-row span { display:block; margin-top:4px; color:#736b7f; font-size:8px; }

.lineage-layout-v2 { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; align-items:start; }
.lineage-main-v2 { overflow:hidden; }
.lineage-selector-v2 { padding:12px; display:flex; gap:8px; overflow-x:auto; border-bottom:1px solid rgba(154,126,196,.1); }
.lineage-concept-chip { border:1px solid rgba(154,126,196,.12); background:rgba(255,255,255,.012); color:#9e96aa; border-radius:999px; padding:8px 11px; cursor:pointer; white-space:nowrap; font-size:9px; }
.lineage-concept-chip.active { border-color:rgba(168,85,247,.52); color:#d2b1ff; background:rgba(168,85,247,.09); }
.lineage-canvas-v2 { min-height:540px; padding:30px 24px; position:relative; overflow:auto; }
.lineage-canvas-v2::before { content:""; position:absolute; inset:0; background-image:linear-gradient(rgba(154,126,196,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(154,126,196,.055) 1px,transparent 1px); background-size:28px 28px; opacity:.55; }
.lineage-tree-v2 { position:relative; z-index:1; min-width:690px; display:flex; flex-direction:column; align-items:center; }
.lineage-source-v2 { margin-bottom:26px; border:1px dashed rgba(32,214,123,.35); background:rgba(32,214,123,.045); border-radius:10px; padding:9px 12px; color:#95d7b4; font-size:9px; cursor:pointer; }
.lineage-root-v2 { width:310px; border:1px solid rgba(168,85,247,.58); background:linear-gradient(145deg,rgba(41,27,66,.98),rgba(20,15,34,.98)); border-radius:14px; padding:15px; box-shadow:0 20px 55px rgba(82,36,137,.24); position:relative; text-align:center; }
.lineage-root-v2::after { content:""; position:absolute; width:1px; height:48px; left:50%; bottom:-48px; background:rgba(168,85,247,.42); }
.lineage-root-label { color:#b273ff; font-size:8px; text-transform:uppercase; letter-spacing:.12em; font-weight:800; }
.lineage-root-v2 code { display:block; margin-top:8px; font-family:var(--mono); font-size:14px; color:#f1e9fb; }
.lineage-root-v2 h3 { margin:7px 0 3px; font-size:13px; }
.lineage-root-v2 p { margin:0; color:#7d7489; font-size:9px; }
.lineage-children-v2 { margin-top:48px; display:flex; justify-content:center; gap:18px; position:relative; padding-top:30px; }
.lineage-children-v2::before { content:""; position:absolute; left:50%; top:0; transform:translateX(-50%); width:calc(100% - 180px); height:1px; background:rgba(168,85,247,.34); }
.lineage-child-v2 { width:190px; border:1px solid rgba(154,126,196,.16); background:rgba(19,15,32,.97); border-radius:11px; padding:11px; cursor:pointer; position:relative; text-align:left; }
.lineage-child-v2::before { content:""; position:absolute; left:50%; top:-30px; width:1px; height:30px; background:rgba(168,85,247,.34); }
.lineage-child-v2:hover, .lineage-child-v2.active { border-color:rgba(168,85,247,.53); }
.lineage-child-v2 .creative-preview { border-radius:8px; aspect-ratio:1.38; margin-bottom:9px; }
.lineage-child-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.lineage-child-top code { font-family:var(--mono); font-size:8px; color:#d3c9dc; }
.lineage-child-v2 h4 { margin:8px 0 4px; font-size:10px; }
.lineage-child-v2 p { margin:0; color:#756d80; font-size:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lineage-child-metrics { display:flex; gap:9px; margin-top:9px; color:#81788e; font-size:8px; }
.lineage-child-metrics strong { color:#c8bfd2; }

@media (max-width: 1280px) {
  .metric-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width: 1120px) {
  .copy-workspace-v2, .lineage-layout-v2 { grid-template-columns:1fr; }
  .copy-concept-nav, .lineage-inspector { position:static; }
  .copy-concept-list-v2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
/* Final QA: keep copy handoff controls in normal document flow so they never cover fields. */
.v4-copy-final-bar {
  position: static !important;
  bottom: auto !important;
  margin-top: 14px;
}

@media (max-width: 820px) {
  .copy-editor-grid-v2, .handoff-copy-grid, .variation-inspector-grid { grid-template-columns:1fr; }
  .variation-grid-v2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .variation-inspector-preview { min-height:0; aspect-ratio:1.45; }
  .launch-activity-summary { grid-template-columns:1fr; }
}
@media (max-width: 560px) {
  .metric-grid { grid-template-columns:1fr; }
  .copy-concept-list-v2, .variation-grid-v2 { grid-template-columns:1fr; }
  .handoff-asset-row { grid-template-columns:48px 1fr; }
  .handoff-asset-row > .badge { grid-column:1/-1; justify-self:start; }
}

/* ========================================================================== */
/* V4.1 QA hardening — readability, containment, and responsive layout        */

/* Force high-contrast typography inside every dark Omnia surface. */
.glass-card h1,
.glass-card h2,
.glass-card h3,
.glass-card h4,

  min-width: 0;

.v3-dashboard-stack,
.v4-role-grid,

    try {

      if (!raw) return demoData();
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.version !== 4) return demoData();
      return parsed;
    } catch (error) {
      console.warn('Could not load prototype state:', error);
      return demoData();
    }
  }

    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (error) { console.warn('Could not save prototype state:', error); }

  function esc(value='') {
    return String(value)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#039;');
  }

  function icon(name, className='') {
    return `<svg class="${esc(className)}" aria-hidden="true"><use href="#i-${esc(name)}"/></svg>`;
  }

  function money(value, compact=false) {
    if (!Number.isFinite(value)) return '—';
    if (compact) {
      if (Math.abs(value) >= 1_000_000) return `$${(value/1_000_000).toFixed(value >= 10_000_000 ? 0 : 1)}M`;
      if (Math.abs(value) >= 1_000) return `$${(value/1_000).toFixed(value >= 100_000 ? 0 : 1)}K`;
    }
    return new Intl.NumberFormat('en-US', { style:'currency', currency:'USD', maximumFractionDigits:0 }).format(value);
  }

    const p = PERSON[name] || { initials: name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase(), className:'' };

    const c = clientMeta(code);
    return `<div class="client-logo ${c.className} ${extra}">${esc(c.short)}</div>`;
  }

  function allAssets() {
    const assets = [];
    state.briefs.forEach(brief => brief.concepts.forEach(concept => concept.assets.forEach(asset => {
      assets.push({ ...asset, briefId: brief.id, brief, concept, client: brief.client, name: adName(brief, concept, asset) });
    })));
    return assets;
  }

  function allConcepts() {
    return state.briefs.flatMap(brief => brief.concepts.map(concept => ({ ...concept, brief })));
  }

  function assetById(id) {
    const target = String(id || '').toUpperCase();
    for (const brief of state.briefs) {
      for (const concept of brief.concepts) {
        const asset = concept.assets.find(a => a.id.toUpperCase() === target);
        if (asset) return { asset, concept, brief };
      }
    }
    const orphan = state.orphanWinners.find(a => a.id.toUpperCase() === target);
    if (orphan) return { orphan };
    return null;
  }

  function briefById(id) { return state.briefs.find(b => b.id === id); }

  function adName(brief, concept, asset) {
    const theme = concept.name.replace(/[^a-z0-9]+/gi,'').slice(0,24) || 'Untitled';
    return `${brief.client}_${brief.funnel.replace(/[^a-z0-9]+/gi,'').toUpperCase()}_${brief.platform}_${brief.medium === 'Image' ? 'IMG' : 'VID'}_${brief.type}_${theme}_V${asset.variation}_${asset.id}`;

  function checkpointIndex(brief) {
    if (brief.stageIndex < 2) return 0;
    if (brief.stageIndex < 4) return 1;
    if (brief.stageIndex < 6) return 2;
    return 3;
  }

  function checkpointLabel(brief) { return CHECKPOINTS[checkpointIndex(brief)].label; }

  function launchTimestamp(value='') {
    const clean = String(value || '').replace('Just now', 'Aug 11, 2026 · 11:59 PM');
    const [date, time='12:00 AM'] = clean.split(' · ');
    const parsed = Date.parse(`${date} ${time}`);
    return Number.isFinite(parsed) ? parsed : 0;
  }

    const colors = ['#8f879f','#a855f7','#4f8cff','#3ddbd9','#d946ef','#ffb020','#4f8cff','#3ddbd9','#20d67b'];
    return colors[index] || '#a855f7';
  }

  function workflowBadge(status) {
    const s = String(status || '').toLowerCase();
    if (s.includes('scale')) return 'badge-green';
    if (s.includes('keep') || s.includes('matched') || s.includes('launched')) return 'badge-blue';
    if (s.includes('kill') || s.includes('blocked')) return 'badge-red';
    if (s.includes('rebuild') || s.includes('not launched') || s.includes('warning')) return 'badge-amber';
    if (s.includes('approved') || s.includes('ready') || s.includes('registered')) return 'badge-purple';
