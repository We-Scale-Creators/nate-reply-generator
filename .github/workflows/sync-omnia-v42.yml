name: Verify Omnia V4.3 production source

on:
  push:
    branches:
      - omnia-v4-1-live
    paths:
      - omnia-creative-assets-v4-1/**
      - .github/workflows/sync-omnia-v42.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Omnia branch
        uses: actions/checkout@v4
        with:
          ref: omnia-v4-1-live

      - name: Verify exact V4.3 source
        shell: bash
        run: |
          set -euo pipefail
          TARGET="omnia-creative-assets-v4-1/index.html"
          test "$(wc -c < "$TARGET" | tr -d ' ')" = "443902"
          echo "35a3f9dfab9da386b02ce3cd7359b19c3abbcc1a99d5beb5803b6fa4e63a20e1  $TARGET" | sha256sum --check --strict
          grep -Fq 'OMNIA_V43_COPY_FINALIZE_WORKFLOW' "$TARGET"
          grep -Fq 'Finalize & Export' "$TARGET"
          grep -Fq 'Primary headline' "$TARGET"
          grep -Fq 'Primary body copy' "$TARGET"
          grep -Fq 'data-action="submit-launch-v43"' "$TARGET"
          grep -Fq '"version": "4.3.0"' omnia-creative-assets-v4-1/package.json
          echo "OMNIA_V43_GITHUB_SOURCE_VERIFIED"
