name: Build and publish Omnia V4.5 production source

on:
  push:
    branches:
      - omnia-v4-1-live
    paths:
      - .github/workflows/sync-omnia-v42.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Omnia production branch
        uses: actions/checkout@v4
        with:
          ref: omnia-v4-1-live
          fetch-depth: 0

      - name: Apply and verify the V4.5 partner overview update
        shell: bash
        run: |
          set -euo pipefail
          DIR="omnia-creative-assets-v4-1"
          TARGET="$DIR/index.html"
          PATCH="$DIR/v45.diff.gz.b64"

          test "$(wc -c < "$TARGET" | tr -d ' ')" = "485062"
          echo "8abf3ea130f7da8716ed899b0939fd09277ef9390f91914eb20d7b86b447d4cc  $TARGET" | sha256sum --check --strict

          base64 --decode "$PATCH" | gzip --decompress > /tmp/v45.diff
          (cd "$DIR" && patch -p0 --batch < /tmp/v45.diff)

          test "$(wc -c < "$TARGET" | tr -d ' ')" = "504956"
          echo "3edb54f55b73f5a6bf803733d9d8aa02c3a3d40715e41ca140dd30ac4c94d7e3  $TARGET" | sha256sum --check --strict
          grep -Fq '<title>Omnia — Creative Asset System V4.5 Partner Overview</title>' "$TARGET"
          grep -Fq 'OMNIA_V45_PARTNER_OVERVIEW' "$TARGET"
          grep -Fq 'Active partner creative overview' "$TARGET"
          grep -Fq "SKUP: { name:'Skup'" "$TARGET"
          grep -Fq "LG: { name:'Laundromat Girl'" "$TARGET"
          grep -Fq "TC: { name:'Traders Coaching'" "$TARGET"
          grep -Fq "const V45_PARTNER_ORDER=['BK','CP','DP','SKUP','LG','NBD','TC'];" "$TARGET"
          ! grep -Fq '<div class="topbar-actions">' "$TARGET"
          echo "OMNIA_V45_PATCH_VERIFIED"

      - name: Normalize the deployable V4.5 repository
        shell: bash
        run: |
          set -euo pipefail
          DIR="omnia-creative-assets-v4-1"
          rm -f "$DIR/v45.diff.gz.b64"
          cat > "$DIR/package.json" <<'JSON'
          {
            "name": "omnia-creative-assets-v4-5-live",
            "version": "4.5.0",
            "private": true
          }
          JSON
          cat > "$DIR/vercel.json" <<'JSON'
          {
            "cleanUrls": true,
            "trailingSlash": false
          }
          JSON
          cat > "$DIR/README.md" <<'MD'
          # Omnia Creative Asset System — V4.5 Partner Overview

          Exact production source for the interactive We Scale Creators creative operating-system prototype.

          ## Live production

          https://omnia-creative-assets-v4-1-live.vercel.app

          ## Integrity

          - File: `index.html`
          - Bytes: `504956`
          - SHA-256: `3edb54f55b73f5a6bf803733d9d8aa02c3a3d40715e41ca140dd30ac4c94d7e3`
          - Title: `Omnia — Creative Asset System V4.5 Partner Overview`

          The dashboard is partner-first, preserves all existing workflow stages, and opens each active batch directly at its current stage.
          MD

      - name: Commit the exact V4.5 production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WSC Omnia Automation"
          git config user.email "admin@wescalecreators.com"
          git add -A omnia-creative-assets-v4-1
          if git diff --cached --quiet; then
            echo "Repository is already synchronized."
            exit 0
          fi
          git commit -m "Ship exact Omnia V4.5 partner overview source [skip ci]"
          git push origin HEAD:omnia-v4-1-live
