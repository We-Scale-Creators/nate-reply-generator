name: Sync exact Omnia V4.8 editable-finals production source

on:
  push:
    branches:
      - omnia-v4-1-live
    paths:
      - .github/workflows/sync-omnia-v42.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-production-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Omnia production branch
        uses: actions/checkout@v4
        with:
          ref: omnia-v4-1-live
          fetch-depth: 0

      - name: Fetch and verify the live V4.8 production bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="omnia-creative-assets-v4-1"
          TARGET="$APP_DIR/index.html"
          mkdir -p "$APP_DIR"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "https://omnia-creative-assets-v4-1-live.vercel.app/?github_sync=$(date +%s)" \
            --output "$TARGET"

          test "$(wc -c < "$TARGET" | tr -d ' ')" = "590656"
          echo "b2d1c4a3264f7529bdea748c42a779ba7eed90cee68d1a47f80f57f67d48afa1  $TARGET" | sha256sum --check --strict
          grep -Fq '<title>Omnia — Creative Asset System V4.8 Editable Finals</title>' "$TARGET"
          grep -Fq 'OMNIA_V48_EDITABLE_FINAL_DELIVERIES' "$TARGET"
          grep -Fq 'Only Meta source winners display visually before export' "$TARGET"
          grep -Fq 'replace-final-v48' "$TARGET"
          grep -Fq 'remove-final-v48' "$TARGET"
          grep -Fq 'resubmit-launch-v48' "$TARGET"
          grep -Fq 'Design and Copy remain locked' "$TARGET"
          echo "OMNIA_V48_LIVE_SOURCE_VERIFIED"

      - name: Normalize the deployable repository
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="omnia-creative-assets-v4-1"
          rm -f "$APP_DIR"/*.b64 "$APP_DIR"/*.gz "$APP_DIR"/*.diff "$APP_DIR"/build.mjs

          cat > "$APP_DIR/package.json" <<'JSON'
          {
            "name": "omnia-creative-assets-v4-8-live",
            "version": "4.8.1",
            "private": true
          }
          JSON

          cat > "$APP_DIR/vercel.json" <<'JSON'
          {
            "cleanUrls": true,
            "trailingSlash": false
          }
          JSON

          cat > "$APP_DIR/README.md" <<'MD'
          # Omnia Creative Asset System — V4.8 Editable Finals

          Exact source of the live We Scale Creators creative operating-system prototype.

          ## Live production

          https://omnia-creative-assets-v4-1-live.vercel.app

          ## Final workflow behavior

          - Only Meta source winners appear visually before export; net-new concepts and variations remain Figma-only.
          - Final assets become visible only after export or Google Drive confirmation.
          - Designers can replace or remove a submitted non-live final.
          - Any correction flags the delivery, pauses the media-buyer handoff, and requires a corrected final plus resubmission.
          - Design and Copy remain locked while the final-delivery correction is made.
          - Live permanent asset IDs remain immutable.

          ## Integrity

          - File: `index.html`
          - Bytes: `590656`
          - SHA-256: `b2d1c4a3264f7529bdea748c42a779ba7eed90cee68d1a47f80f57f67d48afa1`
          - Title: `Omnia — Creative Asset System V4.8 Editable Finals`
          MD

      - name: Commit exact production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WSC Omnia Automation"
          git config user.email "admin@wescalecreators.com"
          git add -A omnia-creative-assets-v4-1
          if git diff --cached --quiet; then
            echo "Repository is already synchronized."
            exit 0
          fi
          git commit -m "Ship exact Omnia V4.8 editable-finals production source [skip ci]"
          git push origin HEAD:omnia-v4-1-live
          echo "OMNIA_V48_GITHUB_SOURCE_PUBLISHED"
