name: Build and publish Omnia V4.6 production source

on:
  push:
    branches:
      - omnia-v4-1-live
    paths:
      - .github/workflows/sync-omnia-v42.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Omnia production branch
        uses: actions/checkout@v4
        with:
          ref: omnia-v4-1-live
          fetch-depth: 0

      - name: Apply and verify the V4.6 sticky-rails update
        shell: bash
        run: |
          set -euo pipefail
          TARGET="omnia-creative-assets-v4-1/index.html"
          PATCH_B64="omnia-creative-assets-v4-1/v46.diff.gz.b64"

          test "$(wc -c < "$TARGET" | tr -d ' ')" = "504956"
          echo "3edb54f55b73f5a6bf803733d9d8aa02c3a3d40715e41ca140dd30ac4c94d7e3  $TARGET" | sha256sum --check --strict
          test "$(wc -c < "$PATCH_B64" | tr -d ' ')" = "11981"
          echo "b20259a0e4201a7afa140798b4d96be1bcfbbd5f93c0f9ff4fe8d4ba9c7110a5  $PATCH_B64" | sha256sum --check --strict

          base64 --decode "$PATCH_B64" | gzip -dc > /tmp/v46.diff
          test "$(wc -c < /tmp/v46.diff | tr -d ' ')" = "39016"
          echo "cf2cc814e3fc4aeee7a46e27aa943a57af82e7abbc486b3411fe776fd7135624  /tmp/v46.diff" | sha256sum --check --strict
          patch -p0 --batch < /tmp/v46.diff

          test "$(wc -c < "$TARGET" | tr -d ' ')" = "542795"
          echo "042bb12e322b522eae519792a689a5067e161a7d4cc5567f6683653fb7ae0651  $TARGET" | sha256sum --check --strict
          grep -Fq '<title>Omnia — Creative Asset System V4.6 Sticky Rails</title>' "$TARGET"
          grep -Fq 'OMNIA_V46_STICKY_RAILS_CONCEPT_LAUNCH' "$TARGET"
          grep -Fq 'v46-dashboard-sidebar' "$TARGET"
          grep -Fq 'v46-stage-sidebar' "$TARGET"
          grep -Fq 'v46-launch-concept' "$TARGET"
          grep -Fq 'Media Buyer launch workspace' "$TARGET"

      - name: Normalize the deployable V4.6 repository
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="omnia-creative-assets-v4-1"
          rm -f "$APP_DIR/v46.diff.gz.b64"

          cat > "$APP_DIR/package.json" <<'JSON'
          {
            "name": "omnia-creative-assets-v4-6-live",
            "version": "4.6.0",
            "private": true
          }
          JSON

          cat > "$APP_DIR/vercel.json" <<'JSON'
          {
            "cleanUrls": true,
            "trailingSlash": false
          }
          JSON

          cat > "$APP_DIR/README.md" <<'MD'
          # Omnia Creative Asset System — V4.6 Sticky Rails

          Exact production source for the interactive We Scale Creators creative operating system prototype.

          ## Live production

          https://omnia-creative-assets-v4-1-live.vercel.app

          ## V4.6 changes

          - Creative Capacity and Creative Launch Activity now begin at the top of the dashboard partner overview and remain pinned in a scrolling operating rail.
          - Creative Assets and Media Buyer Queue use standard readable software typography.
          - Every batch stage has a pinned stage-action and submission rail.
          - Launch assets are grouped by finalized concept with independently collapsible variation lists.

          ## Integrity

          - File: `index.html`
          - Bytes: `542795`
          - SHA-256: `042bb12e322b522eae519792a689a5067e161a7d4cc5567f6683653fb7ae0651`
          - Title: `Omnia — Creative Asset System V4.6 Sticky Rails`
          MD

      - name: Commit the exact V4.6 production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WSC Omnia Automation"
          git config user.email "admin@wescalecreators.com"
          git add -A omnia-creative-assets-v4-1
          git commit -m "Ship exact Omnia V4.6 sticky rails source [skip ci]"
          git push origin HEAD:omnia-v4-1-live
          echo "OMNIA_V46_GITHUB_PUBLISHED"
