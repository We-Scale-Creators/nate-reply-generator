name: Build and publish Omnia V4.8 editable-finals source

on:
  push:
    branches:
      - omnia-v4-1-live
    paths:
      - .github/workflows/sync-omnia-v42.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Omnia production branch
        uses: actions/checkout@v4
        with:
          ref: omnia-v4-1-live
          fetch-depth: 0

      - name: Rebuild exact V4.8 source from the verified V4.6 production base
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="omnia-creative-assets-v4-1"
          TARGET="$APP_DIR/index.html"
          PATCH_B64="$APP_DIR/v48.diff.gz.b64"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "https://omnia-creative-assets-v4-1-live.vercel.app/?github_v48_base=1" \
            --output /tmp/v46-production.html

          test "$(wc -c < /tmp/v46-production.html | tr -d ' ')" = "542795"
          echo "042bb12e322b522eae519792a689a5067e161a7d4cc5567f6683653fb7ae0651  /tmp/v46-production.html" | sha256sum --check --strict
          test "$(wc -c < "$PATCH_B64" | tr -d ' ')" = "11512"
          echo "181512ffdf73ce20d023ac7ef6b00b23e2910e262db6a57e0058e261e3adc5b2  $PATCH_B64" | sha256sum --check --strict

          base64 --decode "$PATCH_B64" | gzip -dc > /tmp/v48.diff
          test "$(wc -c < /tmp/v48.diff | tr -d ' ')" = "36427"
          echo "a8526110c0df3dc8271bd7ba5d8a8d1d54c45c96a160a099ec11506ea7225d08  /tmp/v48.diff" | sha256sum --check --strict

          cp /tmp/v46-production.html "$TARGET"
          (
            cd "$APP_DIR"
            patch -p0 --batch < /tmp/v48.diff
          )

          test "$(wc -c < "$TARGET" | tr -d ' ')" = "578244"
          echo "2f9741cda598389f57c3a5b352809fc5d49407055c85fe8ca758c89b089ab116  $TARGET" | sha256sum --check --strict
          grep -Fq '<title>Omnia — Creative Asset System V4.8 Editable Finals</title>' "$TARGET"
          grep -Fq 'OMNIA_V47_FIGMA_UNTIL_DRIVE' "$TARGET"
          grep -Fq 'OMNIA_V48_EDITABLE_FINAL_DELIVERIES' "$TARGET"
          grep -Fq 'Replace final' "$TARGET"
          grep -Fq 'Remove final' "$TARGET"
          grep -Fq 'Launch handoff reopened' "$TARGET"
          echo "OMNIA_V48_SOURCE_REBUILT_AND_VERIFIED"

      - name: Normalize the deployable V4.8 repository
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="omnia-creative-assets-v4-1"
          rm -f \
            "$APP_DIR/v46.diff.gz.b64" \
            "$APP_DIR/v47.diff.gz.b64" \
            "$APP_DIR/v47.part0.b64" \
            "$APP_DIR/v47.part1.b64" \
            "$APP_DIR/v47.part2.b64" \
            "$APP_DIR/v47.part3a.b64" \
            "$APP_DIR/v47.part3b.b64" \
            "$APP_DIR/v48.diff.gz.b64"

          cat > "$APP_DIR/package.json" <<'JSON'
          {
            "name": "omnia-creative-assets-v4-8-live",
            "version": "4.8.0",
            "private": true
          }
          JSON

          cat > "$APP_DIR/vercel.json" <<'JSON'
          {
            "cleanUrls": true,
            "trailingSlash": false
          }
          JSON

          cat > "$APP_DIR/README.md" <<'MD'
          # Omnia Creative Asset System — V4.8 Editable Finals

          Exact production source for the final reviewed We Scale Creators creative operating-system prototype.

          ## Live production

          https://omnia-creative-assets-v4-1-live.vercel.app

          ## V4.8 final-delivery behavior

          - Source-winner images can display from Meta; unexported concept and variation work remains Figma-only.
          - Final images enter Omnia only after export or Drive confirmation.
          - Designers can replace or remove a submitted final without unlocking Design or Copy.
          - Correcting a submitted final reopens and blocks the media-buyer handoff until the revised final is attached and the batch is resubmitted.
          - The affected asset moves to Rebuild Required so stale launch files cannot be used silently.

          ## Integrity

          - File: `index.html`
          - Bytes: `578244`
          - SHA-256: `2f9741cda598389f57c3a5b352809fc5d49407055c85fe8ca758c89b089ab116`
          - Runtime title: `Omnia — Creative Asset System V4.8 Editable Finals`
          MD

      - name: Commit the exact V4.8 production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WSC Omnia Automation"
          git config user.email "admin@wescalecreators.com"
          git add -A omnia-creative-assets-v4-1
          if git diff --cached --quiet; then
            echo "Repository is already synchronized."
            exit 0
          fi
          git commit -m "Ship exact Omnia V4.8 editable-finals source [skip ci]"
          git push origin HEAD:omnia-v4-1-live
          echo "OMNIA_V48_GITHUB_PUBLISHED"
