name: Build and publish Omnia V4.7 production source

on:
  push:
    branches:
      - omnia-v4-1-live
    paths:
      - .github/workflows/sync-omnia-v42.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Omnia production branch
        uses: actions/checkout@v4
        with:
          ref: omnia-v4-1-live
          fetch-depth: 0

      - name: Apply and verify the V4.7 Figma-first update
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="omnia-creative-assets-v4-1"
          TARGET="$APP_DIR/index.html"
          PATCH_B64="/tmp/v47.diff.gz.b64"

          test "$(wc -c < "$TARGET" | tr -d ' ')" = "504956"
          echo "3edb54f55b73f5a6bf803733d9d8aa02c3a3d40715e41ca140dd30ac4c94d7e3  $TARGET" | sha256sum --check --strict

          for PART in \
            "$APP_DIR/v47.part0.b64" \
            "$APP_DIR/v47.part1.b64" \
            "$APP_DIR/v47.part2.b64" \
            "$APP_DIR/v47.part3a.b64" \
            "$APP_DIR/v47.part3b.b64"; do
            test -s "$PART"
          done

          test "$(wc -c < "$APP_DIR/v47.part0.b64" | tr -d ' ')" = "5212"
          test "$(wc -c < "$APP_DIR/v47.part1.b64" | tr -d ' ')" = "5212"
          test "$(wc -c < "$APP_DIR/v47.part2.b64" | tr -d ' ')" = "5212"
          test "$(wc -c < "$APP_DIR/v47.part3a.b64" | tr -d ' ')" = "2606"
          test "$(wc -c < "$APP_DIR/v47.part3b.b64" | tr -d ' ')" = "2606"

          echo "d6b225d7ac7d89c05e03b5abf29229e9c6a3a48a8e3d6350662cd36c476c0dd0  $APP_DIR/v47.part0.b64" | sha256sum --check --strict
          echo "93802b0a130d42778b710d6603071462238cd48610d5fc0167fa792d57036c74  $APP_DIR/v47.part1.b64" | sha256sum --check --strict
          echo "2783383f2f37f8a758e74c650f809666eb85942a644e27f2f23d328378c5327e  $APP_DIR/v47.part2.b64" | sha256sum --check --strict
          echo "b2761222f70455820c9c0527d5bc6c7a4dab37b6988864ae5c19e4c34b2a4bcc  $APP_DIR/v47.part3a.b64" | sha256sum --check --strict
          echo "ba218c84a620a180e407102eac571d89b58d813d9010e14b04a308b091c70ecf  $APP_DIR/v47.part3b.b64" | sha256sum --check --strict

          cat \
            "$APP_DIR/v47.part0.b64" \
            "$APP_DIR/v47.part1.b64" \
            "$APP_DIR/v47.part2.b64" \
            "$APP_DIR/v47.part3a.b64" \
            "$APP_DIR/v47.part3b.b64" > "$PATCH_B64"

          test "$(wc -c < "$PATCH_B64" | tr -d ' ')" = "20848"
          echo "2d7a4d75922e9805430ff4e0d796788ae26c1fb74eef33c33296b7ff8b3236f0  $PATCH_B64" | sha256sum --check --strict

          base64 --decode "$PATCH_B64" | gzip -dc > /tmp/v47.diff
          test "$(wc -c < /tmp/v47.diff | tr -d ' ')" = "71842"
          echo "31cd681787833e7dd9b56b838e0bd85c395e9adfe041ef813e7933d5254e6b58  /tmp/v47.diff" | sha256sum --check --strict
          (
            cd "$APP_DIR"
            patch -p0 --batch < /tmp/v47.diff
          )

          test "$(wc -c < "$TARGET" | tr -d ' ')" = "568738"
          echo "d41fdfed5c70f2772115c385c1db2edd49a386f555576bacb137ea9f56fbca2e  $TARGET" | sha256sum --check --strict
          grep -Fq '<title>Omnia — Creative Asset System V4.6 Sticky Rails</title>' "$TARGET"
          grep -Fq "document.title='Omnia — Creative Asset System V4.7 Figma-first';" "$TARGET"
          grep -Fq 'OMNIA_V47_FIGMA_FIRST_PREVIEW_LIFECYCLE' "$TARGET"
          grep -Fq 'Registered in Figma' "$TARGET"
          grep -Fq 'No artificial design previews.' "$TARGET"
          grep -Fq 'Preview lifecycle:' "$TARGET"
          grep -Fq 'A thumbnail enters Omnia only after the final file is exported for Google Drive.' "$TARGET"

      - name: Normalize the deployable V4.7 repository
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="omnia-creative-assets-v4-1"
          rm -f \
            "$APP_DIR/v46.diff.gz.b64" \
            "$APP_DIR/v47.diff.gz.b64" \
            "$APP_DIR/v47.part0.b64" \
            "$APP_DIR/v47.part1.b64" \
            "$APP_DIR/v47.part2.b64" \
            "$APP_DIR/v47.part3a.b64" \
            "$APP_DIR/v47.part3b.b64"

          cat > "$APP_DIR/package.json" <<'JSON'
          {
            "name": "omnia-creative-assets-v4-7-live",
            "version": "4.7.0",
            "private": true
          }
          JSON

          cat > "$APP_DIR/vercel.json" <<'JSON'
          {
            "cleanUrls": true,
            "trailingSlash": false
          }
          JSON

          cat > "$APP_DIR/README.md" <<'MD'
          # Omnia Creative Asset System — V4.7 Figma-first

          Exact production source for the interactive We Scale Creators creative operating system prototype.

          ## Live production

          https://omnia-creative-assets-v4-1-live.vercel.app

          ## V4.7 changes

          - Source-winner images may display because they come from Meta.
          - Net-new concepts and variations remain text-only in Design and Copy while the visual work lives in Figma.
          - Design completion is based on registering the requested Figma variations, not uploading premature final files.
          - Finalize & Export shows no current-creative preview until the designer exports the file for Google Drive.
          - Exported finals then become visible and flow into Launch.

          ## Integrity

          - File: `index.html`
          - Bytes: `568738`
          - SHA-256: `d41fdfed5c70f2772115c385c1db2edd49a386f555576bacb137ea9f56fbca2e`
          - Runtime title: `Omnia — Creative Asset System V4.7 Figma-first`
          MD

      - name: Commit the exact V4.7 production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WSC Omnia Automation"
          git config user.email "admin@wescalecreators.com"
          git add -A omnia-creative-assets-v4-1
          if git diff --cached --quiet; then
            echo "Repository is already synchronized."
            exit 0
          fi
          git commit -m "Ship exact Omnia V4.7 Figma-first source [skip ci]"
          git push origin HEAD:omnia-v4-1-live
          echo "OMNIA_V47_GITHUB_PUBLISHED"
